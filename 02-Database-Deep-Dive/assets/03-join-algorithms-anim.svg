<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL Physical Join Algorithms</title>
  <desc id="desc">Side-by-side animated comparison of Nested Loop Join, Hash Join (Build and Probe phases), and Merge Join (two-pointer sorted merge).</desc>
  <defs>
    <style><![CDATA[
      .bg { fill: #0f172a; }
      .outer-card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.3; }
      .box { fill: #1e293b; stroke: #475569; stroke-width: 1.2; }
      .title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #94a3b8; }
      .panel-title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
      .label-dim { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #f8fafc; }
      .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #cbd5e1; }

      .badge-blue { fill: #0c4a6e; stroke: #38bdf8; stroke-width: 1.2; }
      .badge-amber { fill: #451a03; stroke: #f59e0b; stroke-width: 1.2; }
      .badge-green { fill: #064e3b; stroke: #10b981; stroke-width: 1.2; }
      .text-blue { fill: #7dd3fc; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 700; }
      .text-amber { fill: #fcd34d; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 700; }
      .text-green { fill: #6ee7b7; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 700; }

      .flow-blue { stroke: #38bdf8; stroke-width: 2; fill: none; stroke-dasharray: 5 4; animation: dashMove 1.2s linear infinite; }
      .flow-amber { stroke: #f59e0b; stroke-width: 2; fill: none; stroke-dasharray: 5 4; animation: dashMove 1.2s linear infinite; }
      .flow-green { stroke: #10b981; stroke-width: 2; fill: none; stroke-dasharray: 5 4; animation: dashMove 1.2s linear infinite; }

      .nl-row1 { animation: nlPulse1 4.5s infinite; }
      .nl-row2 { animation: nlPulse2 4.5s infinite; }
      .mj-match1 { animation: mjMatchA 4.5s infinite; }
      .mj-match2 { animation: mjMatchB 4.5s infinite; }

      @keyframes dashMove {
        to { stroke-dashoffset: -18; }
      }
      @keyframes nlPulse1 {
        0%, 45%, 100% { stroke: #475569; fill: #1e293b; }
        10%, 35% { stroke: #38bdf8; fill: #0c4a6e; }
      }
      @keyframes nlPulse2 {
        0%, 45%, 100% { stroke: #475569; fill: #1e293b; }
        55%, 85% { stroke: #38bdf8; fill: #0c4a6e; }
      }
      @keyframes mjMatchA {
        0%, 20%, 55%, 100% { stroke: #475569; fill: #1e293b; }
        28%, 48% { stroke: #10b981; fill: #064e3b; }
      }
      @keyframes mjMatchB {
        0%, 55%, 90%, 100% { stroke: #475569; fill: #1e293b; }
        62%, 82% { stroke: #10b981; fill: #064e3b; }
      }
    ]]></style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="0" y="0" width="960" height="520" rx="14" class="bg"/>
  <rect x="12" y="12" width="936" height="496" rx="10" class="outer-card"/>

  <!-- Header -->
  <text x="32" y="44" class="title">PostgreSQL Physical Join Algorithms</text>
  <text x="32" y="65" class="subtitle">Planner chooses based on row estimates, available indexes, sort order, and work_mem</text>

  <!-- ==================== PANEL 1: NESTED LOOP JOIN ==================== -->
  <g transform="translate(28, 84)">
    <rect x="0" y="0" width="290" height="404" rx="10" class="panel"/>
    <text x="16" y="26" class="panel-title">1. Nested Loop Join</text>
    <rect x="16" y="36" width="150" height="22" rx="4" class="badge-blue"/>
    <text x="91" y="51" text-anchor="middle" class="text-blue">O(N * log M) w/ Index</text>

    <!-- Outer Table -->
    <text x="16" y="82" class="label">Outer Table (R)</text>
    <rect x="16" y="90" width="92" height="32" rx="5" class="nl-row1"/>
    <text x="62" y="110" text-anchor="middle" class="mono">id = 1</text>
    <rect x="16" y="130" width="92" height="32" rx="5" class="nl-row2"/>
    <text x="62" y="150" text-anchor="middle" class="mono">id = 2</text>
    <rect x="16" y="170" width="92" height="32" rx="5" class="box"/>
    <text x="62" y="190" text-anchor="middle" class="mono">id = 3</text>

    <!-- Inner Table / Index -->
    <text x="164" y="82" class="label">Inner Index (S)</text>
    <rect x="164" y="90" width="110" height="112" rx="6" class="box"/>
    <text x="219" y="114" text-anchor="middle" class="mono-sm">B-Tree Lookup</text>
    <rect x="176" y="124" width="86" height="22" rx="4" class="nl-row1"/>
    <text x="219" y="139" text-anchor="middle" class="mono-sm">fk=1 -&gt; match</text>
    <rect x="176" y="152" width="86" height="22" rx="4" class="nl-row2"/>
    <text x="219" y="167" text-anchor="middle" class="mono-sm">fk=2 -&gt; match</text>

    <!-- Probe Arrows -->
    <path d="M 108 106 L 162 135" class="flow-blue" marker-end="url(#arr-blue)"/>
    <path d="M 108 146 L 162 163" class="flow-blue" marker-end="url(#arr-blue)"/>

    <!-- Animated Probe Dot -->
    <circle r="4.5" fill="#38bdf8">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M 108 106 L 174 135 L 108 146 L 174 163" keyPoints="0;0.45;0.5;1" keyTimes="0;0.4;0.5;0.95" calcMode="linear"/>
    </circle>

    <!-- Output -->
    <rect x="16" y="226" width="258" height="44" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <text x="145" y="245" text-anchor="middle" class="label" fill="#e0f2fe">For each outer row: probe inner</text>
    <text x="145" y="261" text-anchor="middle" class="mono-sm" fill="#7dd3fc">Low startup cost; fast for LIMIT</text>

    <!-- Summary Footer -->
    <text x="16" y="300" class="label">When Planner Picks It:</text>
    <text x="16" y="320" class="label-dim">- Small outer result set (&lt; 1k rows)</text>
    <text x="16" y="338" class="label-dim">- Inner join column is indexed</text>
    <text x="16" y="356" class="label-dim">- Non-equijoins (&lt;, &gt;, BETWEEN)</text>
    <text x="16" y="382" class="mono-sm" fill="#f87171">Risk: High nloops if stats stale!</text>
  </g>

  <!-- ==================== PANEL 2: HASH JOIN ==================== -->
  <g transform="translate(335, 84)">
    <rect x="0" y="0" width="290" height="404" rx="10" class="panel"/>
    <text x="16" y="26" class="panel-title">2. Hash Join (Build + Probe)</text>
    <rect x="16" y="36" width="155" height="22" rx="4" class="badge-amber"/>
    <text x="93" y="51" text-anchor="middle" class="text-amber">O(N + M) in work_mem</text>

    <!-- Build Phase -->
    <text x="16" y="82" class="label" fill="#fcd34d">1. Build (Small R)</text>
    <rect x="16" y="90" width="76" height="90" rx="6" class="box"/>
    <text x="54" y="112" text-anchor="middle" class="mono-sm">k=10</text>
    <text x="54" y="136" text-anchor="middle" class="mono-sm">k=25</text>
    <text x="54" y="160" text-anchor="middle" class="mono-sm">k=42</text>

    <!-- Hash Table -->
    <text x="116" y="82" class="label">Hash Table</text>
    <rect x="112" y="90" width="84" height="90" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="154" y="110" text-anchor="middle" class="mono-sm" fill="#fcd34d">h(10) -&gt; b0</text>
    <text x="154" y="135" text-anchor="middle" class="mono-sm" fill="#fcd34d">h(25) -&gt; b1</text>
    <text x="154" y="160" text-anchor="middle" class="mono-sm" fill="#fcd34d">h(42) -&gt; b2</text>

    <!-- Probe Phase -->
    <text x="210" y="82" class="label" fill="#38bdf8">2. Probe (S)</text>
    <rect x="210" y="90" width="64" height="90" rx="6" class="box"/>
    <text x="242" y="114" text-anchor="middle" class="mono-sm">k=42</text>
    <text x="242" y="138" text-anchor="middle" class="mono-sm">k=10</text>
    <text x="242" y="162" text-anchor="middle" class="mono-sm">k=99</text>

    <path d="M 92 135 L 110 135" class="flow-amber" marker-end="url(#arr-amber)"/>
    <path d="M 210 135 L 198 135" class="flow-blue" marker-end="url(#arr-blue)"/>

    <!-- Animated Build & Probe Dots -->
    <circle r="4.5" fill="#f59e0b">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M 54 112 L 154 110 M 54 160 L 154 160" keyPoints="0;0.45;0.5;1" keyTimes="0;0.4;0.5;0.9" calcMode="linear"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#38bdf8">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M 242 114 L 154 160 L 154 224" keyPoints="0;0;0.5;1" keyTimes="0;0.45;0.75;0.95" calcMode="linear"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.92;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Output -->
    <rect x="16" y="226" width="258" height="44" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="145" y="245" text-anchor="middle" class="label" fill="#fef3c7">O(1) bucket probe per outer row</text>
    <text x="145" y="261" text-anchor="middle" class="mono-sm" fill="#fcd34d">High startup cost (build phase)</text>

    <!-- Summary Footer -->
    <text x="16" y="300" class="label">When Planner Picks It:</text>
    <text x="16" y="320" class="label-dim">- Unsorted medium/large tables</text>
    <text x="16" y="338" class="label-dim">- Equality join (=) only</text>
    <text x="16" y="356" class="label-dim">- Inner table fits in work_mem</text>
    <text x="16" y="382" class="mono-sm" fill="#fcd34d">Tip: Spills to disk if &gt; work_mem</text>
  </g>

  <!-- ==================== PANEL 3: MERGE JOIN ==================== -->
  <g transform="translate(642, 84)">
    <rect x="0" y="0" width="290" height="404" rx="10" class="panel"/>
    <text x="16" y="26" class="panel-title">3. Merge Join (Sorted)</text>
    <rect x="16" y="36" width="180" height="22" rx="4" class="badge-green"/>
    <text x="106" y="51" text-anchor="middle" class="text-green">O(N + M) if Pre-Sorted</text>

    <!-- Sorted Stream R -->
    <text x="16" y="82" class="label">Sorted Stream R (i)</text>
    <rect x="16" y="90" width="54" height="28" rx="4" class="box"/>
    <text x="43" y="108" text-anchor="middle" class="mono">1</text>
    <rect x="76" y="90" width="54" height="28" rx="4" class="mj-match1"/>
    <text x="103" y="108" text-anchor="middle" class="mono">3</text>
    <rect x="136" y="90" width="54" height="28" rx="4" class="mj-match2"/>
    <text x="163" y="108" text-anchor="middle" class="mono">5</text>
    <rect x="196" y="90" width="54" height="28" rx="4" class="box"/>
    <text x="223" y="108" text-anchor="middle" class="mono">8</text>

    <!-- Sorted Stream S -->
    <text x="16" y="152" class="label">Sorted Stream S (j)</text>
    <rect x="16" y="160" width="54" height="28" rx="4" class="box"/>
    <text x="43" y="178" text-anchor="middle" class="mono">2</text>
    <rect x="76" y="160" width="54" height="28" rx="4" class="mj-match1"/>
    <text x="103" y="178" text-anchor="middle" class="mono">3</text>
    <rect x="136" y="160" width="54" height="28" rx="4" class="mj-match2"/>
    <text x="163" y="178" text-anchor="middle" class="mono">5</text>
    <rect x="196" y="160" width="54" height="28" rx="4" class="box"/>
    <text x="223" y="178" text-anchor="middle" class="mono">9</text>

    <!-- Match lines -->
    <path d="M 103 118 L 103 160" class="flow-green"/>
    <path d="M 163 118 L 163 160" class="flow-green"/>

    <!-- Animated Pointer Indicator -->
    <rect x="38" y="124" width="10" height="4" rx="2" fill="#10b981">
      <animate attributeName="x" values="38;98;158;218" keyTimes="0;0.33;0.66;1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="38" y="148" width="10" height="4" rx="2" fill="#10b981">
      <animate attributeName="x" values="38;98;158;218" keyTimes="0;0.33;0.66;1" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Output -->
    <rect x="16" y="226" width="258" height="44" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="145" y="245" text-anchor="middle" class="label" fill="#ecfdf5">Single linear pass (two pointers)</text>
    <text x="145" y="261" text-anchor="middle" class="mono-sm" fill="#6ee7b7">Emits output in sorted order</text>

    <!-- Summary Footer -->
    <text x="16" y="300" class="label">When Planner Picks It:</text>
    <text x="16" y="320" class="label-dim">- Both inputs pre-sorted (B-Tree)</text>
    <text x="16" y="338" class="label-dim">- Very large tables (&gt; work_mem)</text>
    <text x="16" y="356" class="label-dim">- Query also has ORDER BY join_key</text>
    <text x="16" y="382" class="mono-sm" fill="#6ee7b7">Tip: Zero extra sort if indexed!</text>
  </g>
</svg>
