<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Parking Lot LLD Flow</title>
  <desc>Animated flow diagram of a thread-safe Parking Lot Low-Level Design from Entry Gate through SpotAssignmentStrategy, ReentrantLock, Ticket issuance, Exit Gate PricingStrategy, and Payment and Spot Release.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .flow-line {
        fill: none;
        stroke: #475569;
        stroke-width: 2.2;
        stroke-dasharray: 6 5;
        animation: dashMove 1.4s linear infinite;
      }
      .feedback-line {
        fill: none;
        stroke: #34d399;
        stroke-width: 1.8;
        stroke-dasharray: 4 4;
        opacity: 0.75;
        animation: dashMove 1.8s linear infinite;
      }
      .lock-pulse {
        animation: lockGlow 2.2s ease-in-out infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -22; }
      }
      @keyframes lockGlow {
        0%, 100% { stroke: #f59e0b; stroke-opacity: 0.65; }
        50% { stroke: #fbbf24; stroke-opacity: 1; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0" y="0" width="900" height="320" rx="14" fill="#0f172a"/>
  <rect x="8" y="8" width="884" height="304" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="36" class="sans" font-size="16" font-weight="700" fill="#f8fafc">Parking Lot LLD — Concurrent Entry &amp; Exit Pipeline</text>
  <text x="32" y="53" class="mono" font-size="11" fill="#94a3b8">Strategy Pattern • ReentrantLock Per-Spot Synchronization • Observer DisplayBoard</text>

  <!-- Status Pill -->
  <rect x="744" y="22" width="124" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="760" cy="34" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="771" y="38" class="mono" font-size="10.5" fill="#cbd5e1">THREAD-SAFE</text>

  <!-- Connector Paths -->
  <!-- 1 -> 2 -->
  <path d="M 270 108 L 328 108" class="flow-line" marker-end="url(#arrow)"/>
  <!-- 2 -> 3 -->
  <path d="M 565 108 L 623 108" class="flow-line" marker-end="url(#arrow)"/>
  <!-- 3 -> 4 (down) -->
  <path d="M 745 146 L 745 186" class="flow-line" marker-end="url(#arrow)"/>
  <!-- 4 -> 5 (left) -->
  <path d="M 630 232 L 572 232" class="flow-line" marker-end="url(#arrow)"/>
  <!-- 5 -> 6 (left) -->
  <path d="M 335 232 L 277 232" class="flow-line" marker-end="url(#arrow)"/>
  <!-- 6 -> 2 feedback (spot freed -> strategy pool) -->
  <path d="M 155 192 L 155 168 L 450 168 L 450 152" class="feedback-line" marker-end="url(#arrow-green)"/>
  <text x="302" y="163" class="mono" font-size="9.5" fill="#34d399" text-anchor="middle">spot freed &amp; board notified</text>

  <!-- Node 1: Entry Gate -->
  <g transform="translate(40,70)">
    <rect width="230" height="76" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
    <rect x="0" y="0" width="6" height="76" rx="3" fill="#38bdf8"/>
    <text x="18" y="25" class="sans" font-size="13" font-weight="700" fill="#f1f5f9">1. Entry Gate</text>
    <text x="18" y="44" class="mono" font-size="10.5" fill="#94a3b8">Vehicle(plate, VehicleType)</text>
    <text x="18" y="61" class="sans" font-size="10.5" fill="#38bdf8">Read plate &amp; request spot</text>
  </g>

  <!-- Node 2: SpotAssignmentStrategy -->
  <g transform="translate(335,70)">
    <rect width="230" height="76" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.6"/>
    <rect x="0" y="0" width="6" height="76" rx="3" fill="#818cf8"/>
    <text x="18" y="25" class="sans" font-size="13" font-weight="700" fill="#f1f5f9">2. SpotAssignmentStrategy</text>
    <text x="18" y="44" class="mono" font-size="10.5" fill="#94a3b8">Nearest / Floor-Ordered</text>
    <text x="18" y="61" class="sans" font-size="10.5" fill="#a5b4fc">Select eligible free spot</text>
  </g>

  <!-- Node 3: Atomic Spot Lock -->
  <g transform="translate(630,70)">
    <rect width="230" height="76" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" class="lock-pulse"/>
    <rect x="0" y="0" width="6" height="76" rx="3" fill="#f59e0b"/>
    <text x="18" y="25" class="sans" font-size="13" font-weight="700" fill="#f1f5f9">3. Atomic Spot Lock</text>
    <text x="18" y="44" class="mono" font-size="10.5" fill="#fbbf24">ReentrantLock.tryLock()</text>
    <text x="18" y="61" class="sans" font-size="10.5" fill="#94a3b8">Prevent double-booking</text>
  </g>

  <!-- Node 4: Ticket Issued -->
  <g transform="translate(630,194)">
    <rect width="230" height="76" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.6"/>
    <rect x="0" y="0" width="6" height="76" rx="3" fill="#34d399"/>
    <text x="18" y="25" class="sans" font-size="13" font-weight="700" fill="#f1f5f9">4. Ticket Issued</text>
    <text x="18" y="44" class="mono" font-size="10.5" fill="#94a3b8">Ticket(id, spotId, entryAt)</text>
    <text x="18" y="61" class="sans" font-size="10.5" fill="#34d399">Stored in ConcurrentHashMap</text>
  </g>

  <!-- Node 5: Exit Gate -->
  <g transform="translate(335,194)">
    <rect width="230" height="76" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.6"/>
    <rect x="0" y="0" width="6" height="76" rx="3" fill="#c084fc"/>
    <text x="18" y="25" class="sans" font-size="13" font-weight="700" fill="#f1f5f9">5. Exit Gate</text>
    <text x="18" y="44" class="mono" font-size="10.5" fill="#94a3b8">PricingStrategy.calculate()</text>
    <text x="18" y="61" class="sans" font-size="10.5" fill="#d8b4fe">Hourly / Flat / Surge fee</text>
  </g>

  <!-- Node 6: Payment & Spot Release -->
  <g transform="translate(40,194)">
    <rect width="230" height="76" rx="10" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.6"/>
    <rect x="0" y="0" width="6" height="76" rx="3" fill="#2dd4bf"/>
    <text x="18" y="25" class="sans" font-size="13" font-weight="700" fill="#f1f5f9">6. Payment &amp; Spot Release</text>
    <text x="18" y="44" class="mono" font-size="10.5" fill="#94a3b8">spot.release() + notify()</text>
    <text x="18" y="61" class="sans" font-size="10.5" fill="#5eead4">Settle fee &amp; update board</text>
  </g>

  <!-- Animated Request Token traveling through the full lifecycle -->
  <circle r="5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="6.5s" repeatCount="indefinite"
      path="M 155 108 L 450 108 L 745 108 L 745 232 L 450 232 L 155 232"/>
    <animate attributeName="fill"
      values="#38bdf8;#818cf8;#f59e0b;#34d399;#c084fc;#2dd4bf"
      dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Footer legend -->
  <text x="40" y="297" class="mono" font-size="10" fill="#64748b">O(log N) heap/tree lookup or O(F * S) scan • Per-spot lock avoids global bottleneck</text>
</svg>
