<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Amazon Leadership Principles and Bar Raiser Signal Compass</title>
  <desc id="desc">Animated compass showing six core Amazon Leadership Principles sending signal pulses toward the central Bar Raiser L5 evaluation hub.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Signal paths from each LP node to center (450, 178) -->
    <path id="p1" d="M 215,82 L 450,178"/>
    <path id="p2" d="M 185,178 L 450,178"/>
    <path id="p3" d="M 215,274 L 450,178"/>
    <path id="p4" d="M 685,82 L 450,178"/>
    <path id="p5" d="M 715,178 L 450,178"/>
    <path id="p6" d="M 685,274 L 450,178"/>
  </defs>

  <style>
    .title-text { font: 700 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; letter-spacing: 0.4px; }
    .sub-text { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
    .node-title { font: 700 12px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; }
    .node-sub { font: 500 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
    .hub-title { font: 800 13px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #fef3c7; }
    .hub-sub { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fcd34d; }
    .signal-line { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .node-box { fill: #0f172a; stroke-width: 1.5; rx: 10; ry: 10; }
    .compass-ring { fill: none; stroke: #334155; stroke-width: 1; stroke-dasharray: 3 5; }
    @keyframes pulseRing {
      0%, 100% { stroke-opacity: 0.35; transform: scale(1); }
      50% { stroke-opacity: 0.85; transform: scale(1.04); }
    }
    @keyframes hubBeat {
      0%, 100% { stroke-width: 2; }
      50% { stroke-width: 3.5; }
    }
    .ring-anim {
      transform-origin: 450px 178px;
      animation: pulseRing 3.2s ease-in-out infinite;
    }
    .hub-circle {
      animation: hubBeat 2.4s ease-in-out infinite;
    }
  </style>

  <!-- Outer Card -->
  <rect x="6" y="6" width="888" height="328" rx="14" ry="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="6" y="6" width="888" height="3" rx="2" fill="url(#cardStroke)"/>

  <!-- Header -->
  <text x="28" y="34" class="title-text">AMAZON LEADERSHIP PRINCIPLES — BAR RAISER SIGNAL COMPASS</text>
  <text x="872" y="34" text-anchor="end" class="sub-text">L5 IMPACT • METRICS • OWNERSHIP</text>

  <!-- Compass Background Rings -->
  <circle cx="450" cy="178" r="126" class="compass-ring"/>
  <circle cx="450" cy="178" r="88" class="compass-ring ring-anim" stroke="#f59e0b"/>
  <circle cx="450" cy="178" r="78" fill="url(#hubGlow)"/>

  <!-- Connection Lines -->
  <use href="#p1" class="signal-line"/>
  <use href="#p2" class="signal-line"/>
  <use href="#p3" class="signal-line"/>
  <use href="#p4" class="signal-line"/>
  <use href="#p5" class="signal-line"/>
  <use href="#p6" class="signal-line"/>

  <!-- Animated Signal Pulses (SMIL animateMotion) -->
  <circle r="4" fill="#38bdf8" filter="url(#softGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0s">
      <mpath href="#p1"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="4" fill="#34d399" filter="url(#softGlow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.4s">
      <mpath href="#p2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle r="4" fill="#a855f7" filter="url(#softGlow)">
    <animateMotion dur="2.3s" repeatCount="indefinite" begin="0.8s">
      <mpath href="#p3"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.3s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle r="4" fill="#fbbf24" filter="url(#softGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.2s">
      <mpath href="#p4"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle r="4" fill="#f472b6" filter="url(#softGlow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="0.6s">
      <mpath href="#p5"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle r="4" fill="#4ade80" filter="url(#softGlow)">
    <animateMotion dur="2.1s" repeatCount="indefinite" begin="1.0s">
      <mpath href="#p6"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.1s" repeatCount="indefinite" begin="1.0s"/>
  </circle>

  <!-- Left Column LP Nodes -->
  <!-- 1. Customer Obsession -->
  <g transform="translate(28, 56)">
    <rect width="192" height="52" rx="10" ry="10" class="node-box" stroke="#38bdf8"/>
    <circle cx="16" cy="26" r="5" fill="#38bdf8"/>
    <text x="30" y="23" class="node-title">Customer Obsession</text>
    <text x="30" y="39" class="node-sub">Pain points &amp; outcomes</text>
  </g>

  <!-- 2. Ownership -->
  <g transform="translate(20, 152)">
    <rect width="172" height="52" rx="10" ry="10" class="node-box" stroke="#34d399"/>
    <circle cx="16" cy="26" r="5" fill="#34d399"/>
    <text x="30" y="23" class="node-title">Ownership</text>
    <text x="30" y="39" class="node-sub">End-to-end accountability</text>
  </g>

  <!-- 3. Invent & Simplify -->
  <g transform="translate(28, 248)">
    <rect width="192" height="52" rx="10" ry="10" class="node-box" stroke="#a855f7"/>
    <circle cx="16" cy="26" r="5" fill="#a855f7"/>
    <text x="30" y="23" class="node-title">Invent &amp; Simplify</text>
    <text x="30" y="39" class="node-sub">Pragmatic, low-complexity</text>
  </g>

  <!-- Right Column LP Nodes -->
  <!-- 4. Dive Deep -->
  <g transform="translate(680, 56)">
    <rect width="192" height="52" rx="10" ry="10" class="node-box" stroke="#fbbf24"/>
    <circle cx="16" cy="26" r="5" fill="#fbbf24"/>
    <text x="30" y="23" class="node-title">Dive Deep</text>
    <text x="30" y="39" class="node-sub">Root cause &amp; data rigor</text>
  </g>

  <!-- 5. Have Backbone; Disagree & Commit -->
  <g transform="translate(688, 152)">
    <rect width="192" height="52" rx="10" ry="10" class="node-box" stroke="#f472b6"/>
    <circle cx="16" cy="26" r="5" fill="#f472b6"/>
    <text x="30" y="22" class="node-title">Have Backbone;</text>
    <text x="30" y="38" class="node-sub">Disagree &amp; Commit</text>
  </g>

  <!-- 6. Deliver Results -->
  <g transform="translate(680, 248)">
    <rect width="192" height="52" rx="10" ry="10" class="node-box" stroke="#4ade80"/>
    <circle cx="16" cy="26" r="5" fill="#4ade80"/>
    <text x="30" y="23" class="node-title">Deliver Results</text>
    <text x="30" y="39" class="node-sub">Quantified prod impact</text>
  </g>

  <!-- Center Bar Raiser Hub -->
  <g transform="translate(450, 178)">
    <circle r="54" fill="#0f172a" stroke="#f59e0b" class="hub-circle"/>
    <circle r="46" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="6 3">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-12" text-anchor="middle" class="hub-title">BAR RAISER</text>
    <text x="0" y="5" text-anchor="middle" class="hub-title">SIGNAL HUB</text>
    <text x="0" y="22" text-anchor="middle" class="hub-sub">L5 SCOPE + BAR</text>
  </g>

  <!-- Footer Legend -->
  <text x="450" y="322" text-anchor="middle" class="sub-text">Every STAR story should emit multi-LP signals: Action → Metrics → Team / Org Impact</text>
</svg>
