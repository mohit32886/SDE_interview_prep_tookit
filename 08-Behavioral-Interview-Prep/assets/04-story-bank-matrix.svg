<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Story Bank Reusability Matrix: 5 Core Stories mapping to 5 Behavioral Competencies">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #f8fafc; letter-spacing: 0.6px; }
      .subtitle { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #94a3b8; }
      .col-hdr { font: 700 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #64748b; letter-spacing: 1.2px; }
      .node-title { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #f1f5f9; }
      .node-sub { font: 500 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #94a3b8; }
      .badge-txt { font: 700 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #e2e8f0; }
      .wire { fill: none; stroke-width: 1.75; stroke-linecap: round; opacity: 0.35; stroke-dasharray: 5 5; animation: dashFlow 3.2s linear infinite; }
      .wire-strong { fill: none; stroke-width: 2.2; stroke-linecap: round; opacity: 0.55; stroke-dasharray: 6 4; animation: dashFlow 2.4s linear infinite; }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes cardPulse {
        0%, 100% { stroke-opacity: 0.55; }
        50% { stroke-opacity: 1; }
      }
      .story-box { fill: #1e293b; stroke-width: 1.5; rx: 8; animation: cardPulse 4s ease-in-out infinite; }
      .comp-box { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <!-- Outer Dark-Slate Card -->
  <rect x="2" y="2" width="896" height="326" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="28" y="30" class="title">STORY BANK REUSABILITY MATRIX</text>
  <text x="28" y="47" class="subtitle">5 Core Story Archetypes → Multi-Competency STAR Mapping (1 Story → 3+ Principles)</text>
  <rect x="708" y="18" width="164" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="723" cy="30" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="734" y="34" class="subtitle" fill="#cbd5e1">7 Stories • 16+ LPs</text>

  <line x1="28" y1="58" x2="872" y2="58" stroke="#334155" stroke-width="1"/>

  <!-- Column Headers -->
  <text x="28" y="76" class="col-hdr">CORE STORY ARCHETYPES</text>
  <text x="450" y="76" text-anchor="middle" class="col-hdr">COMPETENCY ROUTING</text>
  <text x="640" y="76" class="col-hdr">BEHAVIORAL COMPETENCIES</text>

  <!-- Connection Wires (Left x=268 to Right x=640) -->
  <!-- Story 1: Architecture (y=106) -> Ownership (106), Dive Deep (156), Mentorship (306) -->
  <path d="M 268 106 C 410 106, 490 106, 640 106" class="wire-strong" stroke="#38bdf8"/>
  <path d="M 268 106 C 420 106, 480 156, 640 156" class="wire" stroke="#38bdf8"/>
  <path d="M 268 106 C 400 106, 500 306, 640 306" class="wire" stroke="#38bdf8"/>

  <!-- Story 2: Conflict (y=156) -> Ownership (106), Disagree & Commit (256), Mentorship (306) -->
  <path d="M 268 156 C 410 156, 490 106, 640 106" class="wire" stroke="#a78bfa"/>
  <path d="M 268 156 C 430 156, 480 256, 640 256" class="wire-strong" stroke="#a78bfa"/>
  <path d="M 268 156 C 410 156, 490 306, 640 306" class="wire" stroke="#a78bfa"/>

  <!-- Story 3: Failure (y=206) -> Ownership (106), Dive Deep (156), Disagree & Commit (256) -->
  <path d="M 268 206 C 420 206, 480 106, 640 106" class="wire" stroke="#fb7185"/>
  <path d="M 268 206 C 410 206, 490 156, 640 156" class="wire-strong" stroke="#fb7185"/>
  <path d="M 268 206 C 420 206, 480 256, 640 256" class="wire" stroke="#fb7185"/>

  <!-- Story 4: Ambiguity (y=256) -> Ownership (106), Bias for Action (206), Disagree & Commit (256) -->
  <path d="M 268 256 C 400 256, 500 106, 640 106" class="wire" stroke="#fbbf24"/>
  <path d="M 268 256 C 420 256, 490 206, 640 206" class="wire-strong" stroke="#fbbf24"/>
  <path d="M 268 256 C 410 256, 490 256, 640 256" class="wire" stroke="#fbbf24"/>

  <!-- Story 5: Impact/Scale (y=306) -> Ownership (106), Dive Deep (156), Bias for Action (206), Mentorship (306) -->
  <path d="M 268 306 C 390 306, 510 106, 640 106" class="wire" stroke="#34d399"/>
  <path d="M 268 306 C 410 306, 490 156, 640 156" class="wire" stroke="#34d399"/>
  <path d="M 268 306 C 420 306, 480 206, 640 206" class="wire-strong" stroke="#34d399"/>
  <path d="M 268 306 C 410 306, 490 306, 640 306" class="wire" stroke="#34d399"/>

  <!-- Animated Signal Pulses (SMIL animateMotion) -->
  <circle r="3.5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 268 106 C 410 106, 490 106, 640 106"/>
  </circle>
  <circle r="3" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="3.4s" begin="0.8s" repeatCount="indefinite" path="M 268 106 C 400 106, 500 306, 640 306"/>
  </circle>
  <circle r="3.5" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="2.9s" begin="0.3s" repeatCount="indefinite" path="M 268 156 C 430 156, 480 256, 640 256"/>
  </circle>
  <circle r="3.5" fill="#fb7185" filter="url(#glow)">
    <animateMotion dur="2.7s" begin="1.1s" repeatCount="indefinite" path="M 268 206 C 410 206, 490 156, 640 156"/>
  </circle>
  <circle r="3.5" fill="#fbbf24" filter="url(#glow)">
    <animateMotion dur="2.5s" begin="0.5s" repeatCount="indefinite" path="M 268 256 C 420 256, 490 206, 640 206"/>
  </circle>
  <circle r="3.5" fill="#34d399" filter="url(#glow)">
    <animateMotion dur="2.8s" begin="0.2s" repeatCount="indefinite" path="M 268 306 C 420 306, 480 206, 640 206"/>
  </circle>
  <circle r="3" fill="#34d399" filter="url(#glow)">
    <animateMotion dur="3.5s" begin="1.4s" repeatCount="indefinite" path="M 268 306 C 410 306, 490 306, 640 306"/>
  </circle>

  <!-- Left Column: 5 Core Stories -->
  <!-- 1. Architecture -->
  <g transform="translate(28, 86)">
    <rect width="240" height="40" class="story-box" stroke="#38bdf8"/>
    <rect x="0" y="6" width="4" height="28" rx="2" fill="#38bdf8"/>
    <text x="14" y="18" class="node-title">1. Architecture</text>
    <text x="14" y="32" class="node-sub">Monolith → 4 Microservices</text>
    <circle cx="240" cy="20" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- 2. Conflict -->
  <g transform="translate(28, 136)">
    <rect width="240" height="40" class="story-box" stroke="#a78bfa"/>
    <rect x="0" y="6" width="4" height="28" rx="2" fill="#a78bfa"/>
    <text x="14" y="18" class="node-title">2. Conflict</text>
    <text x="14" y="32" class="node-sub">Data Lake Cross-Team Alignment</text>
    <circle cx="240" cy="20" r="3.5" fill="#a78bfa"/>
  </g>

  <!-- 3. Failure -->
  <g transform="translate(28, 186)">
    <rect width="240" height="40" class="story-box" stroke="#fb7185"/>
    <rect x="0" y="6" width="4" height="28" rx="2" fill="#fb7185"/>
    <text x="14" y="18" class="node-title">3. Failure &amp; Risk</text>
    <text x="14" y="32" class="node-sub">Spring Boot 2.7 Parallel Rollout</text>
    <circle cx="240" cy="20" r="3.5" fill="#fb7185"/>
  </g>

  <!-- 4. Ambiguity -->
  <g transform="translate(28, 236)">
    <rect width="240" height="40" class="story-box" stroke="#fbbf24"/>
    <rect x="0" y="6" width="4" height="28" rx="2" fill="#fbbf24"/>
    <text x="14" y="18" class="node-title">4. Ambiguity</text>
    <text x="14" y="32" class="node-sub">Ideate 360 &amp; GDPR Delete Utility</text>
    <circle cx="240" cy="20" r="3.5" fill="#fbbf24"/>
  </g>

  <!-- 5. Impact / Scale -->
  <g transform="translate(28, 286)">
    <rect width="240" height="40" class="story-box" stroke="#34d399"/>
    <rect x="0" y="6" width="4" height="28" rx="2" fill="#34d399"/>
    <text x="14" y="18" class="node-title">5. Impact / Scale</text>
    <text x="14" y="32" class="node-sub">62%→89% JUnit &amp; 400+ Sonar</text>
    <circle cx="240" cy="20" r="3.5" fill="#34d399"/>
  </g>

  <!-- Right Column: 5 Behavioral Competencies -->
  <!-- 1. Ownership -->
  <g transform="translate(640, 86)">
    <rect width="232" height="40" class="comp-box"/>
    <circle cx="0" cy="20" r="3.5" fill="#38bdf8"/>
    <text x="14" y="18" class="node-title">Ownership</text>
    <text x="14" y="32" class="node-sub">End-to-End Accountability</text>
    <rect x="182" y="11" width="38" height="18" rx="9" fill="#1e3a8a"/>
    <text x="201" y="23" text-anchor="middle" class="badge-txt">5/5</text>
  </g>

  <!-- 2. Dive Deep -->
  <g transform="translate(640, 136)">
    <rect width="232" height="40" class="comp-box"/>
    <circle cx="0" cy="20" r="3.5" fill="#fb7185"/>
    <text x="14" y="18" class="node-title">Dive Deep</text>
    <text x="14" y="32" class="node-sub">Root Cause &amp; Risk Matrices</text>
    <rect x="182" y="11" width="38" height="18" rx="9" fill="#881337"/>
    <text x="201" y="23" text-anchor="middle" class="badge-txt">4/5</text>
  </g>

  <!-- 3. Bias for Action -->
  <g transform="translate(640, 186)">
    <rect width="232" height="40" class="comp-box"/>
    <circle cx="0" cy="20" r="3.5" fill="#fbbf24"/>
    <text x="14" y="18" class="node-title">Bias for Action</text>
    <text x="14" y="32" class="node-sub">Automation &amp; Self-Service</text>
    <rect x="182" y="11" width="38" height="18" rx="9" fill="#78350f"/>
    <text x="201" y="23" text-anchor="middle" class="badge-txt">4/5</text>
  </g>

  <!-- 4. Disagree & Commit -->
  <g transform="translate(640, 236)">
    <rect width="232" height="40" class="comp-box"/>
    <circle cx="0" cy="20" r="3.5" fill="#a78bfa"/>
    <text x="14" y="18" class="node-title">Disagree &amp; Commit</text>
    <text x="14" y="32" class="node-sub">Tradeoffs &amp; Pushback</text>
    <rect x="182" y="11" width="38" height="18" rx="9" fill="#4c1d95"/>
    <text x="201" y="23" text-anchor="middle" class="badge-txt">3/5</text>
  </g>

  <!-- 5. Mentorship -->
  <g transform="translate(640, 286)">
    <rect width="232" height="40" class="comp-box"/>
    <circle cx="0" cy="20" r="3.5" fill="#34d399"/>
    <text x="14" y="18" class="node-title">Mentorship</text>
    <text x="14" y="32" class="node-sub">Hire &amp; Develop the Best</text>
    <rect x="182" y="11" width="38" height="18" rx="9" fill="#064e3b"/>
    <text x="201" y="23" text-anchor="middle" class="badge-txt">3/5</text>
  </g>
</svg>
