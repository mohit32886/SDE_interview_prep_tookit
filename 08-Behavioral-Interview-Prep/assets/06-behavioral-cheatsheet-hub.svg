<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Behavioral Interview Execution Loop</title>
  <desc id="desc">Five-stage execution loop: Decode Signal, Select Story, Deliver STAR (5m max), Handle Follow-Up Probes, and Ask Strategic Reverse Questions.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseStage1 { 0%, 100% { stroke-opacity: 0.95; } 20%, 80% { stroke-opacity: 0.35; } }
      @keyframes pulseStage2 { 20% { stroke-opacity: 0.95; } 0%, 40%, 100% { stroke-opacity: 0.35; } }
      @keyframes pulseStage3 { 40% { stroke-opacity: 0.95; } 0%, 20%, 60%, 100% { stroke-opacity: 0.35; } }
      @keyframes pulseStage4 { 60% { stroke-opacity: 0.95; } 0%, 40%, 80%, 100% { stroke-opacity: 0.35; } }
      @keyframes pulseStage5 { 80% { stroke-opacity: 0.95; } 0%, 60%, 100% { stroke-opacity: 0.35; } }
      @keyframes badgePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      .s1 { animation: pulseStage1 8s infinite ease-in-out; }
      .s2 { animation: pulseStage2 8s infinite ease-in-out; }
      .s3 { animation: pulseStage3 8s infinite ease-in-out; }
      .s4 { animation: pulseStage4 8s infinite ease-in-out; }
      .s5 { animation: pulseStage5 8s infinite ease-in-out; }
      .dot-live { animation: badgePulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" class="font-sans" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.6">BEHAVIORAL INTERVIEW EXECUTION LOOP</text>
  <text x="32" y="57" class="font-sans" font-size="12" fill="#94a3b8">Decode Signal → Select Story → Deliver STAR (2–2.5m + Probes ≤ 5m) → Reverse Ask</text>

  <!-- Live Status Pill -->
  <rect x="706" y="22" width="162" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <circle cx="724" cy="36" r="4.5" fill="#34d399" class="dot-live"/>
  <text x="736" y="40" class="font-mono" font-size="11" font-weight="600" fill="#e2e8f0">TARGET: 2–2.5m / STAR</text>

  <!-- Forward Connectors -->
  <line x1="180" y1="154" x2="200" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="352" y1="154" x2="372" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="524" y1="154" x2="544" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="696" y1="154" x2="716" y2="154" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Animated Forward Flow Track -->
  <path id="forwardTrack" d="M 106 154 L 794 154" fill="none" stroke="none"/>
  <circle r="4" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 180 154 L 202 154"/>
  </circle>
  <circle r="4" fill="#a78bfa" filter="url(#glow)">
    <animateMotion dur="4s" begin="0.8s" repeatCount="indefinite" path="M 352 154 L 374 154"/>
  </circle>
  <circle r="4" fill="#34d399" filter="url(#glow)">
    <animateMotion dur="4s" begin="1.6s" repeatCount="indefinite" path="M 524 154 L 546 154"/>
  </circle>
  <circle r="4" fill="#fbbf24" filter="url(#glow)">
    <animateMotion dur="4s" begin="2.4s" repeatCount="indefinite" path="M 696 154 L 718 154"/>
  </circle>

  <!-- Stage 1: Decode Signal -->
  <g>
    <rect x="32" y="84" width="148" height="140" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" class="s1"/>
    <rect x="44" y="96" width="84" height="20" rx="6" fill="#0c4a6e"/>
    <text x="52" y="110" class="font-mono" font-size="10.5" font-weight="700" fill="#7dd3fc">01 · DECODE</text>
    <text x="44" y="138" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">Decode Signal</text>
    <text x="44" y="160" class="font-sans" font-size="11" fill="#cbd5e1">• Pause 3–5 sec</text>
    <text x="44" y="178" class="font-sans" font-size="11" fill="#cbd5e1">• Spot target LP</text>
    <text x="44" y="196" class="font-sans" font-size="11" fill="#cbd5e1">• Clarify if vague</text>
    <text x="44" y="213" class="font-mono" font-size="10" fill="#38bdf8">Signal → Rubric</text>
  </g>

  <!-- Stage 2: Select Story -->
  <g>
    <rect x="204" y="84" width="148" height="140" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2" class="s2"/>
    <rect x="216" y="96" width="84" height="20" rx="6" fill="#3b0764"/>
    <text x="224" y="110" class="font-mono" font-size="10.5" font-weight="700" fill="#ddd6fe">02 · SELECT</text>
    <text x="216" y="138" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">Select Story</text>
    <text x="216" y="160" class="font-sans" font-size="11" fill="#cbd5e1">• Map to 7-story bank</text>
    <text x="216" y="178" class="font-sans" font-size="11" fill="#cbd5e1">• Pick unused angle</text>
    <text x="216" y="196" class="font-sans" font-size="11" fill="#cbd5e1">• Never repeat story</text>
    <text x="216" y="213" class="font-mono" font-size="10" fill="#a78bfa">4+ Unique Topics</text>
  </g>

  <!-- Stage 3: Deliver STAR (5m) -->
  <g>
    <rect x="376" y="84" width="148" height="140" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2" class="s3"/>
    <rect x="388" y="96" width="96" height="20" rx="6" fill="#064e3b"/>
    <text x="396" y="110" class="font-mono" font-size="10.5" font-weight="700" fill="#6ee7b7">03 · STAR (5m)</text>
    <text x="388" y="138" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">Deliver STAR</text>
    <text x="388" y="160" class="font-sans" font-size="11" fill="#cbd5e1">• S:25s T:15s A:60s R:25s</text>
    <text x="388" y="178" class="font-sans" font-size="11" fill="#cbd5e1">• Use "I", not "we"</text>
    <text x="388" y="196" class="font-sans" font-size="11" fill="#cbd5e1">• Quantify impact</text>
    <text x="388" y="213" class="font-mono" font-size="10" fill="#34d399">62%→89% · 400+→0</text>
  </g>

  <!-- Stage 4: Handle Follow-Up Probes -->
  <g>
    <rect x="548" y="84" width="148" height="140" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2" class="s4"/>
    <rect x="560" y="96" width="84" height="20" rx="6" fill="#78350f"/>
    <text x="568" y="110" class="font-mono" font-size="10.5" font-weight="700" fill="#fde68a">04 · PROBES</text>
    <text x="560" y="138" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">Follow-Up Probes</text>
    <text x="560" y="160" class="font-sans" font-size="11" fill="#cbd5e1">• Defend tradeoffs</text>
    <text x="560" y="178" class="font-sans" font-size="11" fill="#cbd5e1">• Own mistakes/gaps</text>
    <text x="560" y="196" class="font-sans" font-size="11" fill="#cbd5e1">• Stay consistent</text>
    <text x="560" y="213" class="font-mono" font-size="10" fill="#fbbf24">Why X? What next?</text>
  </g>

  <!-- Stage 5: Ask Strategic Reverse Questions -->
  <g>
    <rect x="720" y="84" width="148" height="140" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="2" class="s5"/>
    <rect x="732" y="96" width="92" height="20" rx="6" fill="#831843"/>
    <text x="740" y="110" class="font-mono" font-size="10.5" font-weight="700" fill="#fbcfe8">05 · REVERSE</text>
    <text x="732" y="138" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">Reverse Ask</text>
    <text x="732" y="160" class="font-sans" font-size="11" fill="#cbd5e1">• Ask 1–2 sharp Qs</text>
    <text x="732" y="178" class="font-sans" font-size="11" fill="#cbd5e1">• Show curiosity</text>
    <text x="732" y="196" class="font-sans" font-size="11" fill="#cbd5e1">• Reaffirm interest</text>
    <text x="732" y="213" class="font-mono" font-size="10" fill="#f472b6">End Strong · 24h Note</text>
  </g>

  <!-- Return Loop Path -->
  <path id="returnLoop" d="M 622 224 L 622 264 Q 622 274 612 274 L 116 274 Q 106 274 106 264 L 106 228" fill="none" stroke="url(#flowGrad)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowReturn)"/>
  <circle r="4.5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 622 224 L 622 264 Q 622 274 612 274 L 116 274 Q 106 274 106 264 L 106 228"/>
  </circle>

  <!-- Return Loop Label -->
  <rect x="234" y="261" width="260" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="364" y="277" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#cbd5e1">NEXT QUESTION IN ROUND → FRESH STORY</text>

  <!-- Footer Note -->
  <text x="868" y="302" text-anchor="end" class="font-mono" font-size="10" fill="#64748b">3 Core Rules: Tell the Truth · Use Numbers · Show "I" Ownership</text>
</svg>
