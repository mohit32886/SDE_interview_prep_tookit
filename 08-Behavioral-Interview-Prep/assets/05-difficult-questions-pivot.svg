<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Difficult Question Recovery Pivot">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="33%" stop-color="#f59e0b"/>
      <stop offset="66%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="signalTrack" d="M 126 168 L 774 168"/>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.6px; }
      .subtitle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .step-num { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; }
      .card-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
      .card-body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #cbd5e1; }
      .pill-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; }
      .footer-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #94a3b8; }

      @keyframes cardPulse1 { 0%, 100% { stroke-opacity: 0.45; } 12%, 25% { stroke-opacity: 1; } }
      @keyframes cardPulse2 { 0%, 100% { stroke-opacity: 0.45; } 37%, 50% { stroke-opacity: 1; } }
      @keyframes cardPulse3 { 0%, 100% { stroke-opacity: 0.45; } 62%, 75% { stroke-opacity: 1; } }
      @keyframes cardPulse4 { 0%, 100% { stroke-opacity: 0.45; } 85%, 96% { stroke-opacity: 1; } }

      .card-1 { animation: cardPulse1 6s ease-in-out infinite; }
      .card-2 { animation: cardPulse2 6s ease-in-out infinite; }
      .card-3 { animation: cardPulse3 6s ease-in-out infinite; }
      .card-4 { animation: cardPulse4 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Main Card Background -->
  <rect x="2" y="2" width="896" height="316" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="34" class="title">DIFFICULT QUESTION RECOVERY PIVOT</text>
  <text x="32" y="52" class="subtitle">AUTHENTICITY + STRATEGIC FRAMING: TURN HIGH-RISK PROMPTS INTO SENIORITY SIGNALS</text>
  <line x1="32" y1="64" x2="868" y2="64" stroke="#334155" stroke-width="1"/>

  <!-- Signal Track Behind Cards -->
  <line x1="126" y1="168" x2="774" y2="168" stroke="url(#flowGrad)" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Stage 1: Tough Prompt -->
  <g class="card-1">
    <rect x="32" y="84" width="188" height="168" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8"/>
    <rect x="32" y="84" width="188" height="28" rx="10" fill="#4c0519"/>
    <rect x="32" y="102" width="188" height="10" fill="#4c0519"/>
    <text x="44" y="102" class="step-num" fill="#fda4af">STAGE 01 // TRIGGER</text>
    <text x="44" y="132" class="card-title">Tough Prompt</text>
    <rect x="44" y="144" width="76" height="20" rx="4" fill="#334155"/>
    <text x="82" y="158" text-anchor="middle" class="pill-text" fill="#fecdd3">Failure</text>
    <rect x="128" y="144" width="78" height="20" rx="4" fill="#334155"/>
    <text x="167" y="158" text-anchor="middle" class="pill-text" fill="#fecdd3">Conflict</text>
    <rect x="44" y="170" width="76" height="20" rx="4" fill="#334155"/>
    <text x="82" y="184" text-anchor="middle" class="pill-text" fill="#fecdd3">Weakness</text>
    <rect x="128" y="170" width="78" height="20" rx="4" fill="#334155"/>
    <text x="167" y="184" text-anchor="middle" class="pill-text" fill="#fecdd3">Gap / Layoff</text>
    <text x="44" y="214" class="card-body">Avoid defensiveness,</text>
    <text x="44" y="230" class="card-body">cliches, or blame.</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <polygon points="228,163 238,168 228,173" fill="#f59e0b"/>

  <!-- Stage 2: Blameless Ownership -->
  <g class="card-2">
    <rect x="246" y="84" width="188" height="168" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="246" y="84" width="188" height="28" rx="10" fill="#451a03"/>
    <rect x="246" y="102" width="188" height="10" fill="#451a03"/>
    <text x="258" y="102" class="step-num" fill="#fcd34d">STAGE 02 // PIVOT</text>
    <text x="258" y="132" class="card-title">Blameless Ownership</text>
    <text x="258" y="156" class="card-body">• Use "I" for your call</text>
    <text x="258" y="176" class="card-body">• Name exact mistake</text>
    <text x="258" y="196" class="card-body">• Zero finger-pointing</text>
    <rect x="258" y="214" width="164" height="24" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="340" y="230" text-anchor="middle" class="pill-text" fill="#fde68a">"Here is what I missed"</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="442,163 452,168 442,173" fill="#3b82f6"/>

  <!-- Stage 3: Root Cause & Fix -->
  <g class="card-3">
    <rect x="460" y="84" width="188" height="168" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
    <rect x="460" y="84" width="188" height="28" rx="10" fill="#172554"/>
    <rect x="460" y="102" width="188" height="10" fill="#172554"/>
    <text x="472" y="102" class="step-num" fill="#93c5fd">STAGE 03 // ACTION</text>
    <text x="472" y="132" class="card-title">Root Cause &amp; Fix</text>
    <text x="472" y="156" class="card-body">• Diagnose trade-off</text>
    <text x="472" y="176" class="card-body">• Align stakeholders</text>
    <text x="472" y="196" class="card-body">• Execute concrete fix</text>
    <rect x="472" y="214" width="164" height="24" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="554" y="230" text-anchor="middle" class="pill-text" fill="#bfdbfe">Data + Compromise</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <polygon points="656,163 666,168 656,173" fill="#10b981"/>

  <!-- Stage 4: Measurable Growth & Guardrail -->
  <g class="card-4">
    <rect x="674" y="84" width="194" height="168" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
    <rect x="674" y="84" width="194" height="28" rx="10" fill="#064e3b"/>
    <rect x="674" y="102" width="194" height="10" fill="#064e3b"/>
    <text x="686" y="102" class="step-num" fill="#6ee7b7">STAGE 04 // SIGNAL</text>
    <text x="686" y="132" class="card-title">Growth &amp; Guardrail</text>
    <text x="686" y="156" class="card-body">• Quantify turnaround</text>
    <text x="686" y="176" class="card-body">• Institutionalize habit</text>
    <text x="686" y="196" class="card-body">• Prevent recurrence</text>
    <rect x="686" y="214" width="170" height="24" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="771" y="230" text-anchor="middle" class="pill-text" fill="#a7f3d0">+40% Perf / 0 Incidents</text>
  </g>

  <!-- Animated Signal Pulse along the Track -->
  <circle r="5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#signalTrack"/>
    </animateMotion>
  </circle>

  <!-- Footer Guardrails -->
  <line x1="32" y1="270" x2="868" y2="270" stroke="#334155" stroke-width="1"/>
  <circle cx="42" cy="292" r="4" fill="#10b981">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="54" y="296" class="footer-text">PAUSE 5–10s BEFORE ANSWERING  |  SPECIFIC METRICS OVER VAGUE CLAIMS  |  COACHABLE &amp; FUTURE-READY</text>
</svg>
