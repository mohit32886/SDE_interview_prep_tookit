<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="AWS Event-Driven, Messaging and Storage Architecture">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .card-accent-sky { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.6; rx: 10; }
      .card-accent-emerald { fill: #1e293b; stroke: #34d399; stroke-width: 1.6; rx: 10; }
      .card-accent-amber { fill: #1e293b; stroke: #fbbf24; stroke-width: 1.6; rx: 10; }
      .card-accent-violet { fill: #1e293b; stroke: #a78bfa; stroke-width: 1.6; rx: 10; }
      .card-accent-rose { fill: #1e293b; stroke: #fb7185; stroke-width: 1.6; rx: 10; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.2px; }
      .badge { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; }
      .node-title { fill: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; }
      .node-sub { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
      .node-tag { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 10px; }
      .edge-line { fill: none; stroke: #475569; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; stroke-linecap: round; stroke-linejoin: round; }
      .flow-sky { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 6 6; animation: dashFlow 1.6s linear infinite; }
      .flow-amber { fill: none; stroke: #fbbf24; stroke-width: 2; stroke-dasharray: 6 6; animation: dashFlow 1.8s linear infinite; }
      .flow-emerald { fill: none; stroke: #34d399; stroke-width: 2; stroke-dasharray: 6 6; animation: dashFlow 1.5s linear infinite; }
      .pulse-ring { animation: pulseGlow 2.4s ease-in-out infinite; }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background Frame -->
  <rect class="bg" x="0" y="0" width="900" height="320" rx="14"/>
  <rect x="6" y="6" width="888" height="308" rx="11" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text class="title" x="24" y="27">AWS Event-Driven, Messaging &amp; Storage Architecture</text>
  <rect x="662" y="13" width="214" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text class="badge" x="673" y="26">EDGE → COMPUTE → ASYNC / DATA</text>

  <!-- Connectors (drawn behind nodes) -->
  <!-- 1. Edge -> ECS -->
  <path id="p-edge-ecs" class="flow-sky" d="M 194 86 L 234 86" marker-end="url(#arrow-sky)"/>
  <!-- 2. ECS -> SNS/SQS -->
  <path id="p-ecs-sns" class="flow-amber" d="M 416 78 L 462 78" marker-end="url(#arrow-amber)"/>
  <!-- 3. ECS -> MSK -->
  <path id="p-ecs-msk" class="flow-amber" d="M 416 112 L 438 112 L 438 158 L 462 158" marker-end="url(#arrow-amber)"/>
  <!-- 4. SNS/SQS -> Workers -->
  <path id="p-sns-work" class="flow-sky" d="M 660 78 L 702 78" marker-end="url(#arrow-sky)"/>
  <!-- 5. MSK -> Workers -->
  <path id="p-msk-work" class="flow-sky" d="M 660 158 L 682 158 L 682 132 L 702 132" marker-end="url(#arrow-sky)"/>
  <!-- 6. Workers -> DB -->
  <path id="p-work-db" class="edge-line" d="M 790 164 L 790 196" marker-end="url(#arrow-slate)"/>
  <!-- 7. ECS -> DB (Sync Path) -->
  <path id="p-ecs-db" class="edge-line" d="M 380 148 L 380 208 L 702 208" marker-end="url(#arrow-slate)"/>
  <!-- 8. ECS -> Client (Presigned URL) -->
  <path id="p-ecs-presign" class="edge-dashed" d="M 276 148 L 276 184 L 109 184 L 109 218" marker-end="url(#arrow-slate)"/>
  <!-- 9. Client -> S3 (Direct Upload) -->
  <path id="p-client-s3" class="flow-emerald" d="M 194 254 L 234 254" marker-end="url(#arrow-emerald)"/>

  <!-- Connector Labels -->
  <text class="node-sub" x="122" y="178">Presigned URL</text>
  <text class="node-sub" x="488" y="203">Sync Read / Write</text>

  <!-- Node 1: Edge / Ingress -->
  <rect class="card-accent-sky" x="24" y="52" width="170" height="68"/>
  <circle class="pulse-ring" cx="38" cy="68" r="4" fill="#38bdf8"/>
  <text class="node-title" x="48" y="72">Edge &amp; Ingress</text>
  <text class="node-sub" x="34" y="90">CloudFront / API GW</text>
  <text class="node-sub" x="34" y="105">ALB (L7) / NLB (L4)</text>

  <!-- Node 2: Compute (ECS / EKS) -->
  <rect class="card-accent-violet" x="236" y="52" width="180" height="96"/>
  <circle class="pulse-ring" cx="250" cy="68" r="4" fill="#a78bfa"/>
  <text class="node-title" x="260" y="72">ECS / EKS Service</text>
  <text class="node-sub" x="246" y="90">Stateless App Tier</text>
  <text class="node-tag" x="246" y="108">• Validates &amp; routes reqs</text>
  <text class="node-tag" x="246" y="124">• Signs S3 Presigned URLs</text>
  <text class="node-tag" x="246" y="140">• Emits domain events</text>

  <!-- Node 3: SNS + SQS -->
  <rect class="card-accent-amber" x="464" y="48" width="196" height="64"/>
  <circle class="pulse-ring" cx="478" cy="64" r="4" fill="#fbbf24"/>
  <text class="node-title" x="488" y="68">SNS Fanout → SQS</text>
  <text class="node-sub" x="474" y="85">Push-to-Pull + DLQ</text>
  <text class="node-sub" x="474" y="100">Std / FIFO • Zero Ops</text>

  <!-- Node 4: MSK Kafka -->
  <rect class="card-accent-amber" x="464" y="126" width="196" height="64"/>
  <circle class="pulse-ring" cx="478" cy="142" r="4" fill="#fbbf24"/>
  <text class="node-title" x="488" y="146">Amazon MSK (Kafka)</text>
  <text class="node-sub" x="474" y="163">Partitioned Commit Log</text>
  <text class="node-sub" x="474" y="178">Replayable • High MB/s</text>

  <!-- Node 5: Workers -->
  <rect class="card-accent-sky" x="704" y="48" width="172" height="116"/>
  <circle class="pulse-ring" cx="718" cy="64" r="4" fill="#38bdf8"/>
  <text class="node-title" x="728" y="68">Async Workers</text>
  <text class="node-sub" x="714" y="86">Lambda / ECS Tasks</text>
  <text class="node-tag" x="714" y="105">• Event Source Mapping</text>
  <text class="node-tag" x="714" y="121">• Idempotent Writes</text>
  <text class="node-tag" x="714" y="137">• Batch &amp; Backpressure</text>
  <text class="node-sub" x="714" y="155" fill="#38bdf8">Auto-scales on lag</text>

  <!-- Node 6: Client Direct Upload -->
  <rect class="card" x="24" y="220" width="170" height="68"/>
  <text class="node-title" x="36" y="242">Client Upload</text>
  <text class="node-sub" x="36" y="259">Direct PUT / Multipart</text>
  <text class="node-sub" x="36" y="274">Bypasses App Compute</text>

  <!-- Node 7: Amazon S3 -->
  <rect class="card-accent-emerald" x="236" y="220" width="180" height="68"/>
  <circle class="pulse-ring" cx="250" cy="236" r="4" fill="#34d399"/>
  <text class="node-title" x="260" y="240">Amazon S3</text>
  <text class="node-sub" x="246" y="258">11 9s Durability</text>
  <text class="node-sub" x="246" y="274">Blobs, Media, Parquet</text>

  <!-- Node 8: RDS vs DynamoDB -->
  <rect class="card-accent-rose" x="704" y="198" width="172" height="96"/>
  <circle class="pulse-ring" cx="718" cy="214" r="4" fill="#fb7185"/>
  <text class="node-title" x="728" y="218">RDS vs DynamoDB</text>
  <text class="node-sub" x="714" y="236">RDS/Aurora: ACID, Joins</text>
  <text class="node-sub" x="714" y="252">DynamoDB: &lt;10ms KV</text>
  <text class="node-sub" x="714" y="268">Single-Table + GSI</text>
  <text class="node-sub" x="714" y="284">Global Tables / Replicas</text>

  <!-- Animated SMIL Particles -->
  <circle r="3.5" fill="#38bdf8">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 194 86 L 234 86"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#fbbf24">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 416 78 L 462 78"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#fbbf24">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 416 112 L 438 112 L 438 158 L 462 158"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#38bdf8">
    <animateMotion dur="1.7s" repeatCount="indefinite" path="M 660 78 L 702 78"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#34d399">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 194 254 L 234 254"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
