<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Kubernetes Zero-Downtime Pod Graceful Shutdown">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .label { fill: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 600; }
      .sublabel { fill: #94a3b8; font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 9.5px; }
      .badge-text { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 700; }
      .timeline-text { fill: #64748b; font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 9.5px; }
      .line-blue { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .line-amber { stroke: #fbbf24; stroke-width: 2; fill: none; }
      .line-green { stroke: #34d399; stroke-width: 2; fill: none; }
      .line-purple { stroke: #a78bfa; stroke-width: 2; fill: none; }
      .line-dashed { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }

      @keyframes pulseGlow {
        0%, 100% { stroke-opacity: 0.55; }
        50% { stroke-opacity: 1; }
      }
      @keyframes fadeDrain {
        0%, 20% { opacity: 1; }
        70%, 100% { opacity: 0.25; }
      }
      .pulse-amber { animation: pulseGlow 2.4s ease-in-out infinite; }
      .pulse-green { animation: pulseGlow 2.8s ease-in-out infinite; }
      .drain-fade { animation: fadeDrain 4s ease-in-out infinite; }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <!-- Outer Canvas -->
  <rect class="bg" x="0" y="0" width="900" height="320" rx="14" />

  <!-- Header -->
  <text x="24" y="30" class="title">Kubernetes Zero-Downtime Pod Graceful Shutdown</text>
  <text x="24" y="47" class="subtitle">Parallel EndpointSlice Removal + preStop Hook + Spring Boot Graceful Drain (&lt; terminationGracePeriodSeconds)</text>
  <rect x="720" y="18" width="156" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="798" y="34" text-anchor="middle" class="badge-text" fill="#6ee7b7">ZERO 502 / DROPPED REQ</text>

  <!-- Trigger Node: Pod Terminating (t=0s) -->
  <rect x="24" y="112" width="136" height="72" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8" />
  <text x="92" y="136" text-anchor="middle" class="label" fill="#fda4af">Pod Terminating</text>
  <text x="92" y="153" text-anchor="middle" class="sublabel">kubectl delete /</text>
  <text x="92" y="166" text-anchor="middle" class="sublabel">RollingUpdate (t=0s)</text>

  <!-- Parallel Split Paths -->
  <path id="path-top" d="M 160 130 C 190 130, 190 88, 226 88" class="line-blue" marker-end="url(#arrow-blue)" />
  <path id="path-bot" d="M 160 166 C 190 166, 190 202, 226 202" class="line-amber" marker-end="url(#arrow-amber)" />

  <!-- Parallel Badge -->
  <rect x="166" y="139" width="54" height="18" rx="9" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="193" y="151" text-anchor="middle" class="badge-text" fill="#cbd5e1">PARALLEL</text>

  <!-- TOP TRACK: Control Plane / Network -->
  <rect x="232" y="62" width="190" height="52" rx="8" class="card" stroke="#38bdf8" />
  <text x="327" y="83" text-anchor="middle" class="label" fill="#7dd3fc">EndpointSlice Removal</text>
  <text x="327" y="99" text-anchor="middle" class="sublabel">API Server marks pod unready</text>

  <path id="path-net" d="M 422 88 L 468 88" class="line-blue" marker-end="url(#arrow-blue)" />

  <rect x="474" y="62" width="214" height="52" rx="8" class="card" stroke="#38bdf8" />
  <text x="581" y="83" text-anchor="middle" class="label" fill="#7dd3fc">kube-proxy / Ingress Sync</text>
  <text x="581" y="99" text-anchor="middle" class="sublabel">iptables/IPVS stops new traffic</text>

  <path d="M 688 88 L 728 88" class="line-dashed" />
  <rect x="732" y="68" width="144" height="40" rx="8" fill="#0f172a" stroke="#475569" stroke-dasharray="3 3" />
  <text x="804" y="86" text-anchor="middle" class="sublabel" fill="#94a3b8">New Traffic: 0 req/s</text>
  <text x="804" y="99" text-anchor="middle" class="sublabel" fill="#34d399">Propagation ~1-3s</text>

  <!-- BOTTOM TRACK: Kubelet & Container -->
  <rect x="232" y="168" width="144" height="68" rx="8" class="card pulse-amber" stroke="#fbbf24" />
  <text x="304" y="191" text-anchor="middle" class="label" fill="#fde68a">preStop: sleep 5s</text>
  <text x="304" y="207" text-anchor="middle" class="sublabel">Waits for iptables</text>
  <text x="304" y="220" text-anchor="middle" class="sublabel">before SIGTERM</text>

  <path id="path-sig" d="M 376 202 L 414 202" class="line-amber" marker-end="url(#arrow-amber)" />
  <text x="395" y="194" text-anchor="middle" class="sublabel" fill="#fbbf24">SIGTERM</text>

  <rect x="420" y="168" width="166" height="68" rx="8" class="card" stroke="#a78bfa" />
  <text x="503" y="191" text-anchor="middle" class="label" fill="#ddd6fe">Spring Boot Shutdown</text>
  <text x="503" y="207" text-anchor="middle" class="sublabel">server.shutdown=graceful</text>
  <text x="503" y="220" text-anchor="middle" class="sublabel">Rejects new, keeps active</text>

  <path id="path-drain" d="M 586 202 L 620 202" class="line-purple" marker-end="url(#arrow-purple)" />

  <rect x="626" y="168" width="152" height="68" rx="8" class="card drain-fade" stroke="#34d399" />
  <text x="702" y="191" text-anchor="middle" class="label" fill="#6ee7b7">Drain In-Flight</text>
  <text x="702" y="207" text-anchor="middle" class="sublabel">HTTP requests &amp;</text>
  <text x="702" y="220" text-anchor="middle" class="sublabel">Kafka consumer commit</text>

  <path id="path-exit" d="M 778 202 L 806 202" class="line-green" marker-end="url(#arrow-green)" />

  <rect x="812" y="176" width="64" height="52" rx="8" fill="#064e3b" class="pulse-green" stroke="#10b981" stroke-width="1.8" />
  <text x="844" y="199" text-anchor="middle" class="label" fill="#6ee7b7">Exit 0</text>
  <text x="844" y="215" text-anchor="middle" class="sublabel" fill="#a7f3d0">~14s</text>

  <!-- Animated Signal Dots (SMIL) -->
  <circle r="4" fill="#38bdf8">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 160 130 C 190 130, 190 88, 226 88 L 468 88" />
  </circle>
  <circle r="4" fill="#fbbf24">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 160 166 C 190 166, 190 202, 226 202 L 414 202" />
  </circle>
  <circle r="4" fill="#34d399">
    <animateMotion dur="3.4s" begin="1.1s" repeatCount="indefinite" path="M 586 202 L 806 202" />
  </circle>

  <!-- Bottom Timeline Bar -->
  <line x1="24" y1="274" x2="876" y2="274" stroke="#334155" stroke-width="2" />
  <rect x="24" y="268" width="136" height="12" rx="4" fill="#38bdf8" opacity="0.35" />
  <rect x="160" y="268" width="160" height="12" rx="4" fill="#fbbf24" opacity="0.45" />
  <rect x="320" y="268" width="320" height="12" rx="4" fill="#34d399" opacity="0.45" />
  <rect x="640" y="268" width="236" height="12" rx="4" fill="#475569" opacity="0.25" />

  <!-- Timeline Markers -->
  <circle cx="24" cy="274" r="4" fill="#f43f5e" />
  <text x="24" y="298" class="timeline-text">0s: Terminating</text>

  <circle cx="160" cy="274" r="4" fill="#fbbf24" />
  <text x="160" y="298" class="timeline-text">5s: SIGTERM sent</text>

  <circle cx="640" cy="274" r="4" fill="#34d399" />
  <text x="640" y="298" text-anchor="middle" class="timeline-text" fill="#6ee7b7">~14s: Clean Exit 0</text>

  <circle cx="876" cy="274" r="4" fill="#ef4444" />
  <text x="876" y="298" text-anchor="end" class="timeline-text" fill="#fca5a5">30s: SIGKILL (terminationGracePeriodSeconds)</text>
</svg>
