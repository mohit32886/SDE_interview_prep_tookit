<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Production RAG and LLM Gateway Architecture">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 500; fill: #94a3b8; }
      .node-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #f1f5f9; }
      .node-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #94a3b8; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 600; }
      .edge-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 600; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .card-accent-blue { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; }
      .card-accent-emerald { fill: #1e293b; stroke: #34d399; stroke-width: 1.5; }
      .card-accent-amber { fill: #1e293b; stroke: #fbbf24; stroke-width: 1.5; }
      .card-accent-purple { fill: #1e293b; stroke: #a78bfa; stroke-width: 1.5; }
      .flow-line { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 5 4; animation: dashFlow 1.4s linear infinite; }
      .hit-line { fill: none; stroke: #34d399; stroke-width: 1.8; stroke-dasharray: 4 4; animation: dashFlowRev 1.6s linear infinite; }
      .offline-line { fill: none; stroke: #fbbf24; stroke-width: 1.8; stroke-dasharray: 5 4; animation: dashFlow 1.8s linear infinite; }
      .pulse-ring { animation: pulseGlow 2.4s ease-in-out infinite; }
      @keyframes dashFlow {
        to { stroke-dashoffset: -18; }
      }
      @keyframes dashFlowRev {
        to { stroke-dashoffset: 16; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Outer Dark-Slate Card -->
  <rect x="2" y="2" width="896" height="316" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <text x="24" y="28" class="title">Production RAG &amp; LLM Gateway Architecture</text>
  <text x="24" y="43" class="subtitle">Online Request Path (Rate Limit → Semantic Cache → Hybrid Retrieval → SSE Stream) &amp; Offline Ingestion</text>

  <!-- Legend -->
  <circle cx="622" cy="24" r="4" fill="#38bdf8" />
  <text x="631" y="27" class="badge-text" fill="#38bdf8">Online Path</text>
  <circle cx="708" cy="24" r="4" fill="#34d399" />
  <text x="717" y="27" class="badge-text" fill="#34d399">Cache Hit</text>
  <circle cx="786" cy="24" r="4" fill="#fbbf24" />
  <text x="795" y="27" class="badge-text" fill="#fbbf24">Offline Sync</text>

  <!-- Cache Hit Return Arc (Semantic Cache -> User Query) -->
  <path id="cacheHitPath" d="M 419 82 C 419 48, 82 48, 82 82" class="hit-line" marker-end="url(#arrow-emerald)" />
  <rect x="196" y="45" width="110" height="16" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="251" y="56" text-anchor="middle" class="edge-label" fill="#34d399">Hit &gt; 0.92 (~15ms)</text>
  <circle r="3.5" fill="#34d399">
    <animateMotion dur="2.2s" repeatCount="indefinite">
      <mpath href="#cacheHitPath" />
    </animateMotion>
  </circle>

  <!-- Online Path Connectors -->
  <path id="edge1" d="M 136 120 L 170 120" class="flow-line" marker-end="url(#arrow-blue)" />
  <path id="edge2" d="M 310 120 L 344 120" class="flow-line" marker-end="url(#arrow-blue)" />
  <path id="edge3" d="M 488 120 L 522 120" class="flow-line" marker-end="url(#arrow-blue)" />
  <text x="505" y="113" text-anchor="middle" class="edge-label" fill="#94a3b8">Miss</text>
  <path id="edge4" d="M 688 120 L 722 120" class="flow-line" marker-end="url(#arrow-blue)" />

  <!-- Animated Online Request Packet -->
  <path id="fullOnlinePath" d="M 82 120 L 800 120" fill="none" stroke="none" />
  <circle r="4" fill="#38bdf8">
    <animateMotion dur="3.4s" repeatCount="indefinite">
      <mpath href="#fullOnlinePath" />
    </animateMotion>
  </circle>

  <!-- Node 1: User Query -->
  <g transform="translate(24, 82)">
    <rect width="112" height="76" rx="8" class="card-accent-blue" />
    <text x="56" y="25" text-anchor="middle" class="node-title">User Query</text>
    <text x="56" y="43" text-anchor="middle" class="node-sub">Prompt + Auth</text>
    <text x="56" y="59" text-anchor="middle" class="node-sub">PII / Guardrails</text>
  </g>

  <!-- Node 2: Token Bucket Rate Limiter -->
  <g transform="translate(172, 82)">
    <rect width="138" height="76" rx="8" class="card-accent-purple" />
    <text x="69" y="25" text-anchor="middle" class="node-title">Rate Limiter</text>
    <text x="69" y="43" text-anchor="middle" class="node-sub">Token Bucket (Lua)</text>
    <text x="69" y="59" text-anchor="middle" class="node-sub">TPM + RPM Quota</text>
  </g>

  <!-- Node 3: Semantic Cache -->
  <g transform="translate(346, 82)">
    <rect width="142" height="76" rx="8" class="card-accent-emerald" />
    <text x="71" y="25" text-anchor="middle" class="node-title">Semantic Cache</text>
    <text x="71" y="43" text-anchor="middle" class="node-sub">Redis Vector KNN</text>
    <text x="71" y="59" text-anchor="middle" class="node-sub">Cosine &gt; 0.92</text>
  </g>

  <!-- Node 4: Hybrid Retrieval -->
  <g transform="translate(524, 82)">
    <rect width="164" height="76" rx="8" class="card-accent-blue" />
    <text x="82" y="25" text-anchor="middle" class="node-title">Hybrid Retrieval</text>
    <text x="82" y="43" text-anchor="middle" class="node-sub">pgvector HNSW + BM25</text>
    <text x="82" y="59" text-anchor="middle" class="node-sub">RRF + Cross-Encoder</text>
  </g>

  <!-- Node 5: LLM Streaming -->
  <g transform="translate(724, 82)">
    <rect width="152" height="76" rx="8" class="card-accent-purple" />
    <circle cx="138" cy="14" r="4" fill="#34d399" class="pulse-ring" />
    <text x="76" y="25" text-anchor="middle" class="node-title">LLM Streaming</text>
    <text x="76" y="43" text-anchor="middle" class="node-sub">SSE Token Stream</text>
    <text x="76" y="59" text-anchor="middle" class="node-sub">TTFT &lt; 400ms</text>
    <!-- Token stream bars -->
    <rect x="26" y="65" width="22" height="3" rx="1.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0s" repeatCount="indefinite" />
    </rect>
    <rect x="52" y="65" width="32" height="3" rx="1.5" fill="#a78bfa">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
    </rect>
    <rect x="88" y="65" width="24" height="3" rx="1.5" fill="#34d399">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Offline Chunking & Embedding Pipeline Container -->
  <rect x="24" y="192" width="852" height="106" rx="10" fill="#111827" stroke="#475569" stroke-width="1.2" stroke-dasharray="6 4" />
  <text x="38" y="211" class="badge-text" fill="#fbbf24">OFFLINE CHUNKING &amp; EMBEDDING PIPELINE (ASYNC CDC / WORKER QUEUE)</text>

  <!-- Offline Nodes -->
  <g transform="translate(38, 224)">
    <rect width="128" height="58" rx="7" class="card-accent-amber" />
    <text x="64" y="24" text-anchor="middle" class="node-title">Source Docs</text>
    <text x="64" y="42" text-anchor="middle" class="node-sub">S3 / Confluence / DB</text>
  </g>

  <g transform="translate(202, 224)">
    <rect width="154" height="58" rx="7" class="card-accent-amber" />
    <text x="77" y="24" text-anchor="middle" class="node-title">Chunker</text>
    <text x="77" y="42" text-anchor="middle" class="node-sub">512 tok + 15% overlap</text>
  </g>

  <g transform="translate(392, 224)">
    <rect width="158" height="58" rx="7" class="card-accent-amber" />
    <text x="79" y="24" text-anchor="middle" class="node-title">Embedding Batch</text>
    <text x="79" y="42" text-anchor="middle" class="node-sub">Dense 1536-d + Sparse</text>
  </g>

  <g transform="translate(586, 224)">
    <rect width="166" height="58" rx="7" class="card-accent-amber" />
    <text x="83" y="24" text-anchor="middle" class="node-title">Vector + Text Index</text>
    <text x="83" y="42" text-anchor="middle" class="node-sub">pgvector HNSW + GIN</text>
  </g>

  <!-- Offline Status Pill -->
  <g transform="translate(772, 224)">
    <rect width="90" height="58" rx="7" class="card" />
    <text x="45" y="24" text-anchor="middle" class="badge-text" fill="#34d399">Incremental</text>
    <text x="45" y="40" text-anchor="middle" class="node-sub">Hash Dedup</text>
    <text x="45" y="52" text-anchor="middle" class="node-sub">Zero-Downtime</text>
  </g>

  <!-- Offline Horizontal Edges -->
  <path d="M 166 253 L 198 253" class="offline-line" marker-end="url(#arrow-amber)" />
  <path d="M 356 253 L 388 253" class="offline-line" marker-end="url(#arrow-amber)" />
  <path d="M 550 253 L 582 253" class="offline-line" marker-end="url(#arrow-amber)" />

  <!-- Offline Upward Sync Edge to Hybrid Retrieval -->
  <path id="syncUpPath" d="M 669 224 L 669 190 L 606 190 L 606 162" class="offline-line" marker-end="url(#arrow-amber)" />
  <circle r="3.5" fill="#fbbf24">
    <animateMotion dur="2.0s" repeatCount="indefinite">
      <mpath href="#syncUpPath" />
    </animateMotion>
  </circle>
</svg>
