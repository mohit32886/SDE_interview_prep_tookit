<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%" role="img" aria-label="API Gateway and Service Mesh with Envoy Sidecars and xDS Control Plane">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .pod-a { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
      .pod-b { fill: #1e293b; stroke: #a855f7; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
      .subbox { fill: #0f172a; stroke: #475569; stroke-width: 1.2; rx: 8; }
      .envoy { fill: #172554; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .ctrl { fill: #1e1b4b; stroke: #818cf8; stroke-width: 1.5; rx: 10; }
      .title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #f1f5f9; }
      .small { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #cbd5e1; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #7dd3fc; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #34d399; }
      .flow-line { fill: none; stroke: #64748b; stroke-width: 2; }
      .mtls-line { fill: none; stroke: #10b981; stroke-width: 3; stroke-dasharray: 8 4; animation: dashMove 1.4s linear infinite; }
      .xds-line { fill: none; stroke: #818cf8; stroke-width: 1.8; stroke-dasharray: 5 5; animation: dashUp 1.6s linear infinite; }
      .pulse { animation: pulseGlow 2.2s ease-in-out infinite; }
      @keyframes dashMove {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashUp {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>

    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="960" height="460" rx="14" />

  <!-- Header -->
  <text class="title" x="28" y="36">API Gateway + Service Mesh Data &amp; Control Plane</text>
  <text class="subtitle" x="28" y="56">North-South edge routing at API Gateway; East-West mTLS, retries &amp; telemetry via Envoy sidecars</text>

  <!-- Zone Labels -->
  <text class="mono" x="28" y="88">DATA PLANE (REQUEST PATH)</text>
  <text class="mono" x="375" y="298">CONTROL PLANE (xDS &amp; mTLS CA)</text>

  <!-- Client -->
  <rect class="card" x="28" y="130" width="106" height="90" />
  <circle cx="81" cy="154" r="11" fill="#0ea5e9" opacity="0.2" />
  <circle cx="81" cy="154" r="5" fill="#38bdf8" class="pulse" />
  <text class="label" x="81" y="180" text-anchor="middle">Client</text>
  <text class="small" x="81" y="197" text-anchor="middle">Web / Mobile</text>
  <text class="mono" x="81" y="211" text-anchor="middle">HTTPS</text>

  <!-- API Gateway -->
  <rect class="card" x="172" y="112" width="158" height="126" />
  <text class="label" x="251" y="136" text-anchor="middle">API Gateway</text>
  <rect class="subbox" x="184" y="146" width="134" height="22" />
  <text class="small" x="251" y="161" text-anchor="middle">1. JWT Auth &amp; RBAC</text>
  <rect class="subbox" x="184" y="173" width="134" height="22" />
  <text class="small" x="251" y="188" text-anchor="middle">2. Rate Limiting</text>
  <rect class="subbox" x="184" y="200" width="134" height="22" />
  <text class="small" x="251" y="215" text-anchor="middle">3. Path Routing</text>

  <!-- Pod A -->
  <rect class="pod-a" x="372" y="100" width="234" height="152" />
  <text class="mono" x="386" y="118">Pod A: order-service</text>

  <rect class="subbox" x="386" y="130" width="100" height="104" />
  <text class="label" x="436" y="162" text-anchor="middle">Order</text>
  <text class="label" x="436" y="179" text-anchor="middle">Service</text>
  <text class="small" x="436" y="200" text-anchor="middle">Business Logic</text>
  <text class="mono" x="436" y="218" text-anchor="middle">:8080</text>

  <rect class="envoy" x="502" y="130" width="90" height="104" />
  <text class="label" x="547" y="158" text-anchor="middle">Envoy</text>
  <text class="small" x="547" y="175" text-anchor="middle">Sidecar A</text>
  <text class="mono" x="547" y="196" text-anchor="middle">:15001 out</text>
  <text class="mono" x="547" y="212" text-anchor="middle">Telemetry</text>

  <!-- Pod B -->
  <rect class="pod-b" x="676" y="100" width="256" height="152" />
  <text class="mono" x="690" y="118">Pod B: payment-service</text>

  <rect class="envoy" x="690" y="130" width="90" height="104" />
  <text class="label" x="735" y="158" text-anchor="middle">Envoy</text>
  <text class="small" x="735" y="175" text-anchor="middle">Sidecar B</text>
  <text class="mono" x="735" y="196" text-anchor="middle">:15006 in</text>
  <text class="mono" x="735" y="212" text-anchor="middle">Verify mTLS</text>

  <rect class="subbox" x="796" y="130" width="122" height="104" />
  <text class="label" x="857" y="162" text-anchor="middle">Payment</text>
  <text class="label" x="857" y="179" text-anchor="middle">Service</text>
  <text class="small" x="857" y="200" text-anchor="middle">Business Logic</text>
  <text class="mono" x="857" y="218" text-anchor="middle">:8080</text>

  <!-- Control Plane -->
  <rect class="ctrl" x="372" y="310" width="560" height="96" />
  <text class="label" x="392" y="336">Istio Control Plane (istiod)</text>
  <rect class="subbox" x="392" y="348" width="160" height="42" />
  <text class="small" x="472" y="366" text-anchor="middle">xDS Config Server</text>
  <text class="mono" x="472" y="381" text-anchor="middle">Routes / LB / Retries</text>

  <rect class="subbox" x="572" y="348" width="160" height="42" />
  <text class="small" x="652" y="366" text-anchor="middle">Certificate Authority</text>
  <text class="mono" x="652" y="381" text-anchor="middle">SPIFFE mTLS Certs</text>

  <rect class="subbox" x="752" y="348" width="160" height="42" />
  <text class="small" x="832" y="366" text-anchor="middle">Observability Sink</text>
  <text class="mono" x="832" y="381" text-anchor="middle">Prometheus / Jaeger</text>

  <!-- Data Plane Connectors -->
  <path id="path-c-gw" class="flow-line" d="M 134 175 L 166 175" marker-end="url(#arrow-slate)" />
  <path id="path-gw-a" class="flow-line" d="M 330 175 L 380 175" marker-end="url(#arrow-slate)" />
  <path id="path-a-env" class="flow-line" d="M 486 182 L 498 182" />
  <path id="path-mtls" class="mtls-line" d="M 592 182 L 684 182" marker-end="url(#arrow-green)" />
  <path id="path-env-b" class="flow-line" d="M 780 182 L 792 182" />

  <!-- mTLS Badge -->
  <rect x="610" y="146" width="62" height="22" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text class="badge-text" x="641" y="161" text-anchor="middle">mTLS</text>

  <!-- Control Plane Connectors -->
  <path id="path-xds-a" class="xds-line" d="M 547 310 L 547 238" marker-end="url(#arrow-indigo)" />
  <path id="path-xds-b" class="xds-line" d="M 735 310 L 735 238" marker-end="url(#arrow-indigo)" />
  <text class="mono" x="556" y="278">xDS + Certs</text>
  <text class="mono" x="744" y="278">xDS + Certs</text>

  <!-- Animated Request Packets (SMIL) -->
  <circle r="4.5" fill="#38bdf8">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 134 175 L 172 175 L 330 175 L 386 175" />
  </circle>
  <circle r="4.5" fill="#10b981">
    <animateMotion dur="2.0s" repeatCount="indefinite" path="M 486 182 L 502 182 L 592 182 L 690 182 L 796 182" />
  </circle>
  <!-- Animated xDS Push Dots -->
  <circle r="3.5" fill="#818cf8">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 547 310 L 547 236" />
  </circle>
  <circle r="3.5" fill="#818cf8">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M 735 310 L 735 236" />
  </circle>

  <!-- Footer Legend -->
  <circle cx="36" cy="434" r="4.5" fill="#38bdf8" />
  <text class="small" x="48" y="438">Edge HTTP Request</text>
  <circle cx="190" cy="434" r="4.5" fill="#10b981" />
  <text class="small" x="202" y="438">Encrypted mTLS Mesh Traffic</text>
  <circle cx="395" cy="434" r="4.5" fill="#818cf8" />
  <text class="small" x="407" y="438">xDS Config &amp; Cert Push</text>
  <text class="mono" x="932" y="438" text-anchor="end">Zero-trust Service-to-Service</text>
</svg>
