<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Microservices Deep Dive - 7-Module Mastery Track</title>
  <desc id="banner-desc">Animated roadmap banner showing the 7-module microservices interview preparation track from DDD and Boundaries to System Design and Debugging.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="track-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title-text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 26px;
        font-weight: 800;
        fill: #f8fafc;
        letter-spacing: -0.4px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: "SF Mono", Menlo, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.7px;
      }
      .node-num {
        font-family: "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
      }
      .node-title {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #f1f5f9;
      }
      .node-sub {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 10.5px;
        fill: #94a3b8;
      }
      .footer-pill {
        font-family: "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        fill: #cbd5e1;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dash-flow 2.4s linear infinite;
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -28; }
      }
      .pulse-dot {
        animation: dot-pulse 2s ease-in-out infinite;
        transform-origin: center;
      }
      @keyframes dot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .step-1 { animation: node-glow 7s ease-in-out infinite 0s; }
      .step-2 { animation: node-glow 7s ease-in-out infinite 1s; }
      .step-3 { animation: node-glow 7s ease-in-out infinite 2s; }
      .step-4 { animation: node-glow 7s ease-in-out infinite 3s; }
      .step-5 { animation: node-glow 7s ease-in-out infinite 4s; }
      .step-6 { animation: node-glow 7s ease-in-out infinite 5s; }
      .step-7 { animation: node-glow 7s ease-in-out infinite 6s; }
      @keyframes node-glow {
        0%, 14%, 100% {
          stroke-opacity: 0.45;
          stroke-width: 1.3;
        }
        7% {
          stroke-opacity: 1;
          stroke-width: 2.3;
        }
      }
    </style>
  </defs>

  <!-- Outer Card Background -->
  <rect x="0" y="0" width="960" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect x="0" y="0" width="960" height="360" rx="16" fill="url(#grid-pattern)"/>
  <rect x="0" y="0" width="960" height="360" rx="16" fill="url(#glow-blue)"/>
  <rect x="0" y="0" width="960" height="360" rx="16" fill="url(#glow-emerald)"/>
  <rect x="1" y="1" width="958" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="232" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="14" y="14.5" class="badge-text" fill="#38bdf8">MODULE 04 · FAANG INTERVIEW PREP</text>

    <text x="0" y="52" class="title-text">Microservices Deep Dive</text>
    <text x="0" y="73" class="subtitle-text">11,206+ Lines · 100+ Java Implementations · 50+ Diagrams · 40+ Q&amp;A</text>
  </g>

  <!-- Top-Right Live Track Badge -->
  <g transform="translate(734, 30)">
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="18" cy="14" r="4.5" fill="#34d399" class="pulse-dot"/>
    <text x="31" y="17.5" class="badge-text" fill="#34d399">7-MODULE MASTERY TRACK</text>
  </g>

  <!-- Connector Paths (Row 1 -> Row 2) -->
  <g fill="none">
    <!-- Static Base Track -->
    <path id="mastery-path"
          d="M 138 152 L 366 152 L 594 152 L 822 152 C 885 152, 885 194, 480 194 C 75 194, 75 256, 210 256 L 480 256 L 750 256"
          stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Animated Dashed Flow -->
    <path d="M 138 152 L 366 152 L 594 152 L 822 152 C 885 152, 885 194, 480 194 C 75 194, 75 256, 210 256 L 480 256 L 750 256"
          stroke="url(#track-grad)" stroke-width="2" stroke-linecap="round" class="flow-line" opacity="0.85"/>
  </g>

  <!-- SMIL Traveling Data Packet -->
  <circle r="4.5" fill="#38bdf8" filter="url(#soft-glow)">
    <animateMotion dur="7s" repeatCount="indefinite"
      path="M 138 152 L 366 152 L 594 152 L 822 152 C 885 152, 885 194, 480 194 C 75 194, 75 256, 210 256 L 480 256 L 750 256"/>
  </circle>

  <!-- Row 1: Modules 01 - 04 -->
  <!-- 01 DDD & Boundaries -->
  <g transform="translate(40, 118)">
    <rect x="0" y="0" width="196" height="66" rx="10" fill="url(#card-grad)" stroke="#38bdf8" class="step-1"/>
    <rect x="10" y="10" width="28" height="18" rx="5" fill="#0ea5e9" fill-opacity="0.18"/>
    <text x="24" y="22.5" text-anchor="middle" class="node-num" fill="#38bdf8">01</text>
    <text x="46" y="23" class="node-title">DDD &amp; Boundaries</text>
    <text x="12" y="45" class="node-sub">Aggregates · Strangler Fig</text>
    <text x="12" y="58" class="node-sub">1,385 lines · 6 Q&amp;A</text>
  </g>

  <!-- 02 Sync/Async & Sagas -->
  <g transform="translate(268, 118)">
    <rect x="0" y="0" width="196" height="66" rx="10" fill="url(#card-grad)" stroke="#60a5fa" class="step-2"/>
    <rect x="10" y="10" width="28" height="18" rx="5" fill="#3b82f6" fill-opacity="0.18"/>
    <text x="24" y="22.5" text-anchor="middle" class="node-num" fill="#60a5fa">02</text>
    <text x="46" y="23" class="node-title">Sync/Async &amp; Sagas</text>
    <text x="12" y="45" class="node-sub">REST · gRPC · Kafka · CQRS</text>
    <text x="12" y="58" class="node-sub">2,205 lines · 7 Q&amp;A</text>
  </g>

  <!-- 03 Gateway & Mesh -->
  <g transform="translate(496, 118)">
    <rect x="0" y="0" width="196" height="66" rx="10" fill="url(#card-grad)" stroke="#818cf8" class="step-3"/>
    <rect x="10" y="10" width="28" height="18" rx="5" fill="#6366f1" fill-opacity="0.18"/>
    <text x="24" y="22.5" text-anchor="middle" class="node-num" fill="#818cf8">03</text>
    <text x="46" y="23" class="node-title">Gateway &amp; Mesh</text>
    <text x="12" y="45" class="node-sub">Eureka · BFF · Istio · Canary</text>
    <text x="12" y="58" class="node-sub">1,508 lines · 4 Q&amp;A</text>
  </g>

  <!-- 04 Resilience -->
  <g transform="translate(724, 118)">
    <rect x="0" y="0" width="196" height="66" rx="10" fill="url(#card-grad)" stroke="#a78bfa" class="step-4"/>
    <rect x="10" y="10" width="28" height="18" rx="5" fill="#8b5cf6" fill-opacity="0.18"/>
    <text x="24" y="22.5" text-anchor="middle" class="node-num" fill="#a78bfa">04</text>
    <text x="46" y="23" class="node-title">Resilience</text>
    <text x="12" y="45" class="node-sub">Circuit Breaker · Bulkhead</text>
    <text x="12" y="58" class="node-sub">1,416 lines · Chaos &amp; Sleuth</text>
  </g>

  <!-- Row 2: Modules 05 - 07 -->
  <!-- 05 Data & Outbox -->
  <g transform="translate(95, 222)">
    <rect x="0" y="0" width="230" height="66" rx="10" fill="url(#card-grad)" stroke="#34d399" class="step-5"/>
    <rect x="12" y="10" width="28" height="18" rx="5" fill="#10b981" fill-opacity="0.18"/>
    <text x="26" y="22.5" text-anchor="middle" class="node-num" fill="#34d399">05</text>
    <text x="48" y="23" class="node-title">Data &amp; Outbox</text>
    <text x="12" y="45" class="node-sub">DB-per-Service · Event Sourcing · Redis</text>
    <text x="12" y="58" class="node-sub">1,656 lines · Snapshots &amp; CQRS</text>
  </g>

  <!-- 06 Security & OTel -->
  <g transform="translate(365, 222)">
    <rect x="0" y="0" width="230" height="66" rx="10" fill="url(#card-grad)" stroke="#2dd4bf" class="step-6"/>
    <rect x="12" y="10" width="28" height="18" rx="5" fill="#14b8a6" fill-opacity="0.18"/>
    <text x="26" y="22.5" text-anchor="middle" class="node-num" fill="#2dd4bf">06</text>
    <text x="48" y="23" class="node-title">Security &amp; OTel</text>
    <text x="12" y="45" class="node-sub">OAuth2/JWT · mTLS · ELK · Prometheus</text>
    <text x="12" y="58" class="node-sub">1,081 lines · RED Metrics &amp; Alerts</text>
  </g>

  <!-- 07 System Design & Debugging -->
  <g transform="translate(635, 222)">
    <rect x="0" y="0" width="230" height="66" rx="10" fill="url(#card-grad)" stroke="#f59e0b" class="step-7"/>
    <rect x="12" y="10" width="28" height="18" rx="5" fill="#f59e0b" fill-opacity="0.18"/>
    <text x="26" y="22.5" text-anchor="middle" class="node-num" fill="#fbbf24">07</text>
    <text x="48" y="23" class="node-title">System Design &amp; Debugging</text>
    <text x="12" y="45" class="node-sub">40+ Q&amp;A · 5 Full System Designs</text>
    <text x="12" y="58" class="node-sub">1,955 lines · Trade-offs &amp; Triage</text>
  </g>

  <!-- Footer Tech Pills -->
  <g transform="translate(40, 314)">
    <rect x="0" y="0" width="124" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="62" y="15.5" text-anchor="middle" class="footer-pill">Java · Spring Boot</text>

    <rect x="136" y="0" width="112" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="192" y="15.5" text-anchor="middle" class="footer-pill">Resilience4j</text>

    <rect x="260" y="0" width="118" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="319" y="15.5" text-anchor="middle" class="footer-pill">Kafka · Sagas</text>

    <rect x="390" y="0" width="122" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="451" y="15.5" text-anchor="middle" class="footer-pill">Istio · Sleuth</text>

    <rect x="524" y="0" width="142" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="595" y="15.5" text-anchor="middle" class="footer-pill">OAuth2 · mTLS · ELK</text>

    <rect x="678" y="0" width="202" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="779" y="15.5" text-anchor="middle" class="footer-pill">5 FAANG System Design Cases</text>
  </g>
</svg>
