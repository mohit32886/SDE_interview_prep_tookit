<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%" role="img" aria-labelledby="title1 desc1">
  <title id="title1">End-to-End Microservices System Design Blueprint</title>
  <desc id="desc1">Animated architecture flow showing API Gateway, Order Service, Outbox and Kafka, Payment and Inventory Sagas, Redis Cache, and Observability Stack.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .panel-accent { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.5; rx: 12; }
      .sub-card { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 8; }
      .title { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .node-title { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; }
      .node-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #0f172a; }
      .flow-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #cbd5e1; }
      .wire { fill: none; stroke: #475569; stroke-width: 2; }
      .wire-active { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 6 6; animation: dashMove 1.4s linear infinite; }
      .wire-kafka { fill: none; stroke: #a855f7; stroke-width: 2; stroke-dasharray: 6 6; animation: dashMove 1.2s linear infinite; }
      .wire-redis { fill: none; stroke: #f43f5e; stroke-width: 2; stroke-dasharray: 5 5; animation: dashMove 1.6s linear infinite; }
      .wire-obs { fill: none; stroke: #10b981; stroke-width: 1.5; stroke-dasharray: 4 5; opacity: 0.75; animation: dashMove 2s linear infinite; }
      .pulse { animation: pulseGlow 2.4s ease-in-out infinite; }
      @keyframes dashMove {
        to { stroke-dashoffset: -24; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
    </style>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1100" height="560" rx="16" />
  <rect width="1100" height="560" rx="16" fill="url(#grid)" />

  <!-- Header -->
  <rect x="24" y="20" width="1052" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <text x="44" y="46" class="title">Microservices System Design Blueprint</text>
  <text x="44" y="65" class="subtitle">API Gateway &#8594; Order Service &#8594; Transactional Outbox / Kafka &#8594; Saga Orchestration &#8594; Redis &amp; Observability</text>
  <rect x="880" y="34" width="176" height="28" rx="14" fill="#0ea5e9" opacity="0.18" stroke="#38bdf8" stroke-width="1" />
  <circle cx="898" cy="48" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="910" y="52" class="flow-label" fill="#e0f2fe">EVENT-DRIVEN + SAGA</text>

  <!-- Connection Paths -->
  <!-- Gateway to Order -->
  <path id="path-gw-order" d="M 218 185 L 288 185" class="wire-active" marker-end="url(#arrow-cyan)" />
  <text x="225" y="175" class="flow-label">gRPC/REST</text>

  <!-- Order to Outbox/Kafka -->
  <path id="path-order-kafka" d="M 488 185 L 558 185" class="wire-kafka" marker-end="url(#arrow-purple)" />
  <text x="495" y="175" class="flow-label">CDC / Event</text>

  <!-- Kafka to Payment & Inventory Sagas -->
  <path id="path-kafka-saga" d="M 758 185 L 828 185" class="wire-kafka" marker-end="url(#arrow-purple)" />
  <text x="768" y="175" class="flow-label">Saga Cmds</text>

  <!-- Order to Redis Cache -->
  <path id="path-order-redis" d="M 388 265 L 388 320" class="wire-redis" marker-end="url(#arrow-rose)" />
  <text x="398" y="298" class="flow-label">Cache-Aside (L2)</text>

  <!-- Telemetry wires to Observability -->
  <path d="M 124 265 L 124 415 L 580 415" class="wire-obs" marker-end="url(#arrow-green)" />
  <path d="M 658 265 L 658 380 L 720 380 L 720 415" class="wire-obs" marker-end="url(#arrow-green)" />
  <path d="M 944 285 L 944 415" class="wire-obs" marker-end="url(#arrow-green)" />

  <!-- Node 1: API Gateway -->
  <g transform="translate(30, 110)">
    <rect width="188" height="155" class="panel-accent" />
    <rect x="14" y="14" width="76" height="20" rx="10" fill="#38bdf8" />
    <text x="23" y="28" class="badge-text">EDGE / GW</text>
    <text x="14" y="56" class="node-title">API Gateway</text>
    <rect x="12" y="68" width="164" height="74" class="sub-card" />
    <text x="22" y="87" class="node-sub">&#8226; JWT Auth &amp; RBAC</text>
    <text x="22" y="105" class="node-sub">&#8226; Token Bucket Limit</text>
    <text x="22" y="123" class="node-sub">&#8226; TLS &amp; Routing</text>
  </g>

  <!-- Node 2: Order Service -->
  <g transform="translate(290, 110)">
    <rect width="198" height="155" class="panel" stroke="#60a5fa" />
    <rect x="14" y="14" width="94" height="20" rx="10" fill="#60a5fa" />
    <text x="23" y="28" class="badge-text">CORE SERVICE</text>
    <text x="14" y="56" class="node-title">Order Service</text>
    <rect x="12" y="68" width="174" height="74" class="sub-card" />
    <text x="22" y="87" class="node-sub">&#8226; Idempotency-Key</text>
    <text x="22" y="105" class="node-sub">&#8226; ACID DB + Outbox</text>
    <text x="22" y="123" class="node-sub">&#8226; State: PENDING</text>
  </g>

  <!-- Node 3: Outbox / Kafka -->
  <g transform="translate(560, 110)">
    <rect width="198" height="155" class="panel" stroke="#a855f7" />
    <rect x="14" y="14" width="106" height="20" rx="10" fill="#a855f7" />
    <text x="23" y="28" class="badge-text">EVENT BACKBONE</text>
    <text x="14" y="56" class="node-title">Outbox / Kafka</text>
    <rect x="12" y="68" width="174" height="74" class="sub-card" />
    <text x="22" y="87" class="node-sub">&#8226; Partitioned Topics</text>
    <text x="22" y="105" class="node-sub">&#8226; At-Least-Once</text>
    <text x="22" y="123" class="node-sub">&#8226; DLQ + Backoff</text>
  </g>

  <!-- Node 4: Payment & Inventory Sagas -->
  <g transform="translate(830, 100)">
    <rect width="240" height="185" class="panel" stroke="#f59e0b" />
    <rect x="14" y="14" width="114" height="20" rx="10" fill="#f59e0b" />
    <text x="23" y="28" class="badge-text">SAGA WORKFLOWS</text>
    <text x="14" y="54" class="node-title">Payment &amp; Inventory</text>
    <rect x="12" y="66" width="216" height="48" class="sub-card" />
    <text x="22" y="85" class="node-sub">1. Reserve Inventory</text>
    <text x="22" y="103" class="node-sub">2. Charge Payment (CP)</text>
    <rect x="12" y="122" width="216" height="50" class="sub-card" stroke="#ef4444" />
    <text x="22" y="141" class="node-sub" fill="#fca5a5">On Fail: Compensate</text>
    <text x="22" y="159" class="node-sub" fill="#fca5a5">&#8617; Release Stock / Refund</text>
  </g>

  <!-- Node 5: Redis Cache -->
  <g transform="translate(275, 322)">
    <rect width="230" height="90" class="panel" stroke="#f43f5e" />
    <rect x="14" y="12" width="84" height="18" rx="9" fill="#f43f5e" />
    <text x="22" y="25" class="badge-text">L2 CACHE</text>
    <text x="110" y="26" class="node-title">Redis Cluster</text>
    <text x="16" y="52" class="node-sub">&#8226; Hot Menus / GEO Driver</text>
    <text x="16" y="70" class="node-sub">&#8226; Stampede Lock + TTL</text>
  </g>

  <!-- Node 6: Observability Stack -->
  <g transform="translate(560, 415)">
    <rect width="510" height="118" class="panel" stroke="#10b981" />
    <rect x="14" y="14" width="124" height="20" rx="10" fill="#10b981" />
    <text x="23" y="28" class="badge-text">OBSERVABILITY</text>
    <text x="150" y="29" class="node-title">Observability &amp; Resilience Stack</text>
    <rect x="14" y="46" width="152" height="56" class="sub-card" />
    <text x="24" y="67" class="node-sub" fill="#6ee7b7">Tracing (Jaeger)</text>
    <text x="24" y="85" class="node-sub">TraceID / Spans</text>
    <rect x="178" y="46" width="152" height="56" class="sub-card" />
    <text x="188" y="67" class="node-sub" fill="#6ee7b7">Metrics (Prom)</text>
    <text x="188" y="85" class="node-sub">RED + Saturation</text>
    <rect x="342" y="46" width="154" height="56" class="sub-card" />
    <text x="352" y="67" class="node-sub" fill="#6ee7b7">Logs &amp; Mesh</text>
    <text x="352" y="85" class="node-sub">mTLS + Circuit Brk</text>
  </g>

  <!-- Key Guarantees Box -->
  <g transform="translate(30, 440)">
    <rect width="480" height="92" class="sub-card" stroke="#334155" />
    <text x="16" y="24" class="node-title" font-size="13">Production Guarantees</text>
    <text x="16" y="46" class="node-sub">&#10003; Zero Lost Events: Transactional Outbox + Kafka CDC</text>
    <text x="16" y="64" class="node-sub">&#10003; No Double Charge: Idempotency-Key + Saga Compensation</text>
    <text x="16" y="82" class="node-sub">&#10003; Sub-100ms Reads: Redis L2 Cache + Read Replicas (CQRS)</text>
  </g>

  <!-- Animated Data Packets -->
  <circle r="4.5" fill="#38bdf8" class="pulse">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 218 185 L 288 185" />
  </circle>
  <circle r="4.5" fill="#a855f7" class="pulse">
    <animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M 488 185 L 558 185" />
  </circle>
  <circle r="4.5" fill="#f59e0b" class="pulse">
    <animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite" path="M 758 185 L 828 185" />
  </circle>
  <circle r="4" fill="#f43f5e" class="pulse">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 388 265 L 388 320" />
  </circle>
  <circle r="3.5" fill="#10b981">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 124 265 L 124 415 L 580 415" />
  </circle>
  <circle r="3.5" fill="#10b981">
    <animateMotion dur="2.2s" begin="0.6s" repeatCount="indefinite" path="M 944 285 L 944 415" />
  </circle>
</svg>
