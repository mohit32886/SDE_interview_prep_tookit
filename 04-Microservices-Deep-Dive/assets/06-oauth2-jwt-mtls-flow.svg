<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="auto" role="img" aria-label="OAuth2 PKCE, JWT, and Service-to-Service mTLS Flow">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .card-accent-blue { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.8; rx: 12; }
      .card-accent-emerald { fill: #1e293b; stroke: #34d399; stroke-width: 1.8; rx: 12; }
      .card-accent-violet { fill: #1e293b; stroke: #a78bfa; stroke-width: 1.8; rx: 12; }
      .card-accent-amber { fill: #1e293b; stroke: #fbbf24; stroke-width: 1.8; rx: 12; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #cbd5e1; }
      .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #94a3b8; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }
      .flow-line { fill: none; stroke: #475569; stroke-width: 2; }
      .flow-dashed { fill: none; stroke: #a78bfa; stroke-width: 1.5; stroke-dasharray: 5 5; animation: dashMove 1.8s linear infinite; }
      .mtls-line { fill: none; stroke: #34d399; stroke-width: 2.5; stroke-dasharray: 6 4; animation: dashMove 1.2s linear infinite; }
      .pulse-ring { animation: pulseRing 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .glow-badge { animation: softGlow 2.5s ease-in-out infinite; }
      @keyframes dashMove {
        to { stroke-dashoffset: -20; }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.04); }
      }
      @keyframes softGlow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>

    <!-- Motion paths -->
    <path id="path-pkce" d="M 185 150 L 265 150" />
    <path id="path-jwt-back" d="M 265 190 L 185 190" />
    <path id="path-client-gw" d="M 110 230 L 110 258 L 590 258 L 590 230" />
    <path id="path-gw-svca" d="M 675 170 L 745 170" />
    <path id="path-mtls-ab" d="M 900 155 L 950 155" />
    <path id="path-mtls-ba" d="M 950 185 L 900 185" />
  </defs>

  <!-- Background -->
  <rect class="bg" width="1100" height="520" rx="14" />

  <!-- Header -->
  <text x="36" y="42" class="title">Zero-Trust Auth Flow: OAuth2 PKCE + JWT + Service-to-Service mTLS</text>
  <text x="36" y="64" class="subtitle">North-South Edge Authentication (OIDC &amp; JWKS) + East-West Mutual TLS &amp; Identity Context Propagation</text>

  <!-- Zone Labels -->
  <rect x="30" y="84" width="420" height="190" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5" />
  <text x="44" y="102" class="badge-text" fill="#38bdf8">NORTH-SOUTH: USER &amp; TOKEN ISSUANCE</text>

  <rect x="470" y="84" width="600" height="190" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5" />
  <text x="484" y="102" class="badge-text" fill="#34d399">GATEWAY VERIFICATION &amp; EAST-WEST ZERO-TRUST MESH</text>

  <!-- Node 1: Client App -->
  <rect x="42" y="118" width="142" height="104" class="card-accent-blue" />
  <text x="113" y="144" text-anchor="middle" class="node-title">Client App</text>
  <text x="113" y="162" text-anchor="middle" class="node-sub">SPA / Mobile</text>
  <rect x="54" y="176" width="118" height="32" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="113" y="191" text-anchor="middle" class="mono-sm" fill="#38bdf8">code_verifier</text>
  <text x="113" y="203" text-anchor="middle" class="mono-sm" fill="#94a3b8">+ Bearer JWT</text>

  <!-- Node 2: Auth Server -->
  <rect x="270" y="118" width="166" height="104" class="card-accent-violet" />
  <text x="353" y="144" text-anchor="middle" class="node-title">Auth Server (IdP)</text>
  <text x="353" y="162" text-anchor="middle" class="node-sub">Keycloak / Okta / Auth0</text>
  <rect x="282" y="176" width="142" height="32" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="353" y="191" text-anchor="middle" class="mono-sm" fill="#a78bfa">Issues RS256 JWT</text>
  <text x="353" y="203" text-anchor="middle" class="mono-sm" fill="#94a3b8">/.well-known/jwks.json</text>

  <!-- Node 3: API Gateway -->
  <rect x="490" y="118" width="182" height="104" class="card-accent-amber" />
  <text x="581" y="144" text-anchor="middle" class="node-title">API Gateway</text>
  <text x="581" y="162" text-anchor="middle" class="node-sub">Edge Enforcement</text>
  <rect x="502" y="176" width="158" height="32" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="581" y="191" text-anchor="middle" class="mono-sm" fill="#fbbf24">Verify JWT (JWKS)</text>
  <text x="581" y="203" text-anchor="middle" class="mono-sm" fill="#94a3b8">Rate Limit + CORS</text>

  <!-- Node 4: Service A -->
  <rect x="748" y="118" width="148" height="104" class="card-accent-emerald" />
  <text x="822" y="144" text-anchor="middle" class="node-title">Service A</text>
  <text x="822" y="162" text-anchor="middle" class="node-sub">Order Service</text>
  <rect x="760" y="176" width="124" height="32" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="822" y="191" text-anchor="middle" class="mono-sm" fill="#34d399">SPIFFE X.509 Cert</text>
  <text x="822" y="203" text-anchor="middle" class="mono-sm" fill="#94a3b8">Propagates JWT</text>

  <!-- Node 5: Service B -->
  <rect x="954" y="118" width="106" height="104" class="card-accent-emerald" />
  <text x="1007" y="144" text-anchor="middle" class="node-title">Service B</text>
  <text x="1007" y="162" text-anchor="middle" class="node-sub">Payment Svc</text>
  <rect x="963" y="176" width="88" height="32" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="1007" y="191" text-anchor="middle" class="mono-sm" fill="#34d399">mTLS Verify</text>
  <text x="1007" y="203" text-anchor="middle" class="mono-sm" fill="#94a3b8">+ RBAC Check</text>

  <!-- Connection 1: Client -> Auth Server (PKCE) -->
  <line x1="184" y1="150" x2="264" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="224" y="142" text-anchor="middle" class="badge-text" fill="#38bdf8">1. PKCE</text>

  <!-- Connection 1b: Auth Server -> Client (JWT) -->
  <line x1="270" y1="190" x2="190" y2="190" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)" />
  <text x="228" y="206" text-anchor="middle" class="badge-text" fill="#a78bfa">2. JWT</text>

  <!-- Connection 2: Client -> API Gateway (Bearer JWT) -->
  <path d="M 113 222 L 113 256 L 581 256 L 581 228" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="268" y="244" width="166" height="20" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="351" y="258" text-anchor="middle" class="badge-text" fill="#38bdf8">3. Authorization: Bearer JWT</text>

  <!-- Connection 3: Gateway <-> Auth Server JWKS -->
  <path d="M 550 118 L 550 96 L 353 96 L 353 114" class="flow-dashed" marker-end="url(#arrow-violet)" />
  <rect x="392" y="86" width="128" height="18" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="1" />
  <text x="456" y="98" text-anchor="middle" class="badge-text" fill="#a78bfa">Cached JWKS Keys</text>

  <!-- Connection 4: Gateway -> Service A -->
  <line x1="672" y1="170" x2="742" y2="170" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />
  <text x="708" y="159" text-anchor="middle" class="badge-text" fill="#fbbf24">4. Valid</text>
  <text x="708" y="185" text-anchor="middle" class="mono-sm" fill="#94a3b8">Context</text>

  <!-- Connection 5: Service A <-> Service B (mTLS) -->
  <line x1="896" y1="155" x2="948" y2="155" class="mtls-line" marker-end="url(#arrow-emerald)" />
  <line x1="954" y1="185" x2="902" y2="185" class="mtls-line" marker-end="url(#arrow-emerald)" />
  <rect x="899" y="122" width="52" height="18" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1" class="glow-badge" />
  <text x="925" y="134" text-anchor="middle" class="badge-text" fill="#34d399">mTLS</text>
  <text x="925" y="205" text-anchor="middle" class="mono-sm" fill="#34d399">5. TLS 1.3</text>

  <!-- Animated Packets -->
  <circle r="4.5" fill="#38bdf8">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 184 150 L 266 150" />
  </circle>
  <circle r="4.5" fill="#a78bfa">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M 270 190 L 188 190" />
  </circle>
  <circle r="5" fill="#38bdf8">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 113 222 L 113 256 L 581 256 L 581 226" />
  </circle>
  <circle r="4.5" fill="#fbbf24">
    <animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M 672 170 L 744 170" />
  </circle>
  <circle r="4" fill="#34d399">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 896 155 L 950 155" />
  </circle>
  <circle r="4" fill="#6ee7b7">
    <animateMotion dur="1.5s" begin="0.75s" repeatCount="indefinite" path="M 954 185 L 900 185" />
  </circle>

  <!-- Bottom Detail Cards -->
  <!-- Card 1 -->
  <rect x="30" y="294" width="330" height="176" class="card" />
  <rect x="30" y="294" width="330" height="6" rx="3" fill="#38bdf8" />
  <text x="50" y="324" class="node-title">Step 1: OAuth2 PKCE + JWT Structure</text>
  <text x="50" y="348" class="mono" fill="#38bdf8">Header:  { "alg": "RS256", "kid": "k1" }</text>
  <text x="50" y="368" class="mono" fill="#a78bfa">Payload: { "sub": "u123", "roles": ["USER"],</text>
  <text x="50" y="386" class="mono" fill="#a78bfa">           "iss": "auth.app", "exp": 15m }</text>
  <text x="50" y="406" class="mono" fill="#34d399">Sig:     RSASSA-PKCS1-v1_5(H + "." + P)</text>
  <text x="50" y="434" class="node-sub">PKCE prevents authorization code interception</text>
  <text x="50" y="450" class="node-sub">without embedding client secrets in SPAs/mobile.</text>

  <!-- Card 2 -->
  <rect x="385" y="294" width="330" height="176" class="card" />
  <rect x="385" y="294" width="330" height="6" rx="3" fill="#fbbf24" />
  <text x="405" y="324" class="node-title">Step 2: Stateless Gateway Verification</text>
  <text x="405" y="350" class="mono" fill="#fbbf24">1. Match JWT "kid" to cached JWKS key</text>
  <text x="405" y="370" class="mono" fill="#cbd5e1">2. Verify asymmetric signature locally</text>
  <text x="405" y="390" class="mono" fill="#cbd5e1">3. Validate exp, nbf, iss, aud claims</text>
  <text x="405" y="410" class="mono" fill="#fb7185">4. Reject invalid/expired -&gt; HTTP 401</text>
  <text x="405" y="436" class="node-sub">Zero per-request IdP network calls; sub-ms latency</text>
  <text x="405" y="452" class="node-sub">with local public-key caching &amp; key rotation.</text>

  <!-- Card 3 -->
  <rect x="740" y="294" width="330" height="176" class="card" />
  <rect x="740" y="294" width="330" height="6" rx="3" fill="#34d399" />
  <text x="760" y="324" class="node-title">Step 3: East-West mTLS + Context</text>
  <text x="760" y="350" class="mono" fill="#34d399">1. Both services present X.509 certs</text>
  <text x="760" y="370" class="mono" fill="#cbd5e1">2. Mesh CA verifies SPIFFE SAN identity</text>
  <text x="760" y="390" class="mono" fill="#cbd5e1">3. TLS 1.3 encrypts service-to-service hop</text>
  <text x="760" y="410" class="mono" fill="#a78bfa">4. End-user JWT propagated for fine RBAC</text>
  <text x="760" y="436" class="node-sub">Separates workload identity (mTLS cert) from</text>
  <text x="760" y="452" class="node-sub">end-user authorization (propagated JWT claims).</text>

  <!-- Footer Legend -->
  <circle cx="42" cy="496" r="5" fill="#38bdf8" class="pulse-ring" />
  <text x="54" y="500" class="node-sub">OAuth2 PKCE / Bearer JWT</text>
  <circle cx="235" cy="496" r="5" fill="#a78bfa" />
  <text x="247" y="500" class="node-sub">JWKS Public Key Sync</text>
  <circle cx="405" cy="496" r="5" fill="#fbbf24" />
  <text x="417" y="500" class="node-sub">Gateway Verified Context</text>
  <circle cx="588" cy="496" r="5" fill="#34d399" class="pulse-ring" />
  <text x="600" y="500" class="node-sub">Mutual TLS 1.3 Encrypted Channel</text>
</svg>
