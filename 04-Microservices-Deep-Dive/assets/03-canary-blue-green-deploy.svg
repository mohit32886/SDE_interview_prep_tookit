<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-label="Canary Release vs Blue-Green Deployment Traffic Flow">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .box { fill: #0f172a; stroke: #475569; stroke-width: 1.2; rx: 8; }
      .v1-box { fill: #0c4a6e; stroke: #38bdf8; stroke-width: 1.5; rx: 8; }
      .v2-box { fill: #064e3b; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .gate-box { fill: #312e81; stroke: #818cf8; stroke-width: 1.5; rx: 8; }
      .title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .sec-title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 600; fill: #f8fafc; }
      .small { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #cbd5e1; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #7dd3fc; }
      .mono-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #34d399; }
      .line-muted { fill: none; stroke: #475569; stroke-width: 2; }
      .line-blue { fill: none; stroke: #38bdf8; stroke-width: 2.5; }
      .line-green { fill: none; stroke: #10b981; stroke-width: 2.5; }
      .line-dash { fill: none; stroke: #818cf8; stroke-width: 1.8; stroke-dasharray: 5 4; }
      .canary-bar-v2 { animation: shiftGrow 6s ease-in-out infinite; }
      .bg-switch-blue { animation: fadeBlue 5s steps(1, end) infinite; }
      .bg-switch-green { animation: fadeGreen 5s steps(1, end) infinite; }
      @keyframes shiftGrow {
        0%, 25% { width: 14px; }
        50%, 65% { width: 140px; }
        80%, 100% { width: 260px; }
      }
      @keyframes fadeBlue {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.25; }
      }
      @keyframes fadeGreen {
        0%, 49% { opacity: 0.25; }
        50%, 100% { opacity: 1; }
      }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="480" rx="14" />

  <!-- Header -->
  <text class="title" x="28" y="34">Deployment Strategies: Canary Release vs Blue-Green Cutover</text>
  <text class="subtitle" x="28" y="53">Progressive risk-mitigated traffic shifting vs instant router switch with zero-downtime rollback</text>

  <!-- TOP PANEL: CANARY -->
  <rect class="panel" x="28" y="72" width="904" height="190" />
  <text class="sec-title" x="48" y="96">1. Canary Release (Progressive Traffic Shift)</text>
  <text class="mono" x="912" y="96" text-anchor="end">95% v1 / 5% v2  -&gt;  Metrics Check  -&gt;  100% v2</text>

  <!-- Canary Router -->
  <rect class="box" x="48" y="122" width="136" height="72" />
  <text class="label" x="116" y="148" text-anchor="middle">Ingress / Mesh</text>
  <text class="small" x="116" y="166" text-anchor="middle">Weighted Splitter</text>
  <text class="mono" x="116" y="183" text-anchor="middle">VirtualService</text>

  <!-- Canary v1 & v2 -->
  <rect class="v1-box" x="256" y="110" width="170" height="48" />
  <text class="label" x="341" y="131" text-anchor="middle">Service v1.0 (Stable)</text>
  <text class="mono" x="341" y="148" text-anchor="middle">Initial: 95% traffic</text>

  <rect class="v2-box" x="256" y="168" width="170" height="48" />
  <text class="label" x="341" y="189" text-anchor="middle">Service v2.0 (Canary)</text>
  <text class="mono-green" x="341" y="206" text-anchor="middle">Initial: 5% traffic</text>

  <!-- Metrics Gate -->
  <rect class="gate-box" x="492" y="122" width="178" height="72" />
  <text class="label" x="581" y="146" text-anchor="middle">Metrics Gate</text>
  <text class="small" x="581" y="164" text-anchor="middle">5xx &lt; 1% | p99 &lt; 5s</text>
  <text class="mono" x="581" y="182" text-anchor="middle">PASS -&gt; Promote</text>

  <!-- Canary Final State -->
  <rect class="v2-box" x="736" y="122" width="174" height="72" />
  <text class="label" x="823" y="148" text-anchor="middle">100% v2.0 Active</text>
  <text class="small" x="823" y="166" text-anchor="middle">v1.0 Decommissioned</text>
  <text class="mono-green" x="823" y="183" text-anchor="middle">Rollout Complete</text>

  <!-- Canary Paths -->
  <path class="line-blue" d="M 184 146 L 250 134" marker-end="url(#arr-blue)" />
  <path class="line-green" d="M 184 170 L 250 192" marker-end="url(#arr-green)" />
  <path class="line-dash" d="M 426 192 L 486 164" marker-end="url(#arr-indigo)" />
  <path class="line-green" d="M 670 158 L 730 158" marker-end="url(#arr-green)" />

  <!-- Canary Traffic Progress Bar -->
  <text class="small" x="48" y="243">v2.0 Traffic Share:</text>
  <rect x="160" y="232" width="260" height="14" rx="7" fill="#0c4a6e" stroke="#334155" />
  <rect class="canary-bar-v2" x="160" y="232" width="14" height="14" rx="7" fill="#10b981" />
  <text class="mono" x="434" y="243">5% -&gt; 50% -&gt; 100% (auto-rollback if error rate spikes)</text>

  <!-- Canary Animated Packets -->
  <circle r="4" fill="#38bdf8">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 184 146 L 256 134" />
  </circle>
  <circle r="4" fill="#10b981">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 184 170 L 256 192 L 426 192 L 492 164 L 670 158 L 736 158" />
  </circle>

  <!-- BOTTOM PANEL: BLUE-GREEN -->
  <rect class="panel" x="28" y="280" width="904" height="180" />
  <text class="sec-title" x="48" y="304">2. Blue-Green Deployment (Instant Router Switch)</text>
  <text class="mono" x="912" y="304" text-anchor="end">Zero-downtime cutover + instant rollback</text>

  <!-- Load Balancer / Router -->
  <rect class="box" x="48" y="334" width="150" height="82" />
  <text class="label" x="123" y="362" text-anchor="middle">Load Balancer</text>
  <text class="small" x="123" y="380" text-anchor="middle">Selector Switch</text>
  <text class="mono" x="123" y="398" text-anchor="middle">version: blue | green</text>

  <!-- Blue Environment -->
  <g class="bg-switch-blue">
    <rect class="v1-box" x="290" y="320" width="230" height="54" />
    <text class="label" x="405" y="343" text-anchor="middle">Blue Environment (v1.0)</text>
    <text class="mono" x="405" y="361" text-anchor="middle">3 Instances | Instant Rollback</text>
    <path class="line-blue" d="M 198 362 L 284 347" marker-end="url(#arr-blue)" />
    <circle r="4.5" fill="#38bdf8">
      <animateMotion dur="1.2s" repeatCount="indefinite" path="M 198 362 L 290 347" />
    </circle>
  </g>

  <!-- Green Environment -->
  <g class="bg-switch-green">
    <rect class="v2-box" x="290" y="388" width="230" height="54" />
    <text class="label" x="405" y="411" text-anchor="middle">Green Environment (v2.0)</text>
    <text class="mono-green" x="405" y="429" text-anchor="middle">3 Instances | Verified &amp; Live</text>
    <path class="line-green" d="M 198 388 L 284 415" marker-end="url(#arr-green)" />
    <circle r="4.5" fill="#10b981">
      <animateMotion dur="1.2s" repeatCount="indefinite" path="M 198 388 L 290 415" />
    </circle>
  </g>

  <!-- Comparison Callout Card -->
  <rect class="box" x="560" y="322" width="350" height="120" />
  <text class="label" x="578" y="346">Cutover &amp; Rollback Mechanics</text>
  <text class="small" x="578" y="368">- Stage Green (v2.0) with 0% production traffic</text>
  <text class="small" x="578" y="388">- Run smoke tests against Green endpoint</text>
  <text class="small" x="578" y="408">- Flip Load Balancer pointer: Blue -&gt; Green (instant)</text>
  <text class="mono" x="578" y="428">Trade-off: 2x compute capacity during cutover</text>
</svg>
