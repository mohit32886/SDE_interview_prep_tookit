<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Production Microservices Debugging Triage</title>
  <desc id="desc2">Animated incident triage workflow from P1 Latency/5xx Spike through RED Metrics, Distributed Trace Bottleneck, Downstream Retry Storm or DB Pool Exhaustion, to Circuit Breaker and Backpressure Fix.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .sub-card { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 8; }
      .title { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .node-title { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; }
      .node-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #0f172a; }
      .flow-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #cbd5e1; }
      .wire-red { fill: none; stroke: #ef4444; stroke-width: 2; stroke-dasharray: 6 6; animation: dashFlow 1.2s linear infinite; }
      .wire-amber { fill: none; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 6 6; animation: dashFlow 1.4s linear infinite; }
      .wire-green { fill: none; stroke: #10b981; stroke-width: 2; stroke-dasharray: 6 6; animation: dashFlow 1.4s linear infinite; }
      .alert-ring { animation: alertPulse 1.8s ease-in-out infinite; }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      @keyframes alertPulse {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 1; }
      }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <pattern id="grid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1100" height="520" rx="16" />
  <rect width="1100" height="520" rx="16" fill="url(#grid2)" />

  <!-- Header -->
  <rect x="24" y="20" width="1052" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <text x="44" y="46" class="title">Production Microservices Debugging Triage</text>
  <text x="44" y="65" class="subtitle">Incident Runbook: P1 Spike &#8594; RED Metrics &#8594; Trace Bottleneck &#8594; Root Cause &#8594; Circuit Breaker &amp; Backpressure</text>
  <rect x="896" y="34" width="160" height="28" rx="14" fill="#ef4444" opacity="0.18" stroke="#ef4444" stroke-width="1" />
  <circle cx="914" cy="48" r="4.5" fill="#ef4444">
    <animate attributeName="r" values="3.5;5.5;3.5" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <text x="926" y="52" class="flow-label" fill="#fecaca">P1 TRIAGE ACTIVE</text>

  <!-- Top Row Connectors -->
  <path d="M 218 188 L 266 188" class="wire-red" marker-end="url(#arr-red)" />
  <path d="M 468 188 L 516 188" class="wire-amber" marker-end="url(#arr-amber)" />
  <path d="M 738 188 L 786 188" class="wire-red" marker-end="url(#arr-red)" />

  <!-- Vertical Connector to Remediation -->
  <path d="M 926 276 L 926 324 L 680 324 L 680 348" class="wire-green" marker-end="url(#arr-green)" />
  <text x="740" y="315" class="flow-label" fill="#6ee7b7">Mitigate Cascade</text>

  <!-- Step 1: P1 Latency/5xx Spike -->
  <g transform="translate(28, 108)">
    <rect width="190" height="165" class="panel alert-ring" stroke="#ef4444" />
    <rect x="14" y="14" width="84" height="20" rx="10" fill="#ef4444" />
    <text x="23" y="28" class="badge-text">1. SYMPTOM</text>
    <text x="14" y="54" class="node-title">P1 Latency / 5xx</text>
    <rect x="12" y="66" width="166" height="84" class="sub-card" />
    <text x="22" y="86" class="node-sub" fill="#fca5a5">p99: 4,200ms (&#8593;)</text>
    <text x="22" y="105" class="node-sub" fill="#fca5a5">504 Gateway Timeout</text>
    <text x="22" y="124" class="node-sub">Service A &#8594; Service B</text>
  </g>

  <!-- Step 2: RED Metrics -->
  <g transform="translate(268, 108)">
    <rect width="200" height="165" class="panel" stroke="#f59e0b" />
    <rect x="14" y="14" width="96" height="20" rx="10" fill="#f59e0b" />
    <text x="23" y="28" class="badge-text">2. RED METRICS</text>
    <text x="14" y="54" class="node-title">Prometheus / Alerts</text>
    <rect x="12" y="66" width="176" height="84" class="sub-card" />
    <text x="22" y="86" class="node-sub">&#8226; Rate: 3.2x RPS spike</text>
    <text x="22" y="105" class="node-sub">&#8226; Errors: 28% 5xx</text>
    <text x="22" y="124" class="node-sub">&#8226; Duration: Thread sat.</text>
  </g>

  <!-- Step 3: Distributed Trace Bottleneck -->
  <g transform="translate(518, 108)">
    <rect width="220" height="165" class="panel" stroke="#38bdf8" />
    <rect x="14" y="14" width="114" height="20" rx="10" fill="#38bdf8" />
    <text x="23" y="28" class="badge-text">3. TRACE SPAN</text>
    <text x="14" y="54" class="node-title">Trace Bottleneck</text>
    <rect x="12" y="66" width="196" height="84" class="sub-card" />
    <text x="22" y="85" class="node-sub">Span 1: Gateway [12ms]</text>
    <text x="22" y="104" class="node-sub">Span 2: Order   [45ms]</text>
    <text x="22" y="123" class="node-sub" fill="#fca5a5">Span 3: PayDB [3,980ms]</text>
  </g>

  <!-- Step 4: Downstream Retry Storm / DB Pool Exhaustion -->
  <g transform="translate(788, 108)">
    <rect width="284" height="165" class="panel" stroke="#ef4444" />
    <rect x="14" y="14" width="122" height="20" rx="10" fill="#ef4444" />
    <text x="23" y="28" class="badge-text">4. ROOT CAUSE</text>
    <text x="14" y="54" class="node-title">Retry Storm &amp; Pool Exhaust</text>
    <rect x="12" y="66" width="260" height="84" class="sub-card" stroke="#ef4444" />
    <text x="22" y="86" class="node-sub">&#8226; Lock/Slow SQL on Service B</text>
    <text x="22" y="105" class="node-sub">&#8226; DB HikariPool 100% full</text>
    <text x="22" y="124" class="node-sub">&#8226; Blind retries amplify 3x load</text>
  </g>

  <!-- Step 5: Circuit Breaker + Backpressure Fix -->
  <g transform="translate(28, 350)">
    <rect width="1044" height="142" class="panel" stroke="#10b981" />
    <rect x="18" y="14" width="186" height="20" rx="10" fill="#10b981" />
    <text x="27" y="28" class="badge-text">5. REMEDIATION &amp; HARDENING</text>
    <text x="220" y="29" class="node-title">Circuit Breaker + Backpressure + Isolation</text>

    <rect x="18" y="48" width="242" height="76" class="sub-card" />
    <text x="30" y="68" class="node-sub" fill="#6ee7b7">Circuit Breaker (OPEN)</text>
    <text x="30" y="87" class="node-sub">Fast-fail &gt;50% err rate</text>
    <text x="30" y="105" class="node-sub">Serve cached fallback</text>

    <rect x="276" y="48" width="242" height="76" class="sub-card" />
    <text x="288" y="68" class="node-sub" fill="#6ee7b7">Backpressure &amp; Limits</text>
    <text x="288" y="87" class="node-sub">429 Too Many Requests</text>
    <text x="288" y="105" class="node-sub">Exp. Backoff + Jitter</text>

    <rect x="534" y="48" width="242" height="76" class="sub-card" />
    <text x="546" y="68" class="node-sub" fill="#6ee7b7">Bulkhead &amp; Timeouts</text>
    <text x="546" y="87" class="node-sub">Isolated thread pools</text>
    <text x="546" y="105" class="node-sub">Strict 3s read timeout</text>

    <rect x="792" y="48" width="234" height="76" class="sub-card" />
    <text x="804" y="68" class="node-sub" fill="#6ee7b7">Long-Term DB Fix</text>
    <text x="804" y="87" class="node-sub">Index slow query / Read</text>
    <text x="804" y="105" class="node-sub">Replica + Pool tuning</text>
  </g>

  <!-- Animated Triage Signal Dots -->
  <circle r="4.5" fill="#ef4444">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 218 188 L 266 188" />
  </circle>
  <circle r="4.5" fill="#f59e0b">
    <animateMotion dur="1.5s" begin="0.4s" repeatCount="indefinite" path="M 468 188 L 516 188" />
  </circle>
  <circle r="4.5" fill="#ef4444">
    <animateMotion dur="1.5s" begin="0.8s" repeatCount="indefinite" path="M 738 188 L 786 188" />
  </circle>
  <circle r="4.5" fill="#10b981">
    <animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M 926 276 L 926 324 L 680 324 L 680 348" />
  </circle>
</svg>
