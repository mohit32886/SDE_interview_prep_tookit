<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Spring Boot Test Slice and Context Caching Pyramid">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #94a3b8; }
      .tier-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .tier-sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #e2e8f0; }
      .panel-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #cbd5e1; }
      .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #94a3b8; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.88; }
        50% { opacity: 1; }
      }
      @keyframes cachePulse {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 1; }
      }
      .tier-anim-1 { animation: pulseGlow 3s ease-in-out infinite; }
      .tier-anim-2 { animation: pulseGlow 3s ease-in-out 1s infinite; }
      .tier-anim-3 { animation: pulseGlow 3s ease-in-out 2s infinite; }
      .cache-ring { animation: cachePulse 2.2s ease-in-out infinite; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="topTier" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="midTier" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="botTier" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <path id="pulsePathUnit" d="M 55 262 L 435 262"/>
    <path id="pulsePathSlice" d="M 105 190 L 385 190"/>
    <path id="pulsePathFull" d="M 175 112 L 315 112"/>
    <path id="pulsePathCache" d="M 480 124 L 545 124"/>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="896" height="316" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="24" y="30" class="title">Spring Boot Test Slice &amp; Context Caching Pyramid</text>
  <text x="24" y="47" class="subtitle">Balance fast millisecond feedback (Unit/Mockito) with targeted Slices and cached Integration Contexts</text>

  <rect x="706" y="16" width="170" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="791" y="32" text-anchor="middle" class="badge-text" fill="#38bdf8">SPEED vs. FIDELITY</text>

  <!-- Divider -->
  <line x1="24" y1="58" x2="876" y2="58" stroke="#334155" stroke-width="1"/>

  <!-- PYRAMID LEFT SIDE (center x = 245) -->
  <!-- Top Tier: @SpringBootTest + Testcontainers (y: 72 to 144) -->
  <polygon points="245,72 175,144 315,144" fill="url(#topTier)" stroke="#c084fc" stroke-width="1.8" class="tier-anim-3"/>
  <text x="245" y="114" text-anchor="middle" class="tier-title">E2E / Full</text>
  <text x="245" y="130" text-anchor="middle" class="tier-sub">5-10% (~sec)</text>

  <!-- Middle Tier: Slice Tests (y: 150 to 218) -->
  <polygon points="168,150 322,150 378,218 112,218" fill="url(#midTier)" stroke="#60a5fa" stroke-width="1.8" class="tier-anim-2"/>
  <text x="245" y="178" text-anchor="middle" class="tier-title">Slice Tests</text>
  <text x="245" y="195" text-anchor="middle" class="tier-sub">@WebMvcTest / @DataJpaTest</text>
  <text x="245" y="210" text-anchor="middle" class="tier-sub">15-25% (~100ms-1s)</text>

  <!-- Bottom Tier: Unit Tests (y: 224 to 294) -->
  <polygon points="105,224 385,224 442,294 48,294" fill="url(#botTier)" stroke="#4ade80" stroke-width="1.8" class="tier-anim-1"/>
  <text x="245" y="252" text-anchor="middle" class="tier-title">Unit Tests (Mockito)</text>
  <text x="245" y="269" text-anchor="middle" class="tier-sub">No Spring Context | 60-80% | ~ms</text>
  <text x="245" y="284" text-anchor="middle" class="tier-sub">@Mock + @InjectMocks</text>

  <!-- Animated Test Execution Pulses on Pyramid -->
  <circle r="4" fill="#86efac">
    <animateMotion dur="1.4s" repeatCount="indefinite">
      <mpath href="#pulsePathUnit"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#93c5fd">
    <animateMotion dur="2.2s" repeatCount="indefinite">
      <mpath href="#pulsePathSlice"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#e9d5ff">
    <animateMotion dur="3.4s" repeatCount="indefinite">
      <mpath href="#pulsePathFull"/>
    </animateMotion>
  </circle>

  <!-- Speed / Cost Axis on Far Left -->
  <line x1="28" y1="286" x2="28" y2="82" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="28,74 24,84 32,84" fill="#64748b"/>
  <text x="34" y="88" class="mono-sm" fill="#c084fc">Full Stack</text>
  <text x="34" y="288" class="mono-sm" fill="#4ade80">Fastest</text>

  <!-- RIGHT PANEL: Spring TestContext Cache -->
  <rect x="470" y="72" width="406" height="222" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="488" y="95" class="panel-title">Spring TestContext Cache &amp; Containers</text>

  <!-- Cache Key Box -->
  <rect x="488" y="108" width="180" height="84" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="498" y="125" class="mono" fill="#38bdf8" font-weight="700">Context Cache Key</text>
  <text x="498" y="142" class="mono-sm">- @SpringBootTest / Slice</text>
  <text x="498" y="156" class="mono-sm">- @ActiveProfiles(&quot;test&quot;)</text>
  <text x="498" y="170" class="mono-sm">- @MockBean / @TestConfig</text>
  <text x="498" y="184" class="mono-sm">- @DynamicPropertySource</text>

  <!-- Cache Hit vs Miss Boxes -->
  <rect x="692" y="108" width="166" height="38" rx="7" fill="#052e16" stroke="#22c55e" stroke-width="1.5" class="cache-ring"/>
  <text x="704" y="125" class="mono" fill="#4ade80" font-weight="700">CACHE HIT (Reuse)</text>
  <text x="704" y="139" class="mono-sm" fill="#bbf7d0">0ms startup, shared ctx</text>

  <rect x="692" y="154" width="166" height="38" rx="7" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="704" y="171" class="mono" fill="#fbbf24" font-weight="700">CACHE MISS (Rebuild)</text>
  <text x="704" y="185" class="mono-sm" fill="#fde68a">New context per @MockBean</text>

  <!-- Arrow from Key to Hit/Miss -->
  <line x1="668" y1="127" x2="688" y2="127" stroke="#22c55e" stroke-width="1.8"/>
  <line x1="668" y1="173" x2="688" y2="173" stroke="#f59e0b" stroke-width="1.8"/>

  <!-- Animated pulse dot on Cache Hit -->
  <circle cx="678" cy="127" r="3.5" fill="#4ade80">
    <animate attributeName="cx" values="668;692" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Testcontainers & Tips Footer inside Right Panel -->
  <rect x="488" y="204" width="370" height="76" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="500" y="222" class="mono" fill="#c084fc" font-weight="700">@Testcontainers + @DynamicPropertySource</text>
  <text x="500" y="239" class="mono-sm">1. Start static MySQL / PostgreSQL / Redis container once</text>
  <text x="500" y="254" class="mono-sm">2. Inject JDBC URL &amp; ports dynamically into Environment</text>
  <text x="500" y="269" class="mono-sm">3. Avoid @DirtiesContext unless state cannot be isolated</text>
</svg>
