<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Spring Boot Deep Dive Architecture Hub">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
    <style>
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.6px; }
      .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #94a3b8; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }
      .card-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .card-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #cbd5e1; }
      .card-meta { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; fill: #94a3b8; }
      .flow-line { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 6 5; animation: dashFlow 1.8s linear infinite; }
      .pulse-dot { animation: pulseOpacity 2.2s ease-in-out infinite; }
      @keyframes dashFlow {
        to { stroke-dashoffset: -22; }
      }
      @keyframes pulseOpacity {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="316" rx="16" fill="url(#grid)"/>

  <!-- Header -->
  <circle cx="32" cy="30" r="6" fill="#22c55e" class="pulse-dot"/>
  <text x="48" y="34" class="title">SPRING BOOT DEEP DIVE ARCHITECTURE HUB</text>
  <text x="48" y="50" class="subtitle">8,800 Lines · 6 Core Modules · FAANG &amp; Production Engineering Reference</text>

  <rect x="742" y="20" width="126" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="805" y="36" text-anchor="middle" class="badge-text" fill="#38bdf8">60+ CONCEPTS</text>

  <!-- Connector Paths -->
  <path id="p12" d="M 276 119 L 330 119" class="flow-line"/>
  <path id="p23" d="M 570 119 L 624 119" class="flow-line"/>
  <path id="p35" d="M 744 163 L 744 180 L 156 180 L 156 198" class="flow-line"/>
  <path id="p54" d="M 276 242 L 330 242" class="flow-line"/>
  <path id="p46" d="M 570 242 L 624 242" class="flow-line"/>

  <!-- Arrowheads -->
  <polygon points="325,114 333,119 325,124" fill="#38bdf8"/>
  <polygon points="619,114 627,119 619,124" fill="#34d399"/>
  <polygon points="151,193 156,201 161,193" fill="#fbbf24"/>
  <polygon points="325,237 333,242 325,247" fill="#fb7185"/>
  <polygon points="619,237 627,242 619,247" fill="#a78bfa"/>

  <!-- Animated Data-Flow Pulses (SMIL) -->
  <circle r="4" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="1.4s" repeatCount="indefinite">
      <mpath href="#p12"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#34d399" filter="url(#glow)">
    <animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite">
      <mpath href="#p23"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#fbbf24" filter="url(#glow)">
    <animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite">
      <mpath href="#p35"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#fb7185" filter="url(#glow)">
    <animateMotion dur="1.4s" begin="0.8s" repeatCount="indefinite">
      <mpath href="#p54"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="1.4s" begin="1.1s" repeatCount="indefinite">
      <mpath href="#p46"/>
    </animateMotion>
  </circle>

  <!-- Row 1: 01 IoC & Beans -->
  <g transform="translate(36, 75)">
    <rect width="240" height="88" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="12" y="12" width="32" height="20" rx="5" fill="#0c4a6e"/>
    <text x="28" y="26" text-anchor="middle" class="badge-text" fill="#38bdf8">01</text>
    <text x="54" y="27" class="card-title">IoC &amp; Beans</text>
    <text x="12" y="50" class="card-sub">ApplicationContext · DI · AOP</text>
    <text x="12" y="70" class="card-meta">13+ Lifecycle Stages · CGLIB Proxies</text>
  </g>

  <!-- Row 1: 02 Auto-Config -->
  <g transform="translate(330, 75)">
    <rect width="240" height="88" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect x="12" y="12" width="32" height="20" rx="5" fill="#064e3b"/>
    <text x="28" y="26" text-anchor="middle" class="badge-text" fill="#34d399">02</text>
    <text x="54" y="27" class="card-title">Auto-Config</text>
    <text x="12" y="50" class="card-sub">@EnableAutoConfig · Actuator</text>
    <text x="12" y="70" class="card-meta">17-Level Props · Boot 3.x / GraalVM</text>
  </g>

  <!-- Row 1: 03 Web & REST -->
  <g transform="translate(624, 75)">
    <rect width="240" height="88" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="12" y="12" width="32" height="20" rx="5" fill="#78350f"/>
    <text x="28" y="26" text-anchor="middle" class="badge-text" fill="#fbbf24">03</text>
    <text x="54" y="27" class="card-title">Web &amp; REST</text>
    <text x="12" y="50" class="card-sub">DispatcherServlet · WebClient</text>
    <text x="12" y="70" class="card-meta">RFC 7807 · Validation · Bucket4j</text>
  </g>

  <!-- Row 2: 05 Security -->
  <g transform="translate(36, 198)">
    <rect width="240" height="88" rx="10" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
    <rect x="12" y="12" width="32" height="20" rx="5" fill="#881337"/>
    <text x="28" y="26" text-anchor="middle" class="badge-text" fill="#fb7185">05</text>
    <text x="54" y="27" class="card-title">Security</text>
    <text x="12" y="50" class="card-sub">SecurityFilterChain · JWT</text>
    <text x="12" y="70" class="card-meta">OAuth2 · @PreAuthorize · CSRF/XSS</text>
  </g>

  <!-- Row 2: 04 Data & JPA -->
  <g transform="translate(330, 198)">
    <rect width="240" height="88" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="12" y="12" width="32" height="20" rx="5" fill="#4c1d95"/>
    <text x="28" y="26" text-anchor="middle" class="badge-text" fill="#a78bfa">04</text>
    <text x="54" y="27" class="card-title">Data &amp; JPA</text>
    <text x="12" y="50" class="card-sub">@Transactional · HikariCP</text>
    <text x="12" y="70" class="card-meta">N+1 Fixes · Propagation · Flyway</text>
  </g>

  <!-- Row 2: 06 Testing & Perf -->
  <g transform="translate(624, 198)">
    <rect width="240" height="88" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="12" y="12" width="32" height="20" rx="5" fill="#164e63"/>
    <text x="28" y="26" text-anchor="middle" class="badge-text" fill="#22d3ee">06</text>
    <text x="54" y="27" class="card-title">Testing &amp; Perf</text>
    <text x="12" y="50" class="card-sub">MockMvc · Testcontainers</text>
    <text x="12" y="70" class="card-meta">@Cacheable · @Async · Micrometer</text>
  </g>

  <!-- Footer Strip -->
  <text x="36" y="305" class="card-meta">Study Flow: Container &amp; Auto-Config → HTTP &amp; Security → Persistence &amp; Transactions → Testing &amp; Observability</text>
</svg>
