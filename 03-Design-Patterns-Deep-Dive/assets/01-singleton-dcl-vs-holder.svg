<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Singleton Thread-Safety: DCL (volatile) vs Bill Pugh Holder vs Enum</title>
  <desc id="desc">Animated comparison of Double-Checked Locking with volatile memory barrier, Bill Pugh static inner Holder classloader initialization, and Enum Singleton guarantees.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .box { fill: #0f172a; stroke: #475569; stroke-width: 1.2; }
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
      .panel-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #e2e8f0; }
      .muted { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #94a3b8; }
      .label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }

      @keyframes pulseGlow {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 1; }
      }
      @keyframes barrierPulse {
        0%, 35% { opacity: 0.35; }
        45%, 70% { opacity: 1; }
        85%, 100% { opacity: 0.35; }
      }
      @keyframes shieldGlow {
        0%, 100% { fill-opacity: 0.14; stroke-opacity: 0.6; }
        50% { fill-opacity: 0.28; stroke-opacity: 1; }
      }
      .volatile-box { animation: barrierPulse 6s ease-in-out infinite; }
      .clinit-box { animation: pulseGlow 4s ease-in-out infinite; }
      .shield { animation: shieldGlow 3.5s ease-in-out infinite; }
      .shield-2 { animation: shieldGlow 3.5s ease-in-out 1.1s infinite; }
      .shield-3 { animation: shieldGlow 3.5s ease-in-out 2.2s infinite; }
    </style>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect class="bg" x="0" y="0" width="960" height="540" rx="14" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <text x="28" y="38" class="title">Singleton Thread-Safety: DCL (volatile) vs Bill Pugh Holder vs Enum</text>
  <text x="28" y="58" class="subtitle">Concurrent Thread A &amp; Thread B racing on lazy initialization, JVM classloader guarantees, and attack resistance</text>

  <!-- Legend -->
  <circle cx="710" cy="34" r="5" fill="#38bdf8" />
  <text x="721" y="38" class="label">Thread A</text>
  <circle cx="795" cy="34" r="5" fill="#fbbf24" />
  <text x="806" y="38" class="label">Thread B</text>
  <circle cx="878" cy="34" r="5" fill="#4ade80" />
  <text x="889" y="38" class="label">INSTANCE</text>

  <!-- ==================== PANEL 1: DCL ==================== -->
  <rect class="panel" x="24" y="78" width="296" height="438" rx="10" />
  <rect x="24" y="78" width="296" height="36" rx="10" fill="#172554" />
  <rect x="24" y="102" width="296" height="12" fill="#172554" />
  <text x="40" y="101" class="panel-title">1. Double-Checked Locking</text>
  <rect x="242" y="86" width="66" height="20" rx="10" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
  <text x="252" y="100" class="badge-text" fill="#7dd3fc">volatile</text>

  <!-- Thread Entry Boxes -->
  <rect class="box" x="42" y="130" width="118" height="30" rx="6" />
  <text x="64" y="149" class="code" fill="#7dd3fc">Thread A</text>
  <rect class="box" x="184" y="130" width="118" height="30" rx="6" />
  <text x="206" y="149" class="code" fill="#fde68a">Thread B</text>

  <!-- Check 1 -->
  <rect class="box" x="42" y="182" width="260" height="38" rx="6" />
  <text x="56" y="200" class="code">1st Check: if (instance == null)</text>
  <text x="56" y="213" class="muted">Unlocked fast-path after init</text>

  <!-- Synchronized Gate -->
  <rect class="box" x="42" y="236" width="260" height="44" rx="6" stroke="#f59e0b" />
  <text x="56" y="255" class="code" fill="#fcd34d">synchronized (Singleton.class)</text>
  <text x="56" y="270" class="muted">Thread A enters; Thread B waits</text>

  <!-- Check 2 + volatile barrier -->
  <rect class="box volatile-box" x="42" y="296" width="260" height="106" rx="6" stroke="#38bdf8" stroke-width="1.5" />
  <text x="56" y="315" class="code">2nd Check: if (instance == null)</text>
  <line x1="54" y1="324" x2="290" y2="324" stroke="#334155" stroke-width="1" />
  <text x="56" y="340" class="code" fill="#7dd3fc">volatile prevents reordering:</text>
  <text x="62" y="357" class="muted">1. Allocate memory</text>
  <text x="62" y="372" class="muted">2. Run constructor (init fields)</text>
  <text x="62" y="387" class="code" fill="#4ade80">3. Assign volatile ref (happens-before)</text>

  <!-- Instance Node -->
  <rect x="76" y="418" width="192" height="36" rx="18" fill="#052e16" stroke="#4ade80" stroke-width="1.5" />
  <text x="114" y="440" class="code" fill="#86efac">Single INSTANCE</text>

  <!-- Connectors -->
  <path d="M 101 160 L 101 180" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <path d="M 243 160 L 243 180" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />
  <path d="M 101 220 L 101 234" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <path d="M 101 280 L 101 294" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <path d="M 172 402 L 172 416" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)" />

  <!-- Animated Thread A & Thread B dots in Panel 1 -->
  <circle r="5.5" fill="#38bdf8">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 101 145 L 101 200 L 101 258 L 101 350 L 172 436" />
  </circle>
  <circle r="5.5" fill="#fbbf24">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0.25;0.25;0.6;1" keyTimes="0;0.25;0.55;0.75;1" calcMode="linear" path="M 243 145 L 243 200 L 243 258 L 243 200 L 172 436" />
  </circle>

  <!-- Bottom Badge -->
  <rect x="42" y="470" width="260" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="58" y="489" class="badge-text" fill="#93c5fd">Lazy + Fast Read | Requires volatile</text>


  <!-- ==================== PANEL 2: BILL PUGH ==================== -->
  <rect class="panel" x="336" y="78" width="288" height="438" rx="10" />
  <rect x="336" y="78" width="288" height="36" rx="10" fill="#064e3b" />
  <rect x="336" y="102" width="288" height="12" fill="#064e3b" />
  <text x="352" y="101" class="panel-title">2. Bill Pugh Static Holder</text>
  <rect x="530" y="86" width="82" height="20" rx="10" fill="#16a34a" fill-opacity="0.25" stroke="#4ade80" stroke-width="1" />
  <text x="539" y="100" class="badge-text" fill="#86efac">Preferred</text>

  <!-- Outer Class -->
  <rect class="box" x="354" y="130" width="252" height="64" rx="6" />
  <text x="368" y="150" class="code" fill="#e2e8f0">class BillPughSingleton</text>
  <text x="368" y="168" class="muted">Loaded at startup, Holder NOT loaded</text>
  <text x="368" y="184" class="code" fill="#86efac">getInstance() -&gt; Holder.INSTANCE</text>

  <!-- Thread calls -->
  <text x="372" y="218" class="label" fill="#38bdf8">Thread A calls</text>
  <text x="504" y="218" class="label" fill="#fbbf24">Thread B calls</text>

  <!-- JVM ClassLoader Lock -->
  <rect class="box clinit-box" x="354" y="236" width="252" height="72" rx="6" stroke="#4ade80" stroke-width="1.5" />
  <text x="368" y="256" class="code" fill="#4ade80">JVM ClassLoader &lt;clinit&gt; Lock</text>
  <text x="368" y="274" class="muted">1. Loads SingletonHelper on 1st call</text>
  <text x="368" y="290" class="muted">2. JVM guarantees single atomic init</text>

  <!-- Inner Holder Class -->
  <rect class="box" x="354" y="326" width="252" height="76" rx="6" stroke="#334155" />
  <text x="368" y="346" class="code" fill="#cbd5e1">private static class Holder {</text>
  <text x="378" y="365" class="code" fill="#86efac">static final INSTANCE =</text>
  <text x="394" y="381" class="code" fill="#86efac">new BillPughSingleton();</text>
  <text x="368" y="395" class="code" fill="#cbd5e1">}</text>

  <!-- Instance Node -->
  <rect x="384" y="418" width="192" height="36" rx="18" fill="#052e16" stroke="#4ade80" stroke-width="1.5" />
  <text x="418" y="440" class="code" fill="#86efac">Single INSTANCE</text>

  <!-- Connectors -->
  <path d="M 420 194 L 420 234" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <path d="M 540 194 L 540 234" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />
  <path d="M 480 308 L 480 324" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)" />
  <path d="M 480 402 L 480 416" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrowGreen)" />

  <!-- Animated dots -->
  <circle r="5.5" fill="#38bdf8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 420 185 L 420 272 L 480 365 L 480 436" />
  </circle>
  <circle r="5.5" fill="#fbbf24">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0.3;0.3;0.75;1" keyTimes="0;0.25;0.5;0.8;1" calcMode="linear" path="M 540 185 L 540 272 L 480 365 L 480 436" />
  </circle>

  <!-- Bottom Badge -->
  <rect x="354" y="470" width="252" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="366" y="489" class="badge-text" fill="#86efac">Lazy + Zero Lock Overhead (No volatile)</text>


  <!-- ==================== PANEL 3: ENUM ==================== -->
  <rect class="panel" x="640" y="78" width="296" height="438" rx="10" />
  <rect x="640" y="78" width="296" height="36" rx="10" fill="#3b0764" />
  <rect x="640" y="102" width="296" height="12" fill="#3b0764" />
  <text x="656" y="101" class="panel-title">3. Enum Singleton</text>
  <rect x="838" y="86" width="84" height="20" rx="10" fill="#9333ea" fill-opacity="0.25" stroke="#c084fc" stroke-width="1" />
  <text x="846" y="100" class="badge-text" fill="#e9d5ff">Bulletproof</text>

  <!-- Code Box -->
  <rect class="box" x="658" y="130" width="260" height="64" rx="6" />
  <text x="672" y="150" class="code" fill="#e9d5ff">public enum EnumSingleton {</text>
  <text x="688" y="168" class="code" fill="#4ade80">INSTANCE;</text>
  <text x="672" y="185" class="code" fill="#e9d5ff">}</text>

  <!-- Three JVM Shields -->
  <rect class="shield" x="658" y="212" width="260" height="44" rx="8" fill="#a855f7" stroke="#c084fc" stroke-width="1.2" />
  <text x="674" y="231" class="label" fill="#f3e8ff">1. JVM Thread-Safe (&lt;clinit&gt;)</text>
  <text x="674" y="247" class="muted">Guaranteed single enum constant</text>

  <rect class="shield-2" x="658" y="268" width="260" height="44" rx="8" fill="#a855f7" stroke="#c084fc" stroke-width="1.2" />
  <text x="674" y="287" class="label" fill="#f3e8ff">2. Reflection-Proof</text>
  <text x="674" y="303" class="muted">Constructor.newInstance() throws Error</text>

  <rect class="shield-3" x="658" y="324" width="260" height="44" rx="8" fill="#a855f7" stroke="#c084fc" stroke-width="1.2" />
  <text x="674" y="343" class="label" fill="#f3e8ff">3. Serialization-Safe</text>
  <text x="674" y="359" class="muted">JVM resolves by enum name automatically</text>

  <!-- Instance Orbit -->
  <circle cx="788" cy="418" r="34" fill="#052e16" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 3">
    <animateTransform attributeName="transform" type="rotate" from="0 788 418" to="360 788 418" dur="12s" repeatCount="indefinite" />
  </circle>
  <rect x="734" y="402" width="108" height="32" rx="16" fill="#052e16" stroke="#4ade80" stroke-width="1.5" />
  <text x="756" y="422" class="code" fill="#86efac">INSTANCE</text>

  <!-- Thread A & B pointing to INSTANCE -->
  <circle cx="678" cy="418" r="5" fill="#38bdf8" />
  <path d="M 684 418 L 730 418" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <circle cx="898" cy="418" r="5" fill="#fbbf24" />
  <path d="M 892 418 L 846 418" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />

  <!-- Bottom Badge -->
  <rect x="658" y="470" width="260" height="30" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="674" y="489" class="badge-text" fill="#e9d5ff">Blocks Reflection &amp; Serialization</text>
</svg>
