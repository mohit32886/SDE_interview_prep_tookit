<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto" role="img" aria-label="Flyweight Pattern Memory Sharing Animation">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 14; }
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; fill: #94a3b8; }
      .panel-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
      .mono-sm { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #cbd5e1; }
      .label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
      .badge-text { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; }

      .cache-glow { animation: cacheGlow 3s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 6 5; animation: dashFlow 1.6s linear infinite; }

      @keyframes cacheGlow {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; stroke-width: 2.4; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -22; }
      }
    </style>

    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" width="960" height="520" rx="16"/>

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" class="title">Flyweight Pattern — Intrinsic vs. Extrinsic State Sharing</text>
  <text x="480" y="58" text-anchor="middle" class="subtitle">1,000,000 Tree instances share just 3 immutable TreeType flyweights via O(1) TreeFactory lookup</text>

  <!-- ==================== LEFT: EXTRINSIC INSTANCES ==================== -->
  <rect class="card" x="28" y="78" width="320" height="316" rx="14"/>
  <text x="48" y="106" class="panel-title" fill="#38bdf8">1,000,000 TREE INSTANCES</text>
  <text x="48" y="124" class="subtitle">Extrinsic State (unique, lightweight ~16 B)</text>

  <!-- Tree #1 -->
  <rect x="46" y="140" width="284" height="52" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="58" y="160" class="mono" fill="#38bdf8">Tree #1</text>
  <text x="200" y="160" class="mono-sm" fill="#94a3b8">x: 12, y: 45</text>
  <text x="58" y="179" class="mono-sm" fill="#cbd5e1">typeRef -&gt; Oak_Flyweight</text>

  <!-- Tree #2 -->
  <rect x="46" y="204" width="284" height="52" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.3"/>
  <text x="58" y="224" class="mono" fill="#34d399">Tree #2</text>
  <text x="200" y="224" class="mono-sm" fill="#94a3b8">x: 88, y: 19</text>
  <text x="58" y="243" class="mono-sm" fill="#cbd5e1">typeRef -&gt; Pine_Flyweight</text>

  <!-- Tree #3 -->
  <rect x="46" y="268" width="284" height="52" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="58" y="288" class="mono" fill="#a78bfa">Tree #3</text>
  <text x="200" y="288" class="mono-sm" fill="#94a3b8">x: 64, y: 92</text>
  <text x="58" y="307" class="mono-sm" fill="#cbd5e1">typeRef -&gt; Birch_Flyweight</text>

  <!-- Tree #1,000,000 -->
  <rect x="46" y="332" width="284" height="46" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="58" y="352" class="mono" fill="#38bdf8">Tree #1,000,000</text>
  <text x="200" y="352" class="mono-sm" fill="#94a3b8">x: 410, y: 77</text>
  <text x="58" y="369" class="mono-sm" fill="#cbd5e1">typeRef -&gt; Oak_Flyweight (reused!)</text>

  <!-- ==================== MIDDLE: TREEFACTORY O(1) CACHE ==================== -->
  <rect class="card" x="378" y="78" width="210" height="316" rx="14"/>
  <text x="483" y="106" text-anchor="middle" class="panel-title" fill="#fbbf24">TREEFACTORY</text>
  <text x="483" y="124" text-anchor="middle" class="subtitle">O(1) HashMap Cache</text>

  <rect class="cache-glow" x="396" y="144" width="174" height="176" rx="10" fill="#78350f" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="483" y="166" text-anchor="middle" class="mono" fill="#fde68a">Map&lt;String, TreeType&gt;</text>

  <rect x="410" y="180" width="146" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="483" y="200" text-anchor="middle" class="mono-sm" fill="#bae6fd">"Oak" -&gt; 0x1A4F</text>

  <rect x="410" y="222" width="146" height="32" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="483" y="242" text-anchor="middle" class="mono-sm" fill="#a7f3d0">"Pine" -&gt; 0x2B8C</text>

  <rect x="410" y="264" width="146" height="32" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="483" y="284" text-anchor="middle" class="mono-sm" fill="#ddd6fe">"Birch" -&gt; 0x3D1E</text>

  <rect x="396" y="334" width="174" height="44" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="483" y="353" text-anchor="middle" class="mono-sm" fill="#fbbf24">Pool Size: 3 objects</text>
  <text x="483" y="369" text-anchor="middle" class="badge-text" fill="#94a3b8">computeIfAbsent()</text>

  <!-- ==================== RIGHT: INTRINSIC FLYWEIGHTS ==================== -->
  <rect class="card" x="618" y="78" width="314" height="316" rx="14"/>
  <text x="638" y="106" class="panel-title" fill="#34d399">3 IMMUTABLE FLYWEIGHTS</text>
  <text x="638" y="124" class="subtitle">Intrinsic State (shared, heavy ~2 KB each)</text>

  <!-- Flyweight 1: Oak -->
  <rect x="636" y="144" width="278" height="70" rx="9" fill="#0c4a6e" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="650" y="166" class="mono" fill="#38bdf8">Oak_TreeType (0x1A4F)</text>
  <text x="650" y="185" class="mono-sm">mesh: oak_v2.obj | tex: bark.png</text>
  <text x="650" y="202" class="badge-text" fill="#7dd3fc">Immutable • Shared by ~333k trees</text>

  <!-- Flyweight 2: Pine -->
  <rect x="636" y="226" width="278" height="70" rx="9" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-width="1.6"/>
  <text x="650" y="248" class="mono" fill="#34d399">Pine_TreeType (0x2B8C)</text>
  <text x="650" y="267" class="mono-sm">mesh: pine.obj | tex: needle.png</text>
  <text x="650" y="284" class="badge-text" fill="#6ee7b7">Immutable • Shared by ~333k trees</text>

  <!-- Flyweight 3: Birch -->
  <rect x="636" y="308" width="278" height="70" rx="9" fill="#4c1d95" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="650" y="330" class="mono" fill="#a78bfa">Birch_TreeType (0x3D1E)</text>
  <text x="650" y="349" class="mono-sm">mesh: birch.obj | tex: white.png</text>
  <text x="650" y="366" class="badge-text" fill="#c4b5fd">Immutable • Shared by ~333k trees</text>

  <!-- ==================== CONNECTING ANIMATED LINES ==================== -->
  <!-- Tree #1 & Tree #1M -> Oak -->
  <path class="flow-line" d="M 330 166 L 410 196" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
  <path class="flow-line" d="M 330 355 L 410 202" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
  <path class="flow-line" d="M 556 196 L 636 179" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-sky)"/>

  <!-- Tree #2 -> Pine -->
  <path class="flow-line" d="M 330 230 L 410 238" fill="none" stroke="#34d399" stroke-width="1.6"/>
  <path class="flow-line" d="M 556 238 L 636 261" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Tree #3 -> Birch -->
  <path class="flow-line" d="M 330 294 L 410 280" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
  <path class="flow-line" d="M 556 280 L 636 343" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <!-- Animated lookup pulses -->
  <circle r="4.5" fill="#38bdf8">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 330 166 L 410 196 L 556 196 L 636 179"/>
  </circle>
  <circle r="4.5" fill="#34d399">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M 330 230 L 410 238 L 556 238 L 636 261"/>
  </circle>
  <circle r="4.5" fill="#a78bfa">
    <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M 330 294 L 410 280 L 556 280 L 636 343"/>
  </circle>

  <!-- ==================== BOTTOM: RAM SAVINGS COMPARISON ==================== -->
  <rect class="card" x="28" y="410" width="904" height="90" rx="12"/>
  <text x="48" y="435" class="panel-title" fill="#f8fafc">MEMORY FOOTPRINT COMPARISON (1,000,000 TREES)</text>

  <!-- Without Flyweight Bar -->
  <text x="48" y="459" class="mono-sm" fill="#fca5a5">Without Flyweight:</text>
  <rect x="200" y="447" width="540" height="16" rx="4" fill="#ef4444" fill-opacity="0.75"/>
  <text x="752" y="459" class="mono" fill="#fca5a5">~2.0 GB (1M x 2 KB duplicated)</text>

  <!-- With Flyweight Bar -->
  <text x="48" y="484" class="mono-sm" fill="#6ee7b7">With Flyweight:</text>
  <rect x="200" y="472" width="22" height="16" rx="4" fill="#34d399">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="234" y="484" class="mono" fill="#34d399">~16 MB (99%+ RAM Saved • 3 shared TreeTypes)</text>
</svg>
