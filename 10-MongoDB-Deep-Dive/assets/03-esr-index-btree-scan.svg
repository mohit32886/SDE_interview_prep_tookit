<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="MongoDB ESR Rule and B-Tree Index Scan vs Collection Scan">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; fill: #94a3b8; }
      .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; }
      .flow-fast { stroke: #38bdf8; stroke-width: 2.5; fill: none; stroke-dasharray: 6 5; animation: dashFast 1.2s linear infinite; }
      .flow-slow { stroke: #f87171; stroke-width: 2; fill: none; stroke-dasharray: 4 6; animation: dashSlow 2.4s linear infinite; }
      @keyframes dashFast {
        to { stroke-dashoffset: -22; }
      }
      @keyframes dashSlow {
        to { stroke-dashoffset: -20; }
      }
      .pulse-green { animation: pulseGreen 2.4s ease-in-out infinite; }
      @keyframes pulseGreen {
        0%, 100% { stroke-opacity: 0.7; }
        50% { stroke-opacity: 1; }
      }
    </style>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
  </defs>

  <!-- Outer dark-slate background -->
  <rect class="bg" x="0" y="0" width="900" height="320" rx="14" />
  <rect class="card" x="14" y="14" width="872" height="292" rx="10" />

  <!-- Header -->
  <text class="title" x="32" y="42">MongoDB ESR Rule &amp; B-Tree Index Scan</text>
  <text class="subtitle" x="32" y="60">Optimal Compound Index: { status: 1, total: -1, orderDate: 1 }</text>

  <!-- Fast Path Label -->
  <rect x="740" y="28" width="128" height="24" rx="12" fill="#166534" stroke="#4ade80" stroke-width="1" />
  <text class="badge-text" x="804" y="44" text-anchor="middle" fill="#dcfce7">O(log N) • IXSCAN</text>

  <!-- ESR Path Connectors -->
  <path id="esrPath" class="flow-fast" d="M 118 122 L 154 122 M 316 122 L 352 122 M 514 122 L 550 122 M 708 122 L 738 122" marker-end="url(#arrowBlue)" />
  <path id="esrMotionTrack" d="M 75 122 L 806 122" fill="none" stroke="none" />

  <!-- Query Start Node -->
  <rect x="32" y="96" width="86" height="52" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text class="label" x="75" y="118" text-anchor="middle">Query</text>
  <text class="sub" x="75" y="135" text-anchor="middle">find + sort</text>

  <!-- E: Equality -->
  <rect x="156" y="88" width="160" height="68" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" />
  <text class="badge-text" x="236" y="106" text-anchor="middle" fill="#93c5fd">1. E — EQUALITY</text>
  <text class="label" x="236" y="125" text-anchor="middle">Exact Match</text>
  <text class="sub" x="236" y="143" text-anchor="middle">status: "active"</text>

  <!-- S: Sort -->
  <rect x="354" y="88" width="160" height="68" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
  <text class="badge-text" x="434" y="106" text-anchor="middle" fill="#e9d5ff">2. S — SORT</text>
  <text class="label" x="434" y="125" text-anchor="middle">Pre-Sorted Order</text>
  <text class="sub" x="434" y="143" text-anchor="middle">sort({ total: -1 })</text>

  <!-- R: Range -->
  <rect x="552" y="88" width="156" height="68" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
  <text class="badge-text" x="630" y="106" text-anchor="middle" fill="#fde68a">3. R — RANGE</text>
  <text class="label" x="630" y="125" text-anchor="middle">Bounded Scan</text>
  <text class="sub" x="630" y="143" text-anchor="middle">orderDate &gt;= Jan 1</text>

  <!-- IXSCAN / Covered Result -->
  <rect class="pulse-green" x="740" y="84" width="128" height="76" rx="8" fill="#14532d" stroke="#4ade80" stroke-width="2" />
  <text class="badge-text" x="804" y="103" text-anchor="middle" fill="#86efac">B-TREE HIT</text>
  <text class="label" x="804" y="122" text-anchor="middle">IXSCAN</text>
  <text class="sub" x="804" y="139" text-anchor="middle">Covered Query</text>
  <text class="sub" x="804" y="152" text-anchor="middle" fill="#86efac">0 Docs Fetched</text>

  <!-- Animated Fast Query Probe -->
  <circle r="5.5" fill="#38bdf8" stroke="#f8fafc" stroke-width="1.5">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 75 122 L 804 122" />
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.08;0.85;0.95;1" dur="3.2s" repeatCount="indefinite" />
  </circle>

  <!-- Divider -->
  <line x1="32" y1="184" x2="868" y2="184" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Slow Path (COLLSCAN) -->
  <text class="badge-text" x="32" y="206" fill="#fca5a5">ANTI-PATTERN: MISSING PREFIX OR UNINDEXED FIELD</text>

  <!-- Unindexed Query -->
  <rect x="32" y="220" width="160" height="62" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1.5" />
  <text class="label" x="112" y="244" text-anchor="middle">Unindexed Query</text>
  <text class="sub" x="112" y="263" text-anchor="middle">find({ name: "John" })</text>

  <!-- Slow Scan Arrow -->
  <path class="flow-slow" d="M 194 251 L 254 251" marker-end="url(#arrowRed)" />

  <!-- COLLSCAN Container -->
  <rect x="258" y="216" width="610" height="70" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
  <text class="badge-text" x="274" y="236" fill="#fecaca">COLLSCAN (SLOW FULL COLLECTION SCAN • O(N))</text>

  <!-- Document Blocks Being Scanned -->
  <g transform="translate(274, 245)">
    <rect x="0" y="0" width="54" height="28" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
    <text class="sub" x="27" y="18" text-anchor="middle">Doc 1</text>

    <rect x="64" y="0" width="54" height="28" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
    <text class="sub" x="91" y="18" text-anchor="middle">Doc 2</text>

    <rect x="128" y="0" width="54" height="28" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
    <text class="sub" x="155" y="18" text-anchor="middle">Doc 3</text>

    <rect x="192" y="0" width="54" height="28" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
    <text class="sub" x="219" y="18" text-anchor="middle">Doc 4</text>

    <text class="sub" x="266" y="18" text-anchor="middle" fill="#fca5a5">...</text>

    <rect x="286" y="0" width="68" height="28" rx="4" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
    <text class="sub" x="320" y="18" text-anchor="middle">Doc N</text>

    <rect x="372" y="0" width="204" height="28" rx="4" fill="#991b1b" stroke="#fca5a5" stroke-width="1" />
    <text class="sub" x="474" y="18" text-anchor="middle" fill="#fee2e2">High I/O • Memory Eviction</text>
  </g>

  <!-- Animated Slow Scan Probe -->
  <circle r="5" fill="#f87171" stroke="#fee2e2" stroke-width="1.2">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 112 251 L 605 259" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" repeatCount="indefinite" />
  </circle>
</svg>
