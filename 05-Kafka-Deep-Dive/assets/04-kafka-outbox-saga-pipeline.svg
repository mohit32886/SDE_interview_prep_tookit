<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Transactional Outbox Pattern with Debezium CDC and Idempotent Saga Consumers">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .title { font: 700 20px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .box-title { font: 700 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .box-sub { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
      .label-sm { font: 600 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .badge-text { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6ee7b7; }
      .wire-blue { fill: none; stroke: #38bdf8; stroke-width: 2.5; stroke-dasharray: 6 5; opacity: 0.65; }
      .wire-purple { fill: none; stroke: #a855f7; stroke-width: 2.5; stroke-dasharray: 6 5; opacity: 0.65; }
      .wire-green { fill: none; stroke: #22c55e; stroke-width: 2.5; stroke-dasharray: 6 5; opacity: 0.65; }
      .node-svc { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; }
      .node-db { fill: #0f172a; stroke: #10b981; stroke-width: 2; }
      .node-cdc { fill: #0f172a; stroke: #a855f7; stroke-width: 2; }
      .node-kafka { fill: #0f172a; stroke: #f59e0b; stroke-width: 2; }
      .node-cons { fill: #0f172a; stroke: #22c55e; stroke-width: 2; }
      .acid-glow { animation: glowEmerald 2.6s ease-in-out infinite; }
      .dedup-glow { animation: glowBlue 2.4s ease-in-out infinite; }
      @keyframes glowEmerald {
        0%, 100% { stroke-opacity: 0.65; filter: drop-shadow(0 0 2px #10b981); }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
      }
      @keyframes glowBlue {
        0%, 100% { stroke-opacity: 0.65; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
    </style>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22c55e"/>
    </marker>

    <!-- Motion Paths -->
    <path id="acidToKafka" d="M 110 185 L 110 315 L 305 315 L 305 260 L 465 260" />
    <path id="kafkaToPayment" d="M 555 235 L 620 155 L 810 155" />
    <path id="kafkaToInventory" d="M 555 285 L 620 365 L 810 365" />
  </defs>

  <!-- Card -->
  <rect class="bg" width="960" height="520" rx="16"/>
  <rect class="card" x="18" y="18" width="924" height="484" rx="14"/>

  <!-- Header -->
  <text class="title" x="42" y="54">Transactional Outbox + Debezium CDC + Idempotent Saga Pipeline</text>
  <text class="subtitle" x="42" y="76">Local ACID write guarantees at-least-once delivery; downstream consumers deduplicate via processed_events</text>

  <!-- Stage 1: Order Service -->
  <rect class="node-svc" x="40" y="112" width="160" height="72" rx="10"/>
  <text class="box-title" x="120" y="138" text-anchor="middle">Order Service</text>
  <text class="box-sub" x="120" y="157" text-anchor="middle">@Transactional</text>
  <text class="label-sm" x="120" y="174" text-anchor="middle">POST /orders</text>

  <!-- Connector Order -> DB -->
  <path class="wire-blue" d="M 120 184 L 120 225" marker-end="url(#arr-blue)"/>

  <!-- Stage 1b: Local ACID DB -->
  <rect class="node-db acid-glow" x="34" y="230" width="172" height="172" rx="10"/>
  <rect x="48" y="242" width="144" height="20" rx="4" fill="#064e3b"/>
  <text class="badge-text" x="120" y="256" text-anchor="middle">LOCAL ACID TX COMMIT</text>

  <rect x="48" y="272" width="144" height="52" rx="6" fill="#1e293b" stroke="#334155"/>
  <text class="box-title" x="120" y="294" text-anchor="middle">Table: orders</text>
  <text class="box-sub" x="120" y="312" text-anchor="middle">id=ord-42, CREATED</text>

  <rect x="48" y="336" width="144" height="52" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text class="box-title" x="120" y="358" text-anchor="middle">Table: outbox</text>
  <text class="box-sub" x="120" y="376" text-anchor="middle">evt-99, OrderCreated</text>

  <!-- Connector DB -> Debezium -->
  <path class="wire-purple" d="M 206 362 L 245 362 L 245 260 L 258 260" marker-end="url(#arr-purple)"/>

  <!-- Stage 2: Debezium CDC -->
  <rect class="node-cdc" x="262" y="205" width="136" height="110" rx="10"/>
  <text class="box-title" x="330" y="236" text-anchor="middle">Debezium CDC</text>
  <text class="box-sub" x="330" y="257" text-anchor="middle">WAL / Binlog</text>
  <text class="box-sub" x="330" y="274" text-anchor="middle">Tailer (No Poll)</text>
  <text class="label-sm" x="330" y="298" text-anchor="middle">Low-latency push</text>

  <!-- Connector Debezium -> Kafka -->
  <path class="wire-purple" d="M 398 260 L 430 260" marker-end="url(#arr-purple)"/>

  <!-- Stage 3: Kafka Topic -->
  <rect class="node-kafka" x="435" y="205" width="145" height="110" rx="10"/>
  <text class="box-title" x="507" y="234" text-anchor="middle">Kafka Broker</text>
  <text class="box-sub" x="507" y="255" text-anchor="middle">order.events</text>
  <text class="label-sm" x="507" y="276" text-anchor="middle">Key: orderId</text>
  <text class="label-sm" x="507" y="294" text-anchor="middle">At-least-once log</text>

  <!-- Connectors Kafka -> Consumers -->
  <path class="wire-green" d="M 580 235 L 625 155 L 640 155" marker-end="url(#arr-green)"/>
  <path class="wire-green" d="M 580 285 L 625 365 L 640 365" marker-end="url(#arr-green)"/>

  <!-- Stage 4 Top: Payment Consumer + Dedup -->
  <rect class="node-cons" x="645" y="108" width="135" height="94" rx="10"/>
  <text class="box-title" x="712" y="136" text-anchor="middle">Payment Svc</text>
  <text class="box-sub" x="712" y="156" text-anchor="middle">payment-group</text>
  <text class="label-sm" x="712" y="178" text-anchor="middle">Charge card</text>

  <path class="wire-blue" d="M 780 155 L 802 155" marker-end="url(#arr-blue)"/>
  <rect class="node-svc dedup-glow" x="806" y="114" width="116" height="82" rx="10"/>
  <text class="box-title" x="864" y="142" text-anchor="middle">Idempotent</text>
  <text class="box-sub" x="864" y="160" text-anchor="middle">processed_evts</text>
  <text class="label-sm" x="864" y="179" text-anchor="middle">Skip if seen</text>

  <!-- Stage 4 Bottom: Inventory Consumer + Dedup -->
  <rect class="node-cons" x="645" y="318" width="135" height="94" rx="10"/>
  <text class="box-title" x="712" y="346" text-anchor="middle">Inventory Svc</text>
  <text class="box-sub" x="712" y="366" text-anchor="middle">inventory-group</text>
  <text class="label-sm" x="712" y="388" text-anchor="middle">Reserve stock</text>

  <path class="wire-blue" d="M 780 365 L 802 365" marker-end="url(#arr-blue)"/>
  <rect class="node-svc dedup-glow" x="806" y="324" width="116" height="82" rx="10"/>
  <text class="box-title" x="864" y="352" text-anchor="middle">Idempotent</text>
  <text class="box-sub" x="864" y="370" text-anchor="middle">processed_evts</text>
  <text class="label-sm" x="864" y="389" text-anchor="middle">Skip if seen</text>

  <!-- Animated Event Packets -->
  <circle r="7" fill="#a855f7" stroke="#f3e8ff" stroke-width="1.5">
    <animateMotion dur="4.0s" repeatCount="indefinite" begin="0s">
      <mpath href="#acidToKafka"/>
    </animateMotion>
  </circle>
  <circle r="7" fill="#22c55e" stroke="#ecfdf5" stroke-width="1.5">
    <animateMotion dur="3.0s" repeatCount="indefinite" begin="0.8s">
      <mpath href="#kafkaToPayment"/>
    </animateMotion>
  </circle>
  <circle r="7" fill="#22c55e" stroke="#ecfdf5" stroke-width="1.5">
    <animateMotion dur="3.0s" repeatCount="indefinite" begin="1.1s">
      <mpath href="#kafkaToInventory"/>
    </animateMotion>
  </circle>

  <!-- Footer -->
  <line x1="40" y1="448" x2="920" y2="448" stroke="#334155" stroke-width="1"/>
  <circle cx="54" cy="472" r="6" fill="#10b981"/>
  <text class="label-sm" x="68" y="476">1. Atomic Local TX (orders + outbox)</text>

  <circle cx="310" cy="472" r="6" fill="#a855f7"/>
  <text class="label-sm" x="324" y="476">2. Debezium WAL Capture -&gt; Kafka</text>

  <circle cx="570" cy="472" r="6" fill="#22c55e"/>
  <text class="label-sm" x="584" y="476">3. Parallel Consumers + Idempotent Dedup</text>
</svg>
