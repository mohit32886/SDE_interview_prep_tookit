<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="auto" role="img" aria-label="Kafka Streams Windowing Timeline: Tumbling, Hopping, Sliding, and Session Windows">
  <defs>
    <style>
      .title { font: 700 20px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 12.5px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .track-title { font: 700 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f1f5f9; }
      .track-sub { font: 500 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; }
      .axis-lbl { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; }
      .win-lbl { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f8fafc; }

      .win-pulse {
        animation: winGlow 3.2s ease-in-out infinite;
      }
      .session-merge {
        animation: mergePulse 3.6s ease-in-out infinite;
      }
      @keyframes winGlow {
        0%, 100% { fill-opacity: 0.22; stroke-opacity: 0.85; }
        50% { fill-opacity: 0.42; stroke-opacity: 1; }
      }
      @keyframes mergePulse {
        0%, 35%, 100% { stroke-width: 1.5; fill-opacity: 0.25; }
        60%, 80% { stroke-width: 2.4; fill-opacity: 0.48; }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="540" rx="14" fill="#0f172a"/>
  <rect x="12" y="12" width="936" height="516" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="44" class="title">Kafka Streams Windowing Models (Event-Time Axis)</text>
  <text x="32" y="64" class="subtitle">Comparing Tumbling, Hopping, Sliding, and Session windows across identical incoming events (t = 0m to 15m)</text>

  <!-- Shared Event-Time Axis (x: 250 to 910 => 660px for 15 mins => 44px per min) -->
  <!-- Grid Lines -->
  <g transform="translate(250, 86)">
    <line x1="0" y1="16" x2="660" y2="16" stroke="#334155" stroke-width="1.5"/>
    <!-- Ticks: 0m, 3m, 6m, 9m, 12m, 15m -->
    <line x1="0" y1="12" x2="0" y2="418" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="0" y="8" text-anchor="middle" class="axis-lbl">0m</text>

    <line x1="132" y1="12" x2="132" y2="418" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="132" y="8" text-anchor="middle" class="axis-lbl">3m</text>

    <line x1="264" y1="12" x2="264" y2="418" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="264" y="8" text-anchor="middle" class="axis-lbl">6m</text>

    <line x1="396" y1="12" x2="396" y2="418" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="396" y="8" text-anchor="middle" class="axis-lbl">9m</text>

    <line x1="528" y1="12" x2="528" y2="418" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="528" y="8" text-anchor="middle" class="axis-lbl">12m</text>

    <line x1="660" y1="12" x2="660" y2="418" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="660" y="8" text-anchor="middle" class="axis-lbl">15m</text>

    <!-- Event dots on top axis: A@1m(44), B@3m(132), C@9m(396), D@10m(440), E@14m(616) -->
    <circle cx="44" cy="16" r="5" fill="#38bdf8"/>
    <text x="44" y="32" text-anchor="middle" class="mono" fill="#7dd3fc">A(1m)</text>

    <circle cx="132" cy="16" r="5" fill="#38bdf8"/>
    <text x="132" y="32" text-anchor="middle" class="mono" fill="#7dd3fc">B(3m)</text>

    <circle cx="396" cy="16" r="5" fill="#38bdf8"/>
    <text x="396" y="32" text-anchor="middle" class="mono" fill="#7dd3fc">C(9m)</text>

    <circle cx="440" cy="16" r="5" fill="#38bdf8"/>
    <text x="440" y="32" text-anchor="middle" class="mono" fill="#7dd3fc">D(10m)</text>

    <circle cx="616" cy="16" r="5" fill="#38bdf8"/>
    <text x="616" y="32" text-anchor="middle" class="mono" fill="#7dd3fc">E(14m)</text>

    <!-- Animated Event-Time Playhead -->
    <line x1="0" y1="16" x2="0" y2="418" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.55">
      <animate attributeName="x1" values="0;660;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;660;0" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- TRACK 1: Tumbling Window -->
  <g transform="translate(32, 132)">
    <rect width="896" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="30" class="track-title" fill="#34d399">1. Tumbling Window</text>
    <text x="16" y="48" class="track-sub">Fixed 5m, non-overlapping</text>
    <text x="16" y="64" class="mono" fill="#6ee7b7">TimeWindows.ofSize(5m)</text>

    <!-- Windows on x offset 218 (250 - 32): 0-5m(0..220), 5-10m(220..440), 10-15m(440..660) -->
    <g transform="translate(218, 16)">
      <rect x="2" y="6" width="216" height="36" rx="5" fill="#10b981" stroke="#34d399" stroke-width="1.5" class="win-pulse"/>
      <text x="110" y="28" text-anchor="middle" class="win-lbl">[0-5m] : A, B</text>

      <rect x="222" y="6" width="216" height="36" rx="5" fill="#10b981" stroke="#34d399" stroke-width="1.5" class="win-pulse"/>
      <text x="330" y="28" text-anchor="middle" class="win-lbl">[5-10m] : C</text>

      <rect x="442" y="6" width="216" height="36" rx="5" fill="#10b981" stroke="#34d399" stroke-width="1.5" class="win-pulse"/>
      <text x="550" y="28" text-anchor="middle" class="win-lbl">[10-15m] : D, E</text>
    </g>
  </g>

  <!-- TRACK 2: Hopping Window -->
  <g transform="translate(32, 224)">
    <rect width="896" height="92" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="30" class="track-title" fill="#38bdf8">2. Hopping Window</text>
    <text x="16" y="48" class="track-sub">Size 5m, advance 2m</text>
    <text x="16" y="64" class="mono" fill="#7dd3fc">advanceBy(2m) -&gt; overlap</text>

    <g transform="translate(218, 12)">
      <!-- W1: 0-5m (0..220) -->
      <rect x="2" y="4" width="218" height="22" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="110" y="19" text-anchor="middle" class="win-lbl">[0-5m] A, B</text>

      <!-- W2: 2-7m (88..308) -->
      <rect x="88" y="30" width="220" height="22" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="198" y="45" text-anchor="middle" class="win-lbl">[2-7m] B</text>

      <!-- W3: 4-9m (176..396) -->
      <rect x="176" y="56" width="220" height="22" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="286" y="71" text-anchor="middle" class="win-lbl">[4-9m] (empty)</text>

      <!-- W4: 6-11m (264..484) -->
      <rect x="264" y="4" width="220" height="22" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="374" y="19" text-anchor="middle" class="win-lbl">[6-11m] C, D</text>

      <!-- W5: 8-13m (352..572) -->
      <rect x="352" y="30" width="220" height="22" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="462" y="45" text-anchor="middle" class="win-lbl">[8-13m] C, D</text>

      <!-- W6: 10-15m (440..660) -->
      <rect x="440" y="56" width="218" height="22" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.4"/>
      <text x="549" y="71" text-anchor="middle" class="win-lbl">[10-15m] D, E</text>
    </g>
  </g>

  <!-- TRACK 3: Sliding Window -->
  <g transform="translate(32, 328)">
    <rect width="896" height="84" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="30" class="track-title" fill="#a78bfa">3. Sliding Window</text>
    <text x="16" y="48" class="track-sub">Event-driven (5m delta)</text>
    <text x="16" y="64" class="mono" fill="#c4b5fd">SlidingWindows.of(5m)</text>

    <g transform="translate(218, 12)">
      <!-- Around A@1m & B@3m: [0..5m] -->
      <rect x="0" y="6" width="132" height="24" rx="4" fill="#7c3aed" fill-opacity="0.32" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="66" y="22" text-anchor="middle" class="win-lbl">[0-3m] A, B</text>

      <!-- Around C@9m & D@10m: [5-10m] -->
      <rect x="220" y="34" width="220" height="24" rx="4" fill="#7c3aed" fill-opacity="0.32" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="330" y="50" text-anchor="middle" class="win-lbl">[5-10m] C, D</text>

      <!-- Around D@10m & E@14m: [9-14m] -->
      <rect x="396" y="6" width="220" height="24" rx="4" fill="#7c3aed" fill-opacity="0.32" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="506" y="22" text-anchor="middle" class="win-lbl">[9-14m] C, D, E</text>
    </g>
  </g>

  <!-- TRACK 4: Session Window -->
  <g transform="translate(32, 424)">
    <rect width="896" height="84" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="30" class="track-title" fill="#fbbf24">4. Session Window</text>
    <text x="16" y="48" class="track-sub">Inactivity gap = 5m</text>
    <text x="16" y="64" class="mono" fill="#fde68a">SessionWindows.ofGap(5m)</text>

    <g transform="translate(218, 16)">
      <!-- Session 1: A(1m=44) to B(3m=132) -->
      <rect x="36" y="8" width="104" height="36" rx="18" fill="#d97706" stroke="#fbbf24" class="session-merge"/>
      <text x="88" y="30" text-anchor="middle" class="win-lbl">S1 [1-3m] A,B</text>

      <!-- Gap annotation: 3m to 9m = 6m > 5m -->
      <line x1="146" y1="26" x2="386" y2="26" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="266" y="20" text-anchor="middle" class="mono" fill="#fca5a5">gap 6m &gt; 5m (new session)</text>

      <!-- Session 2: C(9m=396), D(10m=440), E(14m=616) merged! -->
      <rect x="390" y="8" width="234" height="36" rx="18" fill="#d97706" stroke="#fbbf24" class="session-merge"/>
      <text x="507" y="30" text-anchor="middle" class="win-lbl">S2 [9-14m] C, D, E (merged)</text>
    </g>
  </g>
</svg>
