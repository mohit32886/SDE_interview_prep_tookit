<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto" role="img" aria-label="Kafka Streams KStream vs KTable with RocksDB State Store and Changelog Failover">
  <defs>
    <style>
      .title { font: 700 20px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 12.5px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .label-bold { font: 700 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #e2e8f0; }
      .label-sm { font: 500 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; }
      .mono-dim { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3b8; }
      .badge { font: 700 10px ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: 0.5px; }

      .dash-flow {
        stroke-dasharray: 6 6;
        animation: dashMove 1.4s linear infinite;
      }
      .dash-repl {
        stroke-dasharray: 5 5;
        animation: dashMove 1.8s linear infinite;
      }
      .pulse-ring {
        animation: pulseGlow 2.4s ease-in-out infinite;
      }
      .upsert-flash {
        animation: flashUpsert 3.6s ease-in-out infinite;
      }

      @keyframes dashMove {
        to { stroke-dashoffset: -24; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes flashUpsert {
        0%, 40%, 100% { fill: #1e293b; stroke: #38bdf8; }
        55%, 75% { fill: #0c4a6e; stroke: #7dd3fc; }
      }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="960" height="520" rx="14" fill="#0f172a"/>
  <rect x="12" y="12" width="936" height="496" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="44" class="title">KStream vs KTable, RocksDB State Store &amp; Changelog Failover</text>
  <text x="32" y="64" class="subtitle">Append-only event stream vs upsertable state backed by embedded RocksDB and compacted Kafka changelog replication</text>

  <!-- Source Topic: orders -->
  <g transform="translate(32, 110)">
    <rect width="175" height="270" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="175" height="34" rx="10" fill="#1e3a5f"/>
    <rect x="0" y="20" width="175" height="14" fill="#1e3a5f"/>
    <text x="87" y="22" text-anchor="middle" class="label-bold" fill="#7dd3fc">Topic: orders</text>
    <text x="87" y="52" text-anchor="middle" class="label-sm">Partition 0 (Event Log)</text>

    <!-- Offsets -->
    <rect x="14" y="68" width="147" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="24" y="86" class="mono-dim">off:0</text>
    <text x="68" y="86" class="mono" fill="#7dd3fc">u1 : $50</text>
    <text x="24" y="102" class="label-sm">Order #1 (user-1)</text>

    <rect x="14" y="124" width="147" height="44" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="24" y="142" class="mono-dim">off:1</text>
    <text x="68" y="142" class="mono" fill="#6ee7b7">u2 : $100</text>
    <text x="24" y="158" class="label-sm">Order #2 (user-2)</text>

    <rect x="14" y="180" width="147" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="24" y="198" class="mono-dim">off:2</text>
    <text x="68" y="198" class="mono" fill="#7dd3fc">u1 : $75</text>
    <text x="24" y="214" class="label-sm">Order #3 (user-1)</text>

    <text x="87" y="252" text-anchor="middle" class="label-sm">Immutable log offsets</text>
  </g>

  <!-- TOP BRANCH: KStream -->
  <g transform="translate(265, 92)">
    <rect width="662" height="122" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="14" y="12" width="110" height="22" rx="4" fill="#064e3b"/>
    <text x="69" y="27" text-anchor="middle" class="badge" fill="#34d399">KSTREAM (STATELESS)</text>
    <text x="136" y="27" class="label-bold">Append-Only Event Processing (Every Record Retained)</text>

    <!-- Emitted events -->
    <rect x="24" y="50" width="136" height="46" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="92" y="69" text-anchor="middle" class="mono" fill="#6ee7b7">u1 : $50</text>
    <text x="92" y="86" text-anchor="middle" class="label-sm">Event 1 emitted</text>

    <rect x="184" y="50" width="136" height="46" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="252" y="69" text-anchor="middle" class="mono" fill="#6ee7b7">u2 : $100</text>
    <text x="252" y="86" text-anchor="middle" class="label-sm">Event 2 emitted</text>

    <rect x="344" y="50" width="136" height="46" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
    <text x="412" y="69" text-anchor="middle" class="mono" fill="#6ee7b7">u1 : $75</text>
    <text x="412" y="86" text-anchor="middle" class="label-sm">Event 3 emitted</text>

    <rect x="504" y="50" width="140" height="46" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
    <text x="574" y="69" text-anchor="middle" class="label-bold" fill="#ecfdf5">3 Events Out</text>
    <text x="574" y="86" text-anchor="middle" class="label-sm" fill="#a7f3d0">No local state store</text>
  </g>

  <!-- Connector: Topic -> KStream -->
  <path d="M 207 165 C 232 165, 238 153, 263 153" fill="none" stroke="#34d399" stroke-width="2" class="dash-flow" marker-end="url(#arrow-emerald)"/>
  <circle r="4.5" fill="#34d399">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 207 165 C 232 165, 238 153, 263 153"/>
  </circle>

  <!-- BOTTOM BRANCH: KTable + RocksDB (Active Task) -->
  <g transform="translate(265, 235)">
    <rect width="340" height="220" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14" y="12" width="138" height="22" rx="4" fill="#0c4a6e"/>
    <text x="83" y="27" text-anchor="middle" class="badge" fill="#7dd3fc">ACTIVE TASK (INSTANCE 1)</text>
    <text x="164" y="27" class="label-bold">KTable + RocksDB</text>

    <!-- LRU Cache -->
    <rect x="16" y="48" width="308" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="28" y="67" class="label-bold" fill="#7dd3fc">In-Memory LRU Cache</text>
    <text x="28" y="83" class="label-sm">Deduplicates hot writes before RocksDB flush</text>
    <rect x="242" y="57" width="70" height="24" rx="4" fill="#0c4a6e"/>
    <text x="277" y="73" text-anchor="middle" class="mono">10 MB</text>

    <!-- Arrow Cache -> RocksDB -->
    <line x1="170" y1="92" x2="170" y2="112" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- RocksDB Local Store -->
    <rect x="16" y="116" width="308" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="28" y="136" class="label-bold">Embedded RocksDB (Local Disk)</text>
    <text x="252" y="136" class="badge" fill="#38bdf8">UPSERT STATE</text>

    <rect x="28" y="148" width="134" height="44" rx="6" class="upsert-flash" stroke-width="1.4"/>
    <text x="95" y="166" text-anchor="middle" class="mono" fill="#7dd3fc">u1 -&gt; $125</text>
    <text x="95" y="183" text-anchor="middle" class="label-sm">Updated ($50 + $75)</text>

    <rect x="176" y="148" width="134" height="44" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="243" y="166" text-anchor="middle" class="mono" fill="#6ee7b7">u2 -&gt; $100</text>
    <text x="243" y="183" text-anchor="middle" class="label-sm">Latest key state</text>
  </g>

  <!-- Connector: Topic -> Active Task -->
  <path d="M 207 300 C 232 300, 238 305, 263 305" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow" marker-end="url(#arrow-blue)"/>
  <circle r="4.5" fill="#38bdf8">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 207 300 C 232 300, 238 305, 263 305"/>
  </circle>

  <!-- Compacted Changelog Topic -->
  <g transform="translate(650, 235)">
    <rect width="277" height="100" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="12" y="10" width="134" height="20" rx="4" fill="#451a03"/>
    <text x="79" y="24" text-anchor="middle" class="badge" fill="#fbbf24">COMPACTED CHANGELOG</text>
    <text x="155" y="24" class="mono-dim">store-changelog</text>

    <rect x="14" y="42" width="118" height="44" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="73" y="61" text-anchor="middle" class="mono" fill="#fde68a">u1 : $125</text>
    <text x="73" y="77" text-anchor="middle" class="label-sm">Compacted key</text>

    <rect x="145" y="42" width="118" height="44" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="204" y="61" text-anchor="middle" class="mono" fill="#fde68a">u2 : $100</text>
    <text x="204" y="77" text-anchor="middle" class="label-sm">Compacted key</text>
  </g>

  <!-- Connector: Active RocksDB -> Changelog -->
  <path d="M 605 285 L 648 285" fill="none" stroke="#fbbf24" stroke-width="2.2" class="dash-repl" marker-end="url(#arrow-amber)"/>
  <circle r="4.5" fill="#fbbf24">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 605 285 L 648 285"/>
  </circle>

  <!-- Standby Task (Instance 2) -->
  <g transform="translate(650, 355)">
    <rect width="277" height="100" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="12" y="10" width="142" height="20" rx="4" fill="#2e1065"/>
    <text x="83" y="24" text-anchor="middle" class="badge" fill="#c4b5fd">STANDBY TASK (INST. 2)</text>

    <circle cx="256" cy="20" r="5" fill="#34d399" class="pulse-ring"/>
    <text x="244" y="24" text-anchor="end" class="badge" fill="#6ee7b7">HOT FAILOVER</text>

    <rect x="14" y="42" width="249" height="44" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="26" y="61" class="label-bold" fill="#ddd6fe">Warm Standby RocksDB</text>
    <text x="26" y="77" class="label-sm">Replays changelog continuously for zero-downtime takeover</text>
  </g>

  <!-- Connector: Changelog -> Standby Task -->
  <path d="M 788 335 L 788 353" fill="none" stroke="#a78bfa" stroke-width="2.2" class="dash-repl" marker-end="url(#arrow-purple)"/>
  <circle r="4" fill="#a78bfa">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M 788 335 L 788 353"/>
  </circle>

  <!-- Footer Legend -->
  <g transform="translate(32, 475)">
    <circle cx="8" cy="10" r="5" fill="#34d399"/>
    <text x="20" y="14" class="label-sm">KStream (every event)</text>

    <circle cx="178" cy="10" r="5" fill="#38bdf8"/>
    <text x="190" y="14" class="label-sm">KTable Upsert -&gt; RocksDB</text>

    <circle cx="378" cy="10" r="5" fill="#fbbf24"/>
    <text x="390" y="14" class="label-sm">Async Changelog Backup</text>

    <circle cx="578" cy="10" r="5" fill="#a78bfa"/>
    <text x="590" y="14" class="label-sm">Standby Replica Warm Sync</text>
  </g>
</svg>
