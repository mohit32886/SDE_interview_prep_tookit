<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Cache Failure Modes and Mitigation Patterns">
  <defs>
    <style>
      .title { font: 700 15px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .card-title { font: 700 12.5px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f1f5f9; }
      .card-sub { font: 400 10.5px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .mono { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pill-text { font: 700 10px ui-sans-serif, system-ui, -apple-system, sans-serif; }
      @keyframes pulseRing {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 1; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      .gate-pulse { animation: pulseRing 2.4s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 6 6; animation: dashFlow 1.2s linear infinite; }
    </style>

    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>

    <!-- Motion paths for each lane -->
    <path id="path-penetration-block" d="M 275 91 L 392 91"/>
    <path id="path-penetration-bounce" d="M 392 91 L 330 70"/>
    <path id="path-breakdown-coalesce" d="M 275 179 L 400 179"/>
    <path id="path-breakdown-single" d="M 600 179 L 685 179"/>
    <path id="path-avalanche-stagger" d="M 275 267 L 400 267"/>
    <path id="path-avalanche-safe" d="M 600 267 L 685 267"/>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="320" rx="14" fill="#0f172a"/>

  <!-- Header -->
  <text x="22" y="30" class="title">Cache Failure Modes &amp; Mitigation Patterns</text>
  <text x="878" y="30" text-anchor="end" class="subtitle">Traffic Spike &#8594; Defense Layer &#8594; Protected Origin DB</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ================= ROW 1: CACHE PENETRATION ================= -->
  <g>
    <rect x="20" y="52" width="860" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <rect x="20" y="52" width="5" height="78" rx="2.5" fill="#f43f5e"/>

    <!-- Problem -->
    <rect x="36" y="62" width="88" height="18" rx="4" fill="#4c0519" stroke="#fb7185" stroke-width="0.8"/>
    <text x="80" y="74.5" text-anchor="middle" class="pill-text" fill="#fda4af">PENETRATION</text>
    <text x="36" y="97" class="card-title">Non-Existent Keys</text>
    <text x="36" y="114" class="card-sub">id=-1 misses cache &amp; hits DB</text>

    <!-- Incoming Flow -->
    <line x1="275" y1="91" x2="394" y2="91" stroke="#fb7185" stroke-width="2" class="flow-line" marker-end="url(#arrow-cyan)"/>
    <text x="332" y="82" text-anchor="middle" class="mono" fill="#fda4af">bad keys</text>

    <!-- Animated bad request dots -->
    <circle r="4" fill="#fb7185">
      <animateMotion dur="1.6s" repeatCount="indefinite">
        <mpath href="#path-penetration-block"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#fda4af">
      <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite">
        <mpath href="#path-penetration-block"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Mitigation Box -->
    <rect x="402" y="63" width="198" height="56" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" class="gate-pulse"/>
    <text x="501" y="83" text-anchor="middle" class="card-title" fill="#38bdf8">Bloom Filter + Null Cache</text>
    <text x="501" y="100" text-anchor="middle" class="mono" fill="#7dd3fc">BF.EXISTS == 0 &#8594; 404</text>
    <text x="501" y="113" text-anchor="middle" class="card-sub">Cache empty value (short TTL)</text>

    <!-- Outcome -->
    <line x1="600" y1="91" x2="682" y2="91" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <text x="641" y="82" text-anchor="middle" class="mono" fill="#6ee7b7">0 DB hits</text>

    <rect x="690" y="65" width="174" height="52" rx="8" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-width="1.2"/>
    <text x="777" y="86" text-anchor="middle" class="card-title" fill="#a7f3d0">Origin DB Protected</text>
    <text x="777" y="104" text-anchor="middle" class="mono" fill="#6ee7b7">99.9% rejected at edge</text>
  </g>

  <!-- ================= ROW 2: CACHE BREAKDOWN (HOT-KEY) ================= -->
  <g>
    <rect x="20" y="140" width="860" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <rect x="20" y="140" width="5" height="78" rx="2.5" fill="#f59e0b"/>

    <!-- Problem -->
    <rect x="36" y="150" width="96" height="18" rx="4" fill="#451a03" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="84" y="162.5" text-anchor="middle" class="pill-text" fill="#fde68a">BREAKDOWN</text>
    <text x="36" y="185" class="card-title">Hot-Key Stampede</text>
    <text x="36" y="202" class="card-sub">10k req/s when hot TTL expires</text>

    <!-- Incoming Flow (3 parallel streams coalescing) -->
    <line x1="275" y1="168" x2="394" y2="177" stroke="#fbbf24" stroke-width="1.5" class="flow-line"/>
    <line x1="275" y1="179" x2="394" y2="179" stroke="#fbbf24" stroke-width="2" class="flow-line" marker-end="url(#arrow-amber)"/>
    <line x1="275" y1="190" x2="394" y2="181" stroke="#fbbf24" stroke-width="1.5" class="flow-line"/>
    <text x="332" y="161" text-anchor="middle" class="mono" fill="#fde68a">10k concurrent</text>

    <circle r="4" fill="#fbbf24">
      <animateMotion dur="1.4s" repeatCount="indefinite">
        <mpath href="#path-breakdown-coalesce"/>
      </animateMotion>
    </circle>
    <circle r="3.5" fill="#fcd34d">
      <animateMotion dur="1.4s" begin="0.45s" repeatCount="indefinite">
        <mpath href="#path-breakdown-coalesce"/>
      </animateMotion>
    </circle>

    <!-- Mitigation Box -->
    <rect x="402" y="151" width="198" height="56" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" class="gate-pulse"/>
    <text x="501" y="171" text-anchor="middle" class="card-title" fill="#fbbf24">Singleflight / Mutex Lock</text>
    <text x="501" y="188" text-anchor="middle" class="mono" fill="#fde68a">SET lock NX PX 3000</text>
    <text x="501" y="201" text-anchor="middle" class="card-sub">1 leader fetches; waiters share</text>

    <!-- Outcome -->
    <line x1="600" y1="179" x2="682" y2="179" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <text x="641" y="170" text-anchor="middle" class="mono" fill="#6ee7b7">1 query</text>
    <circle r="4" fill="#34d399">
      <animateMotion dur="1.8s" repeatCount="indefinite">
        <mpath href="#path-breakdown-single"/>
      </animateMotion>
    </circle>

    <rect x="690" y="153" width="174" height="52" rx="8" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-width="1.2"/>
    <text x="777" y="174" text-anchor="middle" class="card-title" fill="#a7f3d0">1 DB Read &#8594; Shared</text>
    <text x="777" y="192" text-anchor="middle" class="mono" fill="#6ee7b7">9,999 callers served</text>
  </g>

  <!-- ================= ROW 3: CACHE AVALANCHE ================= -->
  <g>
    <rect x="20" y="228" width="860" height="78" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <rect x="20" y="228" width="5" height="78" rx="2.5" fill="#a855f7"/>

    <!-- Problem -->
    <rect x="36" y="238" width="94" height="18" rx="4" fill="#3b0764" stroke="#c084fc" stroke-width="0.8"/>
    <text x="83" y="250.5" text-anchor="middle" class="pill-text" fill="#e9d5ff">AVALANCHE</text>
    <text x="36" y="273" class="card-title">Mass TTL Expiry</text>
    <text x="36" y="290" class="card-sub">Sync expiry or Redis node loss</text>

    <!-- Incoming Flow -->
    <line x1="275" y1="267" x2="394" y2="267" stroke="#c084fc" stroke-width="2" class="flow-line" marker-end="url(#arrow-cyan)"/>
    <text x="332" y="258" text-anchor="middle" class="mono" fill="#e9d5ff">wave miss</text>

    <circle r="4" fill="#c084fc">
      <animateMotion dur="1.7s" repeatCount="indefinite">
        <mpath href="#path-avalanche-stagger"/>
      </animateMotion>
    </circle>

    <!-- Mitigation Box -->
    <rect x="402" y="239" width="198" height="56" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" class="gate-pulse"/>
    <text x="501" y="259" text-anchor="middle" class="card-title" fill="#c084fc">Jittered TTL + Breaker</text>
    <text x="501" y="276" text-anchor="middle" class="mono" fill="#e9d5ff">TTL + rand(0, 300s)</text>
    <text x="501" y="289" text-anchor="middle" class="card-sub">Stagger expiry + degrade fast</text>

    <!-- Outcome -->
    <line x1="600" y1="267" x2="682" y2="267" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
    <text x="641" y="258" text-anchor="middle" class="mono" fill="#6ee7b7">smooth</text>
    <circle r="4" fill="#34d399">
      <animateMotion dur="2.0s" repeatCount="indefinite">
        <mpath href="#path-avalanche-safe"/>
      </animateMotion>
    </circle>

    <rect x="690" y="241" width="174" height="52" rx="8" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-width="1.2"/>
    <text x="777" y="262" text-anchor="middle" class="card-title" fill="#a7f3d0">Flat DB Load</text>
    <text x="777" y="280" text-anchor="middle" class="mono" fill="#6ee7b7">Zero cascading outage</text>
  </g>
</svg>
