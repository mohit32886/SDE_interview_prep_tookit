<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="Low-Latency Stock Trading Order Matching Engine Pipeline">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .card-accent-blue { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.8; rx: 10; }
      .card-accent-emerald { fill: #1e293b; stroke: #10b981; stroke-width: 1.8; rx: 10; }
      .card-accent-amber { fill: #1e293b; stroke: #f59e0b; stroke-width: 1.8; rx: 10; }
      .card-accent-purple { fill: #1e293b; stroke: #a855f7; stroke-width: 1.8; rx: 10; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #cbd5e1; }
      .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #94a3b8; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
      .wire { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 6 4; }
      .wire-active { fill: none; stroke: #38bdf8; stroke-width: 2.2; stroke-dasharray: 6 6; animation: dashFlow 1.4s linear infinite; }
      .wire-emerald { fill: none; stroke: #10b981; stroke-width: 2.2; stroke-dasharray: 6 6; animation: dashFlow 1.4s linear infinite; }
      .wire-purple { fill: none; stroke: #a855f7; stroke-width: 2.2; stroke-dasharray: 6 6; animation: dashFlow 1.4s linear infinite; }

      @keyframes dashFlow {
        to { stroke-dashoffset: -24; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes matchFlash {
        0%, 35%, 100% { fill: #334155; stroke: #475569; }
        50%, 70% { fill: #064e3b; stroke: #10b981; }
      }
      @keyframes ringSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .pulse-node { animation: pulseGlow 2.4s ease-in-out infinite; }
      .match-row { animation: matchFlash 3.6s ease-in-out infinite; }
      .ring-rotor { transform-origin: 495px 258px; animation: ringSpin 6s linear infinite; }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>

    <path id="path-gw-risk" d="M 170 258 L 220 258" />
    <path id="path-risk-ring" d="M 380 258 L 425 258" />
    <path id="path-ring-book" d="M 565 258 L 615 258" />
    <path id="path-book-exec" d="M 885 210 L 930 165" />
    <path id="path-book-md" d="M 885 305 L 930 350" />
  </defs>

  <!-- Background -->
  <rect class="bg" width="1120" height="560" rx="12" />

  <!-- Header -->
  <rect x="20" y="16" width="1080" height="58" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <text x="38" y="42" class="title">Low-Latency Stock Matching Engine Pipeline</text>
  <text x="38" y="61" class="subtitle">Hot Path: Lock-Free LMAX Disruptor Sequencer + Single-Threaded Price-Time Priority Order Book</text>

  <!-- Status Badges -->
  <rect x="742" y="29" width="160" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <text x="822" y="47" text-anchor="middle" class="badge-text" fill="#34d399">p99 &lt; 10ms | 100K/s</text>
  <rect x="914" y="29" width="170" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
  <text x="999" y="47" text-anchor="middle" class="badge-text" fill="#a5b4fc">ZERO-LOCK / PINNED CPU</text>

  <!-- Stage 1: Order Gateway -->
  <rect x="20" y="168" width="150" height="180" class="card-accent-blue" />
  <rect x="20" y="168" width="150" height="30" rx="10" fill="#0c4a6e" />
  <text x="95" y="188" text-anchor="middle" class="card-title">1. Order Gateway</text>
  <text x="32" y="218" class="mono-sm">Protocols:</text>
  <text x="32" y="234" class="mono">FIX / REST / WS</text>
  <rect x="30" y="250" width="130" height="56" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="40" y="268" class="mono-sm" fill="#38bdf8">INCOMING ORDER</text>
  <text x="40" y="284" class="mono" fill="#f8fafc">BUY 150 RELIANCE</text>
  <text x="40" y="299" class="mono" fill="#34d399">@ 2500.80 (LIMIT)</text>
  <text x="95" y="332" text-anchor="middle" class="mono-sm" fill="#38bdf8">~0.5ms parse + auth</text>

  <!-- Stage 2: Pre-Trade Risk Check -->
  <rect x="220" y="158" width="160" height="200" class="card-accent-amber" />
  <rect x="220" y="158" width="160" height="30" rx="10" fill="#78350f" />
  <text x="300" y="178" text-anchor="middle" class="card-title">2. Risk Check</text>
  <text x="234" y="208" class="mono" fill="#fde68a">[OK] Dup (1s window)</text>
  <text x="234" y="230" class="mono" fill="#fde68a">[OK] Cash +10% buf</text>
  <text x="234" y="252" class="mono" fill="#fde68a">[OK] Position Limit</text>
  <text x="234" y="274" class="mono" fill="#fde68a">[OK] +/-20% Band</text>
  <text x="234" y="296" class="mono" fill="#fde68a">[OK] Fat-Finger</text>
  <text x="234" y="318" class="mono" fill="#fde68a">[OK] 150% Margin</text>
  <text x="300" y="344" text-anchor="middle" class="mono-sm" fill="#fbbf24">&lt; 1ms | Fail = Reject</text>

  <!-- Stage 3: Sequencer RingBuffer -->
  <rect x="425" y="158" width="140" height="200" class="card-accent-purple" />
  <rect x="425" y="158" width="140" height="30" rx="10" fill="#4c1d95" />
  <text x="495" y="178" text-anchor="middle" class="card-title">3. Sequencer</text>
  <text x="495" y="203" text-anchor="middle" class="mono-sm" fill="#d8b4fe">LMAX Disruptor</text>

  <!-- Ring Buffer Graphic -->
  <circle cx="495" cy="258" r="42" fill="#0f172a" stroke="#6d28d9" stroke-width="10" />
  <circle cx="495" cy="258" r="42" fill="none" stroke="#c084fc" stroke-width="10" stroke-dasharray="28 236" class="ring-rotor" />
  <circle cx="495" cy="258" r="26" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="495" y="255" text-anchor="middle" class="mono-sm" fill="#f8fafc">RING</text>
  <text x="495" y="268" text-anchor="middle" class="mono-sm" fill="#c084fc">1M slots</text>

  <text x="495" y="324" text-anchor="middle" class="mono-sm" fill="#e9d5ff">Pre-allocated array</text>
  <text x="495" y="342" text-anchor="middle" class="mono-sm" fill="#c084fc">Wait-free | Zero GC</text>

  <!-- Stage 4: In-Memory Order Book -->
  <rect x="615" y="106" width="270" height="304" class="card-accent-emerald" />
  <rect x="615" y="106" width="270" height="32" rx="10" fill="#064e3b" />
  <text x="750" y="127" text-anchor="middle" class="card-title">4. In-Memory Order Book (RELIANCE)</text>

  <!-- ASKS Header -->
  <text x="630" y="156" class="badge-text" fill="#fb7185">ASKS (TreeMap ASC - Sellers)</text>
  <rect x="628" y="164" width="244" height="24" rx="4" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="636" y="180" class="mono" fill="#fda4af">2500.90 | 200 sh | O-103 (10:30:47)</text>

  <rect x="628" y="192" width="244" height="24" rx="4" class="match-row" stroke-width="1.2" />
  <text x="636" y="208" class="mono" fill="#fecdd3">2500.80 | 200 sh | O-102 (10:30:46)</text>

  <rect x="628" y="220" width="244" height="24" rx="4" class="match-row" stroke-width="1.2" />
  <text x="636" y="236" class="mono" fill="#f8fafc">2500.80 | 100 sh | O-101 (FIFO #1)</text>

  <!-- Spread Bar -->
  <rect x="628" y="252" width="244" height="24" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="750" y="268" text-anchor="middle" class="mono" fill="#34d399">MATCH: 150 @ 2500.80 (FIFO)</text>

  <!-- BIDS Header -->
  <text x="630" y="295" class="badge-text" fill="#34d399">BIDS (TreeMap DESC - Buyers)</text>
  <rect x="628" y="303" width="244" height="24" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1" />
  <text x="636" y="319" class="mono" fill="#6ee7b7">2500.45 | 100 sh | O-105 (Best Bid)</text>

  <rect x="628" y="331" width="244" height="24" rx="4" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="636" y="347" class="mono" fill="#a7f3d0">2500.30 | 400 sh | O-106 (10:31:14)</text>

  <text x="750" y="380" text-anchor="middle" class="mono-sm" fill="#94a3b8">Single-threaded per symbol</text>
  <text x="750" y="396" text-anchor="middle" class="mono-sm" fill="#34d399">O(log P) lookup + O(1) FIFO queue</text>

  <!-- Stage 5A: Execution Fill & WAL -->
  <rect x="930" y="106" width="170" height="132" class="card-accent-emerald" />
  <rect x="930" y="106" width="170" height="28" rx="10" fill="#064e3b" />
  <text x="1015" y="125" text-anchor="middle" class="card-title">5a. Execution Fill</text>
  <text x="942" y="152" class="mono" fill="#34d399">Status: FILLED</text>
  <text x="942" y="170" class="mono-sm">100 sh vs O-101</text>
  <text x="942" y="186" class="mono-sm"> 50 sh vs O-102</text>
  <text x="942" y="206" class="mono-sm" fill="#cbd5e1">-&gt; mmap WAL + Kafka</text>
  <text x="942" y="222" class="mono-sm" fill="#94a3b8">-&gt; T+1 Settlement</text>

  <!-- Stage 5B: Market Data Broadcast -->
  <rect x="930" y="278" width="170" height="132" class="card-accent-blue" />
  <rect x="930" y="278" width="170" height="28" rx="10" fill="#0c4a6e" />
  <text x="1015" y="297" text-anchor="middle" class="card-title">5b. Market Data</text>
  <text x="942" y="324" class="mono" fill="#38bdf8">Tick: 2500.80</text>
  <text x="942" y="342" class="mono-sm">L1/L2 Book Depth</text>
  <text x="942" y="358" class="mono-sm">OHLCV 1m/5m/1h</text>
  <text x="942" y="378" class="mono-sm" fill="#cbd5e1">-&gt; WebSocket Fan-out</text>
  <text x="942" y="394" class="mono-sm" fill="#94a3b8">&lt; 1ms per tick</text>

  <!-- Animated Connections -->
  <use href="#path-gw-risk" class="wire-active" marker-end="url(#arrow-blue)" />
  <use href="#path-risk-ring" class="wire-active" marker-end="url(#arrow-blue)" />
  <use href="#path-ring-book" class="wire-purple" marker-end="url(#arrow-purple)" />
  <use href="#path-book-exec" class="wire-emerald" marker-end="url(#arrow-emerald)" />
  <use href="#path-book-md" class="wire-active" marker-end="url(#arrow-blue)" />

  <!-- Moving Packets (SMIL animateMotion) -->
  <circle r="4.5" fill="#38bdf8">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 170 258 L 220 258" />
  </circle>
  <circle r="4.5" fill="#fbbf24">
    <animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M 380 258 L 425 258" />
  </circle>
  <circle r="4.5" fill="#c084fc">
    <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M 565 258 L 615 258" />
  </circle>
  <circle r="4.5" fill="#34d399">
    <animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite" path="M 885 210 L 930 165" />
  </circle>
  <circle r="4.5" fill="#38bdf8">
    <animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite" path="M 885 305 L 930 350" />
  </circle>

  <!-- Bottom Legend / Telemetry Strip -->
  <rect x="20" y="434" width="1080" height="108" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <text x="40" y="460" class="card-title" fill="#f8fafc">Key Architectural Guarantees (Hot Path vs Cold Path)</text>

  <rect x="40" y="474" width="245" height="52" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="52" y="494" class="mono" fill="#38bdf8">1. Symbol Partitioning</text>
  <text x="52" y="512" class="mono-sm">1 dedicated thread per symbol</text>

  <rect x="305" y="474" width="245" height="52" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="317" y="494" class="mono" fill="#c084fc">2. Mechanical Sympathy</text>
  <text x="317" y="512" class="mono-sm">L1 cache warm (4ns), zero locks</text>

  <rect x="570" y="474" width="245" height="52" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="582" y="494" class="mono" fill="#34d399">3. Deterministic Replay</text>
  <text x="582" y="512" class="mono-sm">mmap WAL + warm standby (&lt;1s)</text>

  <rect x="835" y="474" width="245" height="52" rx="6" fill="#0f172a" stroke="#334155" />
  <text x="847" y="494" class="mono" fill="#fbbf24">4. Async Cold Path</text>
  <text x="847" y="512" class="mono-sm">Kafka -&gt; Settlement (T+1), OHLCV</text>
</svg>
