<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Module 07 System Design Fundamentals 4-Pillar Mastery Banner">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="track-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="33%" stop-color="#34d399" />
      <stop offset="66%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="grid-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <path id="pipeline-path" d="M 140 205 L 365 205 L 595 205 L 820 205" />

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -36; }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.95; }
      }

      .card-float-odd { animation: floatCard1 5s ease-in-out infinite; }
      .card-float-even { animation: floatCard2 5s ease-in-out 2.5s infinite; }
      .flow-line {
        stroke-dasharray: 10 8;
        animation: dashFlow 1.4s linear infinite;
      }
      .badge-pulse { animation: pulseRing 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Dark-Slate Card -->
  <rect x="0" y="0" width="960" height="360" rx="18" fill="url(#bg-grad)" />
  <rect x="0" y="0" width="960" height="360" rx="18" fill="url(#grid-pattern)" />
  <rect x="1" y="1" width="958" height="358" rx="17" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Ambient Accent Orbs -->
  <circle cx="150" cy="70" r="110" fill="#38bdf8" fill-opacity="0.06" />
  <circle cx="820" cy="290" r="130" fill="#c084fc" fill-opacity="0.06" />

  <!-- Top Header -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="276" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#38bdf8" class="badge-pulse" />
    <text x="26" y="16" class="font-mono" font-size="11" font-weight="600" fill="#7dd3fc" letter-spacing="0.8">MODULE 07 • HLD MASTERY</text>

    <rect x="742" y="0" width="138" height="24" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="811" y="16" text-anchor="middle" class="font-mono" font-size="11" fill="#94a3b8">17 GUIDES • 27.5K LOC</text>
  </g>

  <text x="40" y="88" class="font-sans" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="-0.4">System Design Fundamentals</text>
  <text x="40" y="112" class="font-sans" font-size="14" fill="#94a3b8">From core scalability primitives and 5-step HLD interviews to 10 production-grade architecture case studies</text>

  <!-- Connecting Pipeline Track Behind Cards -->
  <line x1="140" y1="205" x2="820" y2="205" stroke="#334155" stroke-width="4" stroke-linecap="round" />
  <line x1="140" y1="205" x2="820" y2="205" stroke="url(#track-grad)" stroke-width="2.5" class="flow-line" />

  <!-- Animated Data Packets on Pipeline -->
  <circle r="5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="4.5s" repeatCount="indefinite">
      <mpath href="#pipeline-path" />
    </animateMotion>
  </circle>
  <circle r="4" fill="#c084fc" filter="url(#glow)">
    <animateMotion dur="4.5s" begin="2.25s" repeatCount="indefinite">
      <mpath href="#pipeline-path" />
    </animateMotion>
  </circle>

  <!-- Pillar 1: 01-03 Foundations & Scale -->
  <g class="card-float-odd">
    <rect x="40" y="138" width="202" height="134" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.5" />
    <rect x="40" y="138" width="202" height="4" rx="2" fill="#38bdf8" />
    <rect x="54" y="152" width="52" height="20" rx="6" fill="#0ea5e9" fill-opacity="0.18" />
    <text x="80" y="166" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#38bdf8">01–03</text>
    <text x="116" y="166" class="font-mono" font-size="10.5" fill="#64748b">PILLAR 1</text>

    <text x="54" y="194" class="font-sans" font-size="14.5" font-weight="700" fill="#f1f5f9">Foundations &amp; Scale</text>
    <text x="54" y="216" class="font-sans" font-size="11.5" fill="#94a3b8">• CAP, SLAs &amp; QPS Math</text>
    <text x="54" y="234" class="font-sans" font-size="11.5" fill="#94a3b8">• CDN, Cache, Queues, LB</text>
    <text x="54" y="252" class="font-sans" font-size="11.5" fill="#94a3b8">• Sharding, WAL &amp; Raft</text>
  </g>

  <!-- Connector Node 1->2 -->
  <circle cx="254" cy="205" r="5" fill="#0f172a" stroke="#34d399" stroke-width="2">
    <animate attributeName="r" values="4.5;6;4.5" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Pillar 2: 04-05 Classic & Advanced HLD -->
  <g class="card-float-even">
    <rect x="266" y="138" width="202" height="134" rx="12" fill="url(#card-grad)" stroke="#34d399" stroke-opacity="0.65" stroke-width="1.5" />
    <rect x="266" y="138" width="202" height="4" rx="2" fill="#34d399" />
    <rect x="280" y="152" width="52" height="20" rx="6" fill="#10b981" fill-opacity="0.18" />
    <text x="306" y="166" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#34d399">04–05</text>
    <text x="342" y="166" class="font-mono" font-size="10.5" fill="#64748b">PILLAR 2</text>

    <text x="280" y="194" class="font-sans" font-size="14.5" font-weight="700" fill="#f1f5f9">Classic &amp; Adv. HLD</text>
    <text x="280" y="216" class="font-sans" font-size="11.5" fill="#94a3b8">• TinyURL, KV &amp; Snowflake</text>
    <text x="280" y="234" class="font-sans" font-size="11.5" fill="#94a3b8">• X Feed &amp; YouTube Stream</text>
    <text x="280" y="252" class="font-sans" font-size="11.5" fill="#94a3b8">• WhatsApp &amp; Web Search</text>
  </g>

  <!-- Connector Node 2->3 -->
  <circle cx="480" cy="205" r="5" fill="#0f172a" stroke="#fbbf24" stroke-width="2">
    <animate attributeName="r" values="4.5;6;4.5" dur="2s" begin="0.6s" repeatCount="indefinite" />
  </circle>

  <!-- Pillar 3: 06-07 Infra & Cheatsheet -->
  <g class="card-float-odd">
    <rect x="492" y="138" width="202" height="134" rx="12" fill="url(#card-grad)" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1.5" />
    <rect x="492" y="138" width="202" height="4" rx="2" fill="#fbbf24" />
    <rect x="506" y="152" width="52" height="20" rx="6" fill="#f59e0b" fill-opacity="0.18" />
    <text x="532" y="166" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#fbbf24">06–07</text>
    <text x="568" y="166" class="font-mono" font-size="10.5" fill="#64748b">PILLAR 3</text>

    <text x="506" y="194" class="font-sans" font-size="14.5" font-weight="700" fill="#f1f5f9">Infra &amp; Cheatsheet</text>
    <text x="506" y="216" class="font-sans" font-size="11.5" fill="#94a3b8">• Alerts, Logs &amp; Task Sched</text>
    <text x="506" y="234" class="font-sans" font-size="11.5" fill="#94a3b8">• Blue-Green &amp; Canary CI</text>
    <text x="506" y="252" class="font-sans" font-size="11.5" fill="#94a3b8">• 5-Step Loop &amp; Red Flags</text>
  </g>

  <!-- Connector Node 3->4 -->
  <circle cx="706" cy="205" r="5" fill="#0f172a" stroke="#c084fc" stroke-width="2">
    <animate attributeName="r" values="4.5;6;4.5" dur="2s" begin="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Pillar 4: 08-17 10 Production Case Studies -->
  <g class="card-float-even">
    <rect x="718" y="138" width="202" height="134" rx="12" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.65" stroke-width="1.5" />
    <rect x="718" y="138" width="202" height="4" rx="2" fill="#c084fc" />
    <rect x="732" y="152" width="52" height="20" rx="6" fill="#a855f7" fill-opacity="0.18" />
    <text x="758" y="166" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#c084fc">08–17</text>
    <text x="794" y="166" class="font-mono" font-size="10.5" fill="#64748b">PILLAR 4</text>

    <text x="732" y="194" class="font-sans" font-size="14.5" font-weight="700" fill="#f1f5f9">10 Case Studies</text>
    <text x="732" y="216" class="font-sans" font-size="11.5" fill="#94a3b8">• Payments, OMS &amp; Fraud</text>
    <text x="732" y="234" class="font-sans" font-size="11.5" fill="#94a3b8">• Flash Sale, Locks &amp; Seats</text>
    <text x="732" y="252" class="font-sans" font-size="11.5" fill="#94a3b8">• Trading, Uber &amp; Rank</text>
  </g>

  <!-- Bottom Telemetry Bar -->
  <g transform="translate(40, 294)">
    <rect x="0" y="0" width="880" height="40" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="20" r="4.5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="24" class="font-mono" font-size="11.5" fill="#e2e8f0">INTERVIEW LOOP: 45–60 MIN</text>

    <line x1="230" y1="10" x2="230" y2="30" stroke="#334155" stroke-width="1" />
    <text x="248" y="24" class="font-mono" font-size="11.5" fill="#94a3b8">FRAMEWORK: 5-STEP HLD</text>

    <line x1="436" y1="10" x2="436" y2="30" stroke="#334155" stroke-width="1" />
    <text x="454" y="24" class="font-mono" font-size="11.5" fill="#94a3b8">TARGET: 99.99% (52m/yr)</text>

    <line x1="654" y1="10" x2="654" y2="30" stroke="#334155" stroke-width="1" />
    <text x="672" y="24" class="font-mono" font-size="11.5" fill="#7dd3fc">BARCLAYS → FAANG READY</text>
  </g>
</svg>
