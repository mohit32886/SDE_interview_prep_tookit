<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Idempotent Payment Processing and Double-Entry Ledger Flow">
  <defs>
    <style>
      .title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
      .lane-title { font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.4px; }
      .box-title { font: 700 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f1f5f9; }
      .box-sub { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #cbd5e1; }
      .badge-text { font: 700 10.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .mono-sm { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      .dash-flow {
        stroke-dasharray: 6 6;
        animation: dashMove 1.4s linear infinite;
      }
      .dash-flow-slow {
        stroke-dasharray: 6 6;
        animation: dashMove 2s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -24; }
      }

      .pulse-amber {
        animation: pulseAmber 2.4s ease-in-out infinite;
      }
      @keyframes pulseAmber {
        0%, 100% { stroke-opacity: 0.55; }
        50% { stroke-opacity: 1; }
      }

      .pulse-green {
        animation: pulseGreen 2.8s ease-in-out infinite;
      }
      @keyframes pulseGreen {
        0%, 100% { stroke-opacity: 0.55; }
        50% { stroke-opacity: 1; }
      }
    </style>

    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#0f172a" />
  <rect x="1" y="1" width="958" height="538" rx="13" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <rect x="20" y="18" width="920" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="38" y="41" class="title">Idempotent Payment Processing &amp; Double-Entry Ledger</text>
  <text x="38" y="59" class="subtitle">Network retries return cached responses without double-charging; fresh payments commit balanced Debit/Credit + Outbox atomically</text>
  <rect x="772" y="30" width="152" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="848" y="47" text-anchor="middle" class="badge-text" fill="#6ee7b7">EXACTLY-ONCE CHARGE</text>

  <!-- LANE 1: RETRY PATH -->
  <rect x="20" y="84" width="920" height="152" rx="12" fill="#1e293b" fill-opacity="0.55" stroke="#334155" stroke-width="1" />
  <text x="36" y="106" class="lane-title" fill="#fbbf24">PATH A: CLIENT RETRY (IDEMPOTENCY CACHE / LOCK HIT)</text>

  <!-- Retry Node 1: Client Retry -->
  <rect x="36" y="120" width="205" height="82" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" class="pulse-amber" />
  <text x="50" y="142" class="box-title">1. Client Retry Request</text>
  <text x="50" y="160" class="box-sub">POST /v1/payments</text>
  <text x="50" y="176" class="box-sub" fill="#fcd34d">Idempotency-Key: pay_abc123</text>
  <text x="50" y="192" class="mono-sm" fill="#94a3b8">(Timeout retry #2)</text>

  <!-- Arrow 1 -> 2 -->
  <path id="retry-p1" d="M 241 161 L 304 161" fill="none" stroke="#f59e0b" stroke-width="2" class="dash-flow" marker-end="url(#arrow-amber)" />

  <!-- Retry Node 2: Redis Lookup -->
  <rect x="310" y="120" width="245" height="82" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="324" y="142" class="box-title">2. Redis Idempotency Check</text>
  <text x="324" y="160" class="box-sub">GET idempotency:pay_abc123</text>
  <rect x="324" y="170" width="110" height="20" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
  <text x="379" y="184" text-anchor="middle" class="badge-text" fill="#fde68a">CACHE HIT (24h)</text>
  <text x="444" y="184" class="mono-sm" fill="#94a3b8">or 409 Lock</text>

  <!-- Arrow 2 -> 3 (Skipped) -->
  <path d="M 555 161 L 618 161" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-slate)" />

  <!-- Retry Node 3: Short-Circuit -->
  <rect x="624" y="120" width="298" height="82" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3" />
  <text x="638" y="142" class="box-title" fill="#cbd5e1">3. Gateway &amp; Ledger Bypassed</text>
  <text x="638" y="160" class="box-sub" fill="#94a3b8">Return cached 200 OK immediately</text>
  <text x="638" y="176" class="box-sub" fill="#6ee7b7">0 Visa calls | 0 new ledger rows</text>
  <text x="638" y="192" class="mono-sm" fill="#fbbf24">Zero double-charge guaranteed</text>

  <!-- Return arc from Node 2 back to Node 1 -->
  <path id="retry-return" d="M 432 202 L 432 222 L 138 222 L 138 206" fill="none" stroke="#f59e0b" stroke-width="1.8" class="dash-flow" marker-end="url(#arrow-amber)" />
  <rect x="218" y="211" width="136" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
  <text x="286" y="224" text-anchor="middle" class="mono-sm" fill="#fde68a">Cached 200 OK</text>

  <!-- Animated packet on Retry Path -->
  <circle r="4.5" fill="#fbbf24">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 241 161 L 310 161 L 432 161 L 432 222 L 138 222 L 138 202" />
  </circle>

  <!-- LANE 2: FRESH PAYMENT PATH -->
  <rect x="20" y="250" width="920" height="272" rx="12" fill="#1e293b" fill-opacity="0.55" stroke="#334155" stroke-width="1" />
  <text x="36" y="272" class="lane-title" fill="#34d399">PATH B: FRESH PAYMENT (LOCK ACQUIRED -&gt; ATOMIC LEDGER + OUTBOX)</text>

  <!-- Fresh Node 1: Client Request -->
  <rect x="36" y="290" width="175" height="96" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="48" y="312" class="box-title">1. Fresh Request</text>
  <text x="48" y="330" class="box-sub">POST /v1/payments</text>
  <text x="48" y="346" class="box-sub" fill="#7dd3fc">Key: pay_xyz789</text>
  <text x="48" y="362" class="box-sub">Amount: $50.00</text>
  <text x="48" y="378" class="mono-sm" fill="#94a3b8">Cache miss</text>

  <!-- Arrow F1 -> F2 -->
  <path d="M 211 338 L 246 338" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow" marker-end="url(#arrow-sky)" />

  <!-- Fresh Node 2: Redis Lock + Gateway -->
  <rect x="252" y="290" width="205" height="96" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="264" y="312" class="box-title">2. Lock &amp; Gateway</text>
  <text x="264" y="330" class="box-sub">SET NX lock (30s TTL)</text>
  <text x="264" y="346" class="box-sub" fill="#6ee7b7">Lock Acquired</text>
  <text x="264" y="362" class="box-sub">Visa Auth + Capture</text>
  <text x="264" y="378" class="mono-sm" fill="#94a3b8">auth_id: ch_991</text>

  <!-- Arrow F2 -> F3 -->
  <path d="M 457 338 L 492 338" fill="none" stroke="#10b981" stroke-width="2" class="dash-flow" marker-end="url(#arrow-emerald)" />

  <!-- Fresh Node 3: PostgreSQL Atomic Transaction -->
  <rect x="498" y="284" width="256" height="222" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" class="pulse-green" />
  <text x="514" y="306" class="box-title" fill="#6ee7b7">3. PostgreSQL @Transactional</text>

  <!-- Debit row -->
  <rect x="512" y="318" width="228" height="44" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
  <text x="522" y="336" class="badge-text" fill="#fda4af">DEBIT  | cust_789</text>
  <text x="522" y="352" class="box-sub" fill="#fecdd3">-$50.00  (tx_ref: tx_01)</text>

  <!-- Credit row -->
  <rect x="512" y="370" width="228" height="44" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
  <text x="522" y="388" class="badge-text" fill="#6ee7b7">CREDIT | merch_01</text>
  <text x="522" y="404" class="box-sub" fill="#a7f3d0">+$50.00  (tx_ref: tx_01)</text>

  <!-- Outbox row -->
  <rect x="512" y="422" width="228" height="44" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="522" y="440" class="badge-text" fill="#7dd3fc">OUTBOX | PaymentCaptured</text>
  <text x="522" y="456" class="box-sub">published = false</text>

  <!-- Balanced pill -->
  <rect x="534" y="475" width="184" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="626" y="490" text-anchor="middle" class="badge-text" fill="#6ee7b7">SUM(DEBIT) == SUM(CREDIT)</text>

  <!-- Arrow F3 -> F4 (Outbox -> Kafka) -->
  <path d="M 754 444 L 788 444" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow-slow" marker-end="url(#arrow-sky)" />

  <!-- Fresh Node 4A: Kafka -->
  <rect x="794" y="396" width="130" height="106" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="806" y="418" class="box-title">4. Outbox Poller</text>
  <text x="806" y="436" class="box-sub">Every 100ms</text>
  <text x="806" y="454" class="box-sub" fill="#7dd3fc">-&gt; Kafka Topic</text>
  <text x="806" y="472" class="mono-sm" fill="#94a3b8">payment-events</text>
  <text x="806" y="489" class="mono-sm" fill="#6ee7b7">At-least-once</text>

  <!-- Fresh Node 4B: Redis Save -->
  <rect x="794" y="290" width="130" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="806" y="312" class="box-title">5. Cache Save</text>
  <text x="806" y="330" class="box-sub">SET pay_xyz789</text>
  <text x="806" y="346" class="box-sub" fill="#6ee7b7">TTL: 24 hours</text>
  <text x="806" y="364" class="mono-sm" fill="#94a3b8">Unlock Redis</text>

  <!-- Arrow F3 -> F4B -->
  <path d="M 754 335 L 788 335" fill="none" stroke="#10b981" stroke-width="2" class="dash-flow" marker-end="url(#arrow-emerald)" />

  <!-- Animated packet on Fresh Path -->
  <circle r="4.5" fill="#34d399">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M 211 338 L 498 338 L 626 338 L 626 444 L 794 444" />
  </circle>
  <circle r="4" fill="#38bdf8">
    <animateMotion dur="3.4s" begin="1.2s" repeatCount="indefinite" path="M 457 338 L 754 335 L 794 335" />
  </circle>

  <!-- Bottom Left Callout -->
  <rect x="36" y="404" width="421" height="102" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="50" y="426" class="box-title" fill="#e2e8f0">Why Both Redis + PostgreSQL?</text>
  <text x="50" y="446" class="mono-sm" fill="#cbd5e1">- Redis SET NX stops concurrent duplicate clicks in &lt;2ms</text>
  <text x="50" y="464" class="mono-sm" fill="#cbd5e1">- DB UNIQUE(idempotency_key) prevents race if Redis evicts</text>
  <text x="50" y="482" class="mono-sm" fill="#cbd5e1">- Single @Transactional commits Ledger + Outbox together</text>
  <text x="50" y="498" class="mono-sm" fill="#6ee7b7">- Result: No lost money, no ghost events, no double charges</text>
</svg>
