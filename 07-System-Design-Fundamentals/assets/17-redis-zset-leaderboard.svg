<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="auto" role="img" aria-labelledby="title desc">
  <title id="title">Redis Sorted Set (ZSET) Skip List Re-Ranking Animation</title>
  <desc id="desc">Animated diagram showing ZINCRBY updating a player score, O(log N) skip-list traversal and re-ranking, ZREVRANGE 0 9 serving Top-10, and ZREVRANK returning the player's live rank.</desc>

  <style>
    .bg-root { fill: #0f172a; }
    .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .panel-inner { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 6; }
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 19px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #94a3b8; }
    .sec-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; fill: #e2e8f0; letter-spacing: 0.4px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; fill: #cbd5e1; }
    .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #94a3b8; }
    .label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 700; }

    .node-box { fill: #1e293b; stroke: #475569; stroke-width: 1.5; rx: 6; }
    .node-head { fill: #0f172a; stroke: #64748b; stroke-width: 1.5; rx: 6; }
    .node-active { fill: #172554; stroke: #38bdf8; stroke-width: 2; rx: 6; }
    .node-promoted { fill: #064e3b; stroke: #34d399; stroke-width: 2; rx: 6; }

    .link-line { stroke: #475569; stroke-width: 1.5; fill: none; }
    .span-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #64748b; }

    .traverse-path {
      stroke: #38bdf8;
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 8 6;
      stroke-linecap: round;
      animation: dashFlow 8s linear infinite, pathPulse 8s ease-in-out infinite;
    }

    .zincrby-glow {
      animation: cmdGlow 8s ease-in-out infinite;
    }

    .player-move {
      animation: promoteNode 8s ease-in-out infinite;
    }

    .rank-badge-pop {
      animation: badgePop 8s ease-in-out infinite;
    }

    .phase-1 { animation: p1 8s infinite; }
    .phase-2 { animation: p2 8s infinite; }
    .phase-3 { animation: p3 8s infinite; }
    .phase-4 { animation: p4 8s infinite; }

    @keyframes dashFlow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pathPulse {
      0%, 15% { opacity: 0.15; }
      25%, 55% { opacity: 1; }
      70%, 100% { opacity: 0.25; }
    }

    @keyframes cmdGlow {
      0%, 100% { stroke: #334155; }
      10%, 30% { stroke: #f59e0b; }
      35%, 95% { stroke: #334155; }
    }

    @keyframes promoteNode {
      0%, 35% { transform: translate(0px, 0px); }
      55%, 88% { transform: translate(0px, -68px); }
      96%, 100% { transform: translate(0px, 0px); }
    }

    @keyframes badgePop {
      0%, 50% { opacity: 0.25; }
      60%, 88% { opacity: 1; }
      95%, 100% { opacity: 0.25; }
    }

    @keyframes p1 {
      0%, 24% { fill: #f59e0b; opacity: 1; }
      25%, 100% { fill: #64748b; opacity: 0.45; }
    }
    @keyframes p2 {
      0%, 24% { fill: #64748b; opacity: 0.45; }
      25%, 49% { fill: #38bdf8; opacity: 1; }
      50%, 100% { fill: #64748b; opacity: 0.45; }
    }
    @keyframes p3 {
      0%, 49% { fill: #64748b; opacity: 0.45; }
      50%, 74% { fill: #34d399; opacity: 1; }
      75%, 100% { fill: #64748b; opacity: 0.45; }
    }
    @keyframes p4 {
      0%, 74% { fill: #64748b; opacity: 0.45; }
      75%, 99% { fill: #a78bfa; opacity: 1; }
      100% { fill: #64748b; opacity: 0.45; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Root Background -->
  <rect class="bg-root" x="0" y="0" width="960" height="540" rx="14" />

  <!-- Header -->
  <text class="title" x="28" y="38">Redis Sorted Set (ZSET): Skip List + Hash Table Engine</text>
  <text class="subtitle" x="28" y="58">ZINCRBY (+650)  →  O(log N) Skip-List Re-Rank  →  ZREVRANGE 0 9 &amp; ZREVRANK</text>

  <!-- Top-Left: ZINCRBY + Hash Table -->
  <rect class="panel zincrby-glow" x="24" y="76" width="278" height="144" />
  <text class="sec-title" x="40" y="100">1. WRITE: ZINCRBY + HASH TABLE</text>
  <rect class="panel-inner" x="38" y="112" width="250" height="44" />
  <text class="mono" x="48" y="131" fill="#fbbf24">ZINCRBY leaderboard:all 650</text>
  <text class="mono-sm" x="48" y="147" fill="#38bdf8">"player_42"  (4,800 → 5,450)</text>

  <rect class="panel-inner" x="38" y="164" width="250" height="44" />
  <text class="mono-sm" x="48" y="182" fill="#94a3b8">Dict Hash Table  O(1) Lookup:</text>
  <text class="mono" x="48" y="198" fill="#34d399">dict["player_42"] = 5450</text>

  <!-- Bottom-Left: Complexity & Memory Notes -->
  <rect class="panel" x="24" y="234" width="278" height="236" />
  <text class="sec-title" x="40" y="258">ZSET INTERNAL GUARANTEES</text>
  <rect class="panel-inner" x="38" y="270" width="250" height="48" />
  <text class="mono" x="48" y="290" fill="#38bdf8">Skip List Search / Update</text>
  <text class="mono-sm" x="48" y="307">O(log N) avg (~20 hops for 1M)</text>

  <rect class="panel-inner" x="38" y="326" width="250" height="48" />
  <text class="mono" x="48" y="346" fill="#34d399">ZREVRANK via Span Sums</text>
  <text class="mono-sm" x="48" y="363">O(log N) — sums node.span values</text>

  <rect class="panel-inner" x="38" y="382" width="250" height="74" />
  <text class="mono" x="48" y="402" fill="#a78bfa">ZREVRANGE 0 9 WITHSCORES</text>
  <text class="mono-sm" x="48" y="419">O(log N + K) — linear L0 walk</text>
  <text class="mono-sm" x="48" y="436">No tree rotations; cache-friendly</text>

  <!-- Center Panel: Skip List Multi-Level Structure -->
  <rect class="panel" x="318" y="76" width="368" height="394" />
  <text class="sec-title" x="334" y="100">2. SKIP LIST (O(log N) RE-RANKING)</text>

  <!-- Level labels -->
  <text class="mono-sm" x="332" y="140">L3</text>
  <text class="mono-sm" x="332" y="195">L2</text>
  <text class="mono-sm" x="332" y="250">L1</text>
  <text class="mono-sm" x="332" y="305">L0</text>

  <!-- Header Column -->
  <rect class="node-head" x="354" y="120" width="44" height="200" />
  <text class="mono-sm" x="361" y="140">HEAD</text>
  <text class="mono-sm" x="361" y="195">HEAD</text>
  <text class="mono-sm" x="361" y="250">HEAD</text>
  <text class="mono-sm" x="361" y="305">HEAD</text>

  <!-- Static Skip List Nodes (Descending Score Order) -->
  <!-- Node 1: u_101 (5800) -->
  <rect class="node-box" x="416" y="120" width="76" height="200" />
  <text class="mono" x="424" y="139" fill="#f8fafc">u_101</text>
  <text class="mono-sm" x="424" y="154" fill="#fbbf24">5,800</text>
  <text class="span-text" x="424" y="310">Rank #1</text>

  <!-- Node 2: u_204 (5200) -->
  <rect class="node-box" x="508" y="175" width="76" height="145" />
  <text class="mono" x="516" y="194" fill="#f8fafc">u_204</text>
  <text class="mono-sm" x="516" y="209" fill="#94a3b8">5,200</text>
  <text class="span-text" x="516" y="310">Rank #3</text>

  <!-- Node 3: u_309 (4950) -->
  <rect class="node-box" x="600" y="230" width="72" height="90" />
  <text class="mono" x="608" y="249" fill="#f8fafc">u_309</text>
  <text class="mono-sm" x="608" y="264" fill="#94a3b8">4,950</text>
  <text class="span-text" x="608" y="310">Rank #4</text>

  <!-- Skip List Pointers -->
  <!-- L3 -->
  <line class="link-line" x1="398" y1="135" x2="414" y2="135" marker-end="url(#arrow)" />
  <text class="span-text" x="400" y="129">1</text>
  <!-- L2 -->
  <line class="link-line" x1="398" y1="190" x2="414" y2="190" marker-end="url(#arrow)" />
  <line class="link-line" x1="492" y1="190" x2="506" y2="190" marker-end="url(#arrow)" />
  <text class="span-text" x="494" y="184">2</text>
  <!-- L1 -->
  <line class="link-line" x1="398" y1="245" x2="414" y2="245" marker-end="url(#arrow)" />
  <line class="link-line" x1="492" y1="245" x2="506" y2="245" marker-end="url(#arrow)" />
  <line class="link-line" x1="584" y1="245" x2="598" y2="245" marker-end="url(#arrow)" />
  <!-- L0 -->
  <line class="link-line" x1="398" y1="300" x2="414" y2="300" marker-end="url(#arrow)" />
  <line class="link-line" x1="492" y1="300" x2="506" y2="300" marker-end="url(#arrow)" />
  <line class="link-line" x1="584" y1="300" x2="598" y2="300" marker-end="url(#arrow)" />

  <!-- Animated Search Path -->
  <path class="traverse-path" d="M 376 135 L 454 135 L 454 190 L 500 190 L 500 300" marker-end="url(#arrow-cyan)" />

  <!-- Animated Promoted Node: player_42 -->
  <g class="player-move">
    <rect class="node-promoted" x="448" y="400" width="176" height="52" />
    <text class="mono" x="462" y="421" fill="#ecfdf5">player_42  (5,450)</text>
    <text class="mono-sm" x="462" y="439" fill="#6ee7b7">Promoted: #4 → #2 (O(log N))</text>
  </g>

  <!-- Right Panel: Read Queries (ZREVRANGE + ZREVRANK) -->
  <rect class="panel" x="702" y="76" width="234" height="394" />
  <text class="sec-title" x="718" y="100">3. READ: TOP-K &amp; RANK</text>

  <!-- ZREVRANGE 0 9 -->
  <rect class="panel-inner" x="716" y="112" width="206" height="218" />
  <text class="mono-sm" x="726" y="130" fill="#a78bfa">ZREVRANGE ... 0 9 WITHSCORES</text>

  <!-- Top 5 Rows -->
  <rect x="724" y="142" width="190" height="28" rx="4" fill="#1e293b" />
  <text class="mono" x="732" y="160" fill="#fbbf24">#1  u_101       5,800</text>

  <rect x="724" y="176" width="190" height="30" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.2" />
  <text class="mono" x="732" y="195" fill="#ecfdf5">#2  player_42   5,450</text>
  <text class="badge-text rank-badge-pop" x="880" y="195" fill="#34d399">↑2</text>

  <rect x="724" y="212" width="190" height="28" rx="4" fill="#1e293b" />
  <text class="mono" x="732" y="230">#3  u_204       5,200</text>

  <rect x="724" y="246" width="190" height="28" rx="4" fill="#1e293b" />
  <text class="mono" x="732" y="264">#4  u_309       4,950</text>

  <rect x="724" y="280" width="190" height="28" rx="4" fill="#1e293b" />
  <text class="mono" x="732" y="298">#5  u_512       4,600</text>

  <!-- ZREVRANK Output -->
  <rect class="panel-inner" x="716" y="342" width="206" height="114" />
  <text class="mono-sm" x="726" y="362" fill="#38bdf8">ZREVRANK ... "player_42"</text>
  <text class="mono" x="726" y="388" fill="#f8fafc">0-Indexed Rank: 1</text>
  <text class="mono" x="726" y="408" fill="#34d399">Display Rank:   #2</text>
  <text class="mono-sm" x="726" y="434">Latency: &lt; 1 ms (in-memory)</text>

  <!-- Bottom Phase Timeline Bar -->
  <rect class="panel" x="24" y="484" width="912" height="40" />
  <circle class="phase-1" cx="48" cy="504" r="5" />
  <text class="label phase-1" x="60" y="508">1. ZINCRBY +650</text>

  <circle class="phase-2" cx="240" cy="504" r="5" />
  <text class="label phase-2" x="252" y="508">2. O(log N) Skip-List Search</text>

  <circle class="phase-3" cx="485" cy="504" r="5" />
  <text class="label phase-3" x="497" y="508">3. Re-Rank #4 → #2</text>

  <circle class="phase-4" cx="695" cy="504" r="5" />
  <text class="label phase-4" x="707" y="508">4. Serve ZREVRANGE &amp; ZREVRANK</text>
</svg>
