<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%" role="img" aria-label="Merge Sort Divide-and-Conquer and Merge Intervals Sweep-Line Animation">
  <style>
    .bg { fill: #0f172a; }
    .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
    .panel-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .panel-title-2 { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #10b981; }
    .sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .box { fill: #0f172a; stroke: #475569; stroke-width: 1.5; rx: 6; }
    .box-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #f1f5f9; text-anchor: middle; }
    .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94a3b8; }
    .axis-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #64748b; text-anchor: middle; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }

    /* Merge Sort 9s cycle animations */
    @keyframes fadeStage1 { 0%, 10% { opacity: 0.3; } 15%, 92% { opacity: 1; } 98%, 100% { opacity: 0.3; } }
    @keyframes fadeStage2 { 0%, 22% { opacity: 0.15; } 28%, 92% { opacity: 1; } 98%, 100% { opacity: 0.15; } }
    @keyframes fadeStage3 { 0%, 40% { opacity: 0.15; } 46%, 92% { opacity: 1; } 98%, 100% { opacity: 0.15; } }
    @keyframes out1 { 0%, 52% { opacity: 0; transform: translateY(6px); } 58%, 92% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
    @keyframes out2 { 0%, 60% { opacity: 0; transform: translateY(6px); } 66%, 92% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
    @keyframes out3 { 0%, 68% { opacity: 0; transform: translateY(6px); } 74%, 92% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
    @keyframes out4 { 0%, 76% { opacity: 0; transform: translateY(6px); } 82%, 92% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }

    .ms-split { animation: fadeStage1 9s infinite; }
    .ms-leaves { animation: fadeStage2 9s infinite; }
    .ms-sorted { animation: fadeStage3 9s infinite; }
    .ms-o1 { animation: out1 9s infinite; }
    .ms-o2 { animation: out2 9s infinite; }
    .ms-o3 { animation: out3 9s infinite; }
    .ms-o4 { animation: out4 9s infinite; }

    /* Sweep Line and Merge Intervals 9s cycle */
    @keyframes sweepMove {
      0%, 8% { transform: translateX(0px); }
      25%, 38% { transform: translateX(54px); }
      52%, 65% { transform: translateX(162px); }
      78%, 92% { transform: translateX(288px); }
      98%, 100% { transform: translateX(0px); }
    }
    @keyframes mergeBarGlow {
      0%, 24% { opacity: 0; }
      30%, 92% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes msgOverlap {
      0%, 22% { opacity: 0; }
      26%, 46% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes msgGap1 {
      0%, 48% { opacity: 0; }
      52%, 72% { opacity: 1; }
      76%, 100% { opacity: 0; }
    }
    @keyframes msgGap2 {
      0%, 74% { opacity: 0; }
      78%, 94% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    .sweep-line { animation: sweepMove 9s infinite ease-in-out; }
    .merged-1-6 { animation: mergeBarGlow 9s infinite ease-in-out; }
    .m-overlap { animation: msgOverlap 9s infinite; }
    .m-gap1 { animation: msgGap1 9s infinite; }
    .m-gap2 { animation: msgGap2 9s infinite; }
  </style>

  <!-- Outer Card -->
  <rect class="bg" width="920" height="500" rx="14" />
  <text x="28" y="38" class="title">Sorting &amp; Interval Merging: Divide-and-Conquer + Sweep-Line</text>
  <text x="28" y="58" class="sub">Merge Sort guarantees O(n log n) stable sorting; Intervals sort by start time then merge in a single O(n) pass</text>

  <!-- LEFT PANEL: MERGE SORT -->
  <rect class="panel" x="24" y="76" width="426" height="400" />
  <text x="44" y="104" class="panel-title">1. Merge Sort (Divide &amp; Conquer)</text>
  <text x="44" y="122" class="sub">Split recursively → Two-pointer merge</text>

  <!-- Level 0: [38, 27, 43, 3] -->
  <g transform="translate(145, 140)">
    <rect class="box" x="0" y="0" width="42" height="32" />
    <text x="21" y="21" class="box-txt">38</text>
    <rect class="box" x="46" y="0" width="42" height="32" />
    <text x="67" y="21" class="box-txt">27</text>
    <rect class="box" x="92" y="0" width="42" height="32" />
    <text x="113" y="21" class="box-txt">43</text>
    <rect class="box" x="138" y="0" width="42" height="32" />
    <text x="159" y="21" class="box-txt">3</text>
  </g>

  <!-- Split arrows -->
  <g class="ms-split">
    <path d="M 210 174 L 142 198" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <path d="M 264 174 L 332 198" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <text x="237" y="191" class="lbl" text-anchor="middle" fill="#38bdf8">split</text>

    <!-- Level 1: [38, 27] and [43, 3] -->
    <rect class="box" x="96" y="200" width="42" height="30" stroke="#38bdf8" />
    <text x="117" y="220" class="box-txt">38</text>
    <rect class="box" x="142" y="200" width="42" height="30" stroke="#38bdf8" />
    <text x="163" y="220" class="box-txt">27</text>

    <rect class="box" x="286" y="200" width="42" height="30" stroke="#38bdf8" />
    <text x="307" y="220" class="box-txt">43</text>
    <rect class="box" x="332" y="200" width="42" height="30" stroke="#38bdf8" />
    <text x="353" y="220" class="box-txt">3</text>
  </g>

  <!-- Level 2: Leaves -->
  <g class="ms-leaves">
    <path d="M 117 232 L 96 254" stroke="#64748b" stroke-width="1.2" fill="none" />
    <path d="M 163 232 L 184 254" stroke="#64748b" stroke-width="1.2" fill="none" />
    <path d="M 307 232 L 286 254" stroke="#64748b" stroke-width="1.2" fill="none" />
    <path d="M 353 232 L 374 254" stroke="#64748b" stroke-width="1.2" fill="none" />

    <rect class="box" x="76" y="256" width="38" height="28" />
    <text x="95" y="275" class="box-txt" font-size="13">38</text>
    <rect class="box" x="165" y="256" width="38" height="28" />
    <text x="184" y="275" class="box-txt" font-size="13">27</text>

    <rect class="box" x="266" y="256" width="38" height="28" />
    <text x="285" y="275" class="box-txt" font-size="13">43</text>
    <rect class="box" x="355" y="256" width="38" height="28" />
    <text x="374" y="275" class="box-txt" font-size="13">3</text>
  </g>

  <!-- Level 3: Sorted Subarrays + Two-Pointer Merge -->
  <g class="ms-sorted">
    <path d="M 95 286 L 117 308 M 184 286 L 163 308" stroke="#10b981" stroke-width="1.5" fill="none" />
    <path d="M 285 286 L 307 308 M 374 286 L 353 308" stroke="#10b981" stroke-width="1.5" fill="none" />

    <rect x="96" y="310" width="42" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="117" y="330" class="box-txt" fill="#6ee7b7">27</text>
    <rect x="142" y="310" width="42" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="163" y="330" class="box-txt" fill="#6ee7b7">38</text>
    <text x="140" y="354" class="lbl" text-anchor="middle" fill="#6ee7b7">i →</text>

    <rect x="286" y="310" width="42" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="307" y="330" class="box-txt" fill="#6ee7b7">3</text>
    <rect x="332" y="310" width="42" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="353" y="330" class="box-txt" fill="#6ee7b7">43</text>
    <text x="330" y="354" class="lbl" text-anchor="middle" fill="#6ee7b7">j →</text>

    <text x="237" y="329" class="lbl" text-anchor="middle" fill="#f59e0b">merge</text>
  </g>

  <!-- Final Sorted Output -->
  <rect x="138" y="370" width="198" height="44" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <g class="ms-o1">
    <rect x="147" y="376" width="40" height="32" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    <text x="167" y="397" class="box-txt" fill="#34d399">3</text>
  </g>
  <g class="ms-o2">
    <rect x="193" y="376" width="40" height="32" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    <text x="213" y="397" class="box-txt" fill="#34d399">27</text>
  </g>
  <g class="ms-o3">
    <rect x="239" y="376" width="40" height="32" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    <text x="259" y="397" class="box-txt" fill="#34d399">38</text>
  </g>
  <g class="ms-o4">
    <rect x="285" y="376" width="40" height="32" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
    <text x="305" y="397" class="box-txt" fill="#34d399">43</text>
  </g>

  <!-- Complexity Pill -->
  <rect x="84" y="432" width="306" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
  <text x="237" y="450" class="badge" fill="#38bdf8">Time: O(n log n)  |  Space: O(n)  |  Stable: Yes</text>


  <!-- RIGHT PANEL: SWEEP-LINE / MERGE INTERVALS -->
  <rect class="panel" x="470" y="76" width="426" height="400" />
  <text x="490" y="104" class="panel-title-2">2. Merge Intervals (Sort + Sweep-Line)</text>
  <text x="490" y="122" class="sub">Sort by start → Overlap if curr.start &lt;= prev.end</text>

  <!-- Timeline Axis (x=500 to x=860, 1 unit = 18px, 0..20) -->
  <line x1="500" y1="316" x2="860" y2="316" stroke="#475569" stroke-width="1.5" />
  <!-- Ticks -->
  <text x="500" y="332" class="axis-txt">0</text>
  <text x="554" y="332" class="axis-txt">3</text>
  <text x="608" y="332" class="axis-txt">6</text>
  <text x="644" y="332" class="axis-txt">8</text>
  <text x="680" y="332" class="axis-txt">10</text>
  <text x="770" y="332" class="axis-txt">15</text>
  <text x="824" y="332" class="axis-txt">18</text>

  <!-- Input Intervals -->
  <text x="490" y="154" class="lbl">Sorted Input:</text>
  <!-- [1, 3] => x = 500 + 18 = 518, w = 36 -->
  <rect x="518" y="166" width="36" height="26" rx="5" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5" />
  <text x="536" y="183" class="badge">[1,3]</text>

  <!-- [2, 6] => x = 500 + 36 = 536, w = 72 -->
  <rect x="536" y="200" width="72" height="26" rx="5" fill="#b45309" stroke="#fbbf24" stroke-width="1.5" />
  <text x="572" y="217" class="badge">[2,6]</text>

  <!-- [8, 10] => x = 500 + 144 = 644, w = 36 -->
  <rect x="644" y="166" width="36" height="26" rx="5" fill="#6d28d9" stroke="#a78bfa" stroke-width="1.5" />
  <text x="662" y="183" class="badge">[8,10]</text>

  <!-- [15, 18] => x = 500 + 270 = 770, w = 54 -->
  <rect x="770" y="166" width="54" height="26" rx="5" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
  <text x="797" y="183" class="badge">[15,18]</text>

  <!-- Merged Output Row -->
  <text x="490" y="254" class="lbl" fill="#34d399">Merged Output:</text>
  <!-- [1, 6] => x = 518, w = 90 -->
  <g class="merged-1-6">
    <rect x="518" y="264" width="90" height="28" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2" />
    <text x="563" y="282" class="badge" fill="#6ee7b7">[1, 6]</text>
  </g>
  <!-- [8, 10] -->
  <g class="m-gap1" style="animation-fill-mode: forwards;">
  </g>
  <rect x="644" y="264" width="36" height="28" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" opacity="0.85" />
  <text x="662" y="282" class="badge" fill="#6ee7b7">[8,10]</text>

  <rect x="770" y="264" width="54" height="28" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5" opacity="0.85" />
  <text x="797" y="282" class="badge" fill="#6ee7b7">[15,18]</text>

  <!-- Animated Vertical Sweep Line (starts at x=518) -->
  <g class="sweep-line">
    <line x1="518" y1="146" x2="518" y2="316" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="518" cy="146" r="4" fill="#f43f5e" />
  </g>

  <!-- Sweep Decision Box -->
  <rect x="490" y="352" width="386" height="62" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="504" y="374" class="lbl" fill="#94a3b8">Sweep-Line Check:</text>
  <text x="504" y="398" class="mono m-overlap" font-size="12" fill="#fbbf24">2 &lt;= 3 (OVERLAP) → end = max(3, 6) = 6 → [1,6]</text>
  <text x="504" y="398" class="mono m-gap1" font-size="12" fill="#a78bfa">8 &gt; 6 (NO OVERLAP) → push [1,6], curr = [8,10]</text>
  <text x="504" y="398" class="mono m-gap2" font-size="12" fill="#34d399">15 &gt; 10 (NO OVERLAP) → push [8,10], curr = [15,18]</text>

  <!-- Complexity Pill -->
  <rect x="530" y="432" width="306" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
  <text x="683" y="450" class="badge" fill="#10b981">Sort: O(n log n)  |  Sweep: O(n)  |  Space: O(1)*</text>
</svg>
