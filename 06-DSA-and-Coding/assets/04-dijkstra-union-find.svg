<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Dijkstra Edge Relaxation and Union-Find Path Compression</title>
  <desc id="desc">Side-by-side animation of Dijkstra's shortest path algorithm relaxing edges via a min-heap PriorityQueue and Union-Find find(x) flattening a chain via path compression.</desc>

  <defs>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>

    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 14; }
      .header-title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .header-sub { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .panel-title-dijk { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #34d399; }
      .panel-title-uf { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #fbbf24; }
      .badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; }
      .edge { stroke: #475569; stroke-width: 2.5; fill: none; }
      .weight-bg { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 4; }
      .weight-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #cbd5e1; text-anchor: middle; dominant-baseline: central; }
      .node-base { fill: #0f172a; stroke: #64748b; stroke-width: 2.5; }
      .node-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 700; fill: #f8fafc; text-anchor: middle; dominant-baseline: central; }
      .dist-pill { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #34d399; text-anchor: middle; }
      .box-bg { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 8; }
      .box-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #94a3b8; }
      .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #e2e8f0; }

      /* Dijkstra Animations (9s loop) */
      @keyframes d-node0 {
        0%, 5% { fill: #0f172a; stroke: #64748b; }
        10%, 90% { fill: #065f46; stroke: #34d399; }
        96%, 100% { fill: #0f172a; stroke: #64748b; }
      }
      @keyframes d-node2 {
        0%, 22% { fill: #0f172a; stroke: #64748b; }
        28%, 90% { fill: #065f46; stroke: #34d399; }
        96%, 100% { fill: #0f172a; stroke: #64748b; }
      }
      @keyframes d-node1 {
        0%, 44% { fill: #0f172a; stroke: #64748b; }
        50%, 90% { fill: #065f46; stroke: #34d399; }
        96%, 100% { fill: #0f172a; stroke: #64748b; }
      }
      @keyframes d-node3 {
        0%, 66% { fill: #0f172a; stroke: #64748b; }
        72%, 90% { fill: #065f46; stroke: #34d399; }
        96%, 100% { fill: #0f172a; stroke: #64748b; }
      }
      @keyframes relax-edge {
        0%, 28% { stroke: #475569; stroke-width: 2.5; }
        34%, 90% { stroke: #34d399; stroke-width: 3.5; }
        96%, 100% { stroke: #475569; stroke-width: 2.5; }
      }
      @keyframes relax-edge2 {
        0%, 50% { stroke: #475569; stroke-width: 2.5; }
        56%, 90% { stroke: #34d399; stroke-width: 3.5; }
        96%, 100% { stroke: #475569; stroke-width: 2.5; }
      }
      @keyframes step-1 { 0%, 6% { opacity: 0.25; } 10%, 30% { opacity: 1; } 35%, 100% { opacity: 0.25; } }
      @keyframes step-2 { 0%, 30% { opacity: 0.25; } 34%, 56% { opacity: 1; } 60%, 100% { opacity: 0.25; } }
      @keyframes step-3 { 0%, 56% { opacity: 0.25; } 60%, 88% { opacity: 1; } 94%, 100% { opacity: 0.25; } }

      .dn0 { animation: d-node0 9s infinite; }
      .dn2 { animation: d-node2 9s infinite; }
      .dn1 { animation: d-node1 9s infinite; }
      .dn3 { animation: d-node3 9s infinite; }
      .e-02 { animation: relax-edge 9s infinite; }
      .e-21 { animation: relax-edge 9s infinite; }
      .e-13 { animation: relax-edge2 9s infinite; }
      .s1 { animation: step-1 9s infinite; }
      .s2 { animation: step-2 9s infinite; }
      .s3 { animation: step-3 9s infinite; }

      /* Union-Find Path Compression (9s loop) */
      @keyframes uf-chain-fade {
        0%, 42% { opacity: 1; }
        52%, 88% { opacity: 0.12; }
        95%, 100% { opacity: 1; }
      }
      @keyframes uf-flat-show {
        0%, 44% { opacity: 0; }
        54%, 88% { opacity: 1; }
        95%, 100% { opacity: 0; }
      }
      @keyframes uf-find-glow {
        0%, 10% { fill: #0f172a; stroke: #64748b; }
        16%, 88% { fill: #78350f; stroke: #fbbf24; }
        95%, 100% { fill: #0f172a; stroke: #64748b; }
      }
      .uf-before { animation: uf-chain-fade 9s infinite; }
      .uf-after { animation: uf-flat-show 9s infinite; }
      .uf-glow { animation: uf-find-glow 9s infinite; }
    </style>
  </defs>

  <rect width="960" height="520" class="bg" />

  <!-- Top Header -->
  <text x="28" y="34" class="header-title">Weighted Shortest Path &amp; Disjoint Set Optimization</text>
  <text x="28" y="54" class="header-sub">Dijkstra's PriorityQueue edge relaxation vs Union-Find find(x) path compression to root</text>

  <!-- LEFT PANEL: DIJKSTRA -->
  <rect x="24" y="72" width="444" height="424" class="panel" />
  <text x="44" y="102" class="panel-title-dijk">Dijkstra's Algorithm</text>
  <rect x="308" y="84" width="142" height="24" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1" />
  <text x="379" y="100" text-anchor="middle" class="badge" fill="#6ee7b7">Min-Heap O((V+E)logV)</text>

  <!-- Graph Edges -->
  <!-- 0 -> 1 (w=4) -->
  <line x1="126" y1="210" x2="224" y2="152" class="edge" marker-end="url(#arrow-dim)" />
  <rect x="160" y="162" width="24" height="18" class="weight-bg" />
  <text x="172" y="171" class="weight-text">4</text>

  <!-- 0 -> 2 (w=1) -->
  <line x1="126" y1="234" x2="224" y2="292" class="edge e-02" marker-end="url(#arrow-emerald)" />
  <rect x="160" y="256" width="24" height="18" class="weight-bg" />
  <text x="172" y="265" class="weight-text">1</text>

  <!-- 2 -> 1 (w=2) -->
  <line x1="246" y1="280" x2="246" y2="168" class="edge e-21" marker-end="url(#arrow-emerald)" />
  <rect x="254" y="216" width="24" height="18" class="weight-bg" />
  <text x="266" y="225" class="weight-text">2</text>

  <!-- 2 -> 3 (w=5) -->
  <line x1="268" y1="292" x2="364" y2="234" class="edge" marker-end="url(#arrow-dim)" />
  <rect x="304" y="256" width="24" height="18" class="weight-bg" />
  <text x="316" y="265" class="weight-text">5</text>

  <!-- 1 -> 3 (w=1) -->
  <line x1="268" y1="152" x2="364" y2="210" class="edge e-13" marker-end="url(#arrow-emerald)" />
  <rect x="304" y="162" width="24" height="18" class="weight-bg" />
  <text x="316" y="171" class="weight-text">1</text>

  <!-- Graph Nodes -->
  <circle cx="106" cy="222" r="22" class="node-base dn0" />
  <text x="106" y="222" class="node-text">0</text>
  <text x="106" y="258" class="dist-pill">d=0</text>

  <circle cx="246" cy="142" r="22" class="node-base dn1" />
  <text x="246" y="142" class="node-text">1</text>
  <text x="246" y="112" class="dist-pill">d: ∞ → 4 → 3</text>

  <circle cx="246" cy="302" r="22" class="node-base dn2" />
  <text x="246" y="302" class="node-text">2</text>
  <text x="246" y="338" class="dist-pill">d: ∞ → 1</text>

  <circle cx="386" cy="222" r="22" class="node-base dn3" />
  <text x="386" y="222" class="node-text">3</text>
  <text x="386" y="258" class="dist-pill">d: ∞ → 6 → 4</text>

  <!-- Dijkstra PriorityQueue Box -->
  <rect x="44" y="366" width="404" height="112" class="box-bg" />
  <text x="58" y="388" class="box-label">RELAXATION: if (dist[u] + w &lt; dist[v])</text>

  <g class="s1">
    <rect x="58" y="398" width="118" height="26" rx="5" fill="#065f46" stroke="#34d399" stroke-width="1" />
    <text x="117" y="415" text-anchor="middle" class="code-text">PQ: (1,2),(4,1)</text>
  </g>
  <g class="s2">
    <rect x="184" y="398" width="132" height="26" rx="5" fill="#065f46" stroke="#34d399" stroke-width="1" />
    <text x="250" y="415" text-anchor="middle" class="code-text">1+2 &lt; 4: d[1]=3</text>
  </g>
  <g class="s3">
    <rect x="324" y="398" width="112" height="26" rx="5" fill="#065f46" stroke="#34d399" stroke-width="1" />
    <text x="380" y="415" text-anchor="middle" class="code-text">3+1 &lt; 6: d[3]=4</text>
  </g>

  <text x="58" y="452" class="box-label">FINAL DISTANCES:</text>
  <text x="184" y="452" class="code-text" fill="#6ee7b7">[0: 0, 1: 3, 2: 1, 3: 4]</text>
  <text x="58" y="468" class="box-label">Skip stale entries: if (d &gt; distance[u]) continue;</text>

  <!-- RIGHT PANEL: UNION-FIND -->
  <rect x="492" y="72" width="444" height="424" class="panel" />
  <text x="512" y="102" class="panel-title-uf">Union-Find (Path Compression)</text>
  <rect x="802" y="84" width="114" height="24" rx="6" fill="#78350f" stroke="#fbbf24" stroke-width="1" />
  <text x="859" y="100" text-anchor="middle" class="badge" fill="#fde68a">Amortized O(α(n))</text>

  <!-- Root Node 0 -->
  <circle cx="714" cy="144" r="22" class="node-base uf-glow" />
  <text x="714" y="144" class="node-text">0</text>
  <text x="752" y="144" class="box-label" fill="#fbbf24">root</text>

  <!-- Node 1 (always direct child of 0) -->
  <line x1="600" y1="210" x2="694" y2="156" class="edge" marker-end="url(#arrow-dim)" />
  <circle cx="584" cy="224" r="20" class="node-base" />
  <text x="584" y="224" class="node-text">1</text>

  <!-- BEFORE: Skewed Chain 4 -> 3 -> 2 -> 0 -->
  <g class="uf-before">
    <line x1="714" y1="196" x2="714" y2="170" class="edge" stroke="#f59e0b" marker-end="url(#arrow-amber)" />
    <line x1="774" y1="256" x2="732" y2="226" class="edge" stroke="#f59e0b" marker-end="url(#arrow-amber)" />
    <line x1="834" y1="312" x2="802" y2="282" class="edge" stroke="#f59e0b" marker-end="url(#arrow-amber)" />

    <circle cx="714" cy="218" r="20" class="node-base uf-glow" />
    <text x="714" y="218" class="node-text">2</text>

    <circle cx="786" cy="268" r="20" class="node-base uf-glow" />
    <text x="786" y="268" class="node-text">3</text>

    <circle cx="848" cy="322" r="20" class="node-base uf-glow" />
    <text x="848" y="322" class="node-text">4</text>
    <text x="848" y="354" class="box-label" text-anchor="middle" fill="#fbbf24">find(4)</text>
  </g>

  <!-- AFTER: Flattened directly to root 0 -->
  <g class="uf-after">
    <line x1="696" y1="238" x2="708" y2="170" class="edge" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-amber)" />
    <line x1="774" y1="238" x2="728" y2="164" class="edge" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-amber)" />
    <line x1="846" y1="238" x2="734" y2="156" class="edge" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-amber)" />

    <circle cx="692" cy="258" r="20" class="node-base uf-glow" />
    <text x="692" y="258" class="node-text">2</text>

    <circle cx="776" cy="258" r="20" class="node-base uf-glow" />
    <text x="776" y="258" class="node-text">3</text>

    <circle cx="854" cy="258" r="20" class="node-base uf-glow" />
    <text x="854" y="258" class="node-text">4</text>
    <text x="774" y="302" class="box-label" text-anchor="middle" fill="#fde68a">parent[2]=0, parent[3]=0, parent[4]=0</text>
  </g>

  <!-- Union-Find Code & State Box -->
  <rect x="512" y="366" width="404" height="112" class="box-bg" />
  <text x="526" y="388" class="box-label">PATH COMPRESSION IN find(x):</text>
  <text x="526" y="410" class="code-text" fill="#fde68a">if (parent[x] != x) parent[x] = find(parent[x]);</text>
  <text x="526" y="434" class="box-label">UNION BY RANK:</text>
  <text x="526" y="454" class="code-text">Attach smaller rank tree under larger rank root</text>
  <text x="526" y="470" class="box-label">Prevents O(n) chains; subsequent find() is O(1)</text>
</svg>
