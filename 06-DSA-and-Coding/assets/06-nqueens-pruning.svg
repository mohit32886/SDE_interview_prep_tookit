<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-labelledby="title2 desc2">
  <title id="title2">4-Queens Constraint Pruning and Backtracking</title>
  <desc id="desc2">Animated 4x4 chessboard demonstrating early pruning with cols, diag1, and diag2 sets, backtracking from dead ends to a valid 4-Queens solution.</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.2; }
      .cell-dark { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .cell-light { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .q-text { font-size: 32px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
      .x-text { font-size: 24px; font-weight: 800; text-anchor: middle; dominant-baseline: central; fill: #fb7185; }

      /* 12s cycle:
         0-38%: Dead-end branch Q@(0,0), Q@(1,2), row 2 all pruned
         40-46%: Backtrack flash
         48-92%: Valid solution (0,1), (1,3), (2,0), (3,2)
      */
      @keyframes branch1Q00 {
        0%, 3% { opacity: 0; }
        5%, 38% { opacity: 1; }
        42%, 100% { opacity: 0; }
      }
      @keyframes branch1Q12 {
        0%, 10% { opacity: 0; }
        12%, 34% { opacity: 1; }
        38%, 100% { opacity: 0; }
      }
      @keyframes branch1Prune {
        0%, 17% { opacity: 0; }
        20%, 33% { opacity: 1; }
        37%, 100% { opacity: 0; }
      }

      @keyframes solQ01 {
        0%, 44% { opacity: 0; }
        47%, 92% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes solQ13 {
        0%, 52% { opacity: 0; }
        55%, 92% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes solQ20 {
        0%, 60% { opacity: 0; }
        63%, 92% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }
      @keyframes solQ32 {
        0%, 68% { opacity: 0; }
        71%, 92% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      @keyframes stepDead {
        0%, 18% { opacity: 0.35; }
        20%, 38% { opacity: 1; }
        42%, 100% { opacity: 0.35; }
      }
      @keyframes stepBack {
        0%, 37% { opacity: 0.35; }
        39%, 47% { opacity: 1; }
        50%, 100% { opacity: 0.35; }
      }
      @keyframes stepSol {
        0%, 68% { opacity: 0.35; }
        71%, 92% { opacity: 1; }
        96%, 100% { opacity: 0.35; }
      }

      .b1-q00 { animation: branch1Q00 12s infinite; }
      .b1-q12 { animation: branch1Q12 12s infinite; }
      .b1-prune { animation: branch1Prune 12s infinite; }
      .sol-01 { animation: solQ01 12s infinite; }
      .sol-13 { animation: solQ13 12s infinite; }
      .sol-20 { animation: solQ20 12s infinite; }
      .sol-32 { animation: solQ32 12s infinite; }
      .st-dead { animation: stepDead 12s infinite; }
      .st-back { animation: stepBack 12s infinite; }
      .st-sol { animation: stepSol 12s infinite; }
    </style>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="916" height="516" rx="16" class="card"/>

  <!-- Header -->
  <text x="28" y="34" class="sans" font-size="18" font-weight="700" fill="#f8fafc">4-Queens: Constraint Pruning &amp; Backtracking</text>
  <text x="28" y="54" class="sans" font-size="12.5" fill="#94a3b8">Early O(1) conflict rejection via cols, diag1 (row - col), and diag2 (row + col)</text>

  <!-- Legend -->
  <g transform="translate(565, 20)">
    <rect x="0" y="0" width="96" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="48" y="17" class="sans" font-size="11.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">Valid Q</text>
    <rect x="104" y="0" width="106" height="26" rx="13" fill="#4c0519" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="157" y="17" class="sans" font-size="11.5" font-weight="600" fill="#fda4af" text-anchor="middle">Pruned (X)</text>
    <rect x="218" y="0" width="112" height="26" rx="13" fill="#451a03" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="274" y="17" class="sans" font-size="11.5" font-weight="600" fill="#fcd34d" text-anchor="middle">Backtrack</text>
  </g>

  <!-- Left Panel: 4x4 Board -->
  <rect x="24" y="72" width="400" height="422" rx="12" class="panel"/>
  <text x="42" y="96" class="sans" font-size="13" font-weight="700" fill="#cbd5e1">4x4 CHESSBOARD STATE</text>

  <!-- Column headers -->
  <text x="108" y="122" class="mono" font-size="12" fill="#94a3b8" text-anchor="middle">c=0</text>
  <text x="184" y="122" class="mono" font-size="12" fill="#94a3b8" text-anchor="middle">c=1</text>
  <text x="260" y="122" class="mono" font-size="12" fill="#94a3b8" text-anchor="middle">c=2</text>
  <text x="336" y="122" class="mono" font-size="12" fill="#94a3b8" text-anchor="middle">c=3</text>

  <!-- Row headers -->
  <text x="48" y="174" class="mono" font-size="12" fill="#94a3b8" text-anchor="middle">r=0</text>
  <text x="48" y="250" class="mono" font-size="12" fill="#94a3b8" text-anchor="middle">r=1</text>
  <text x="48" y="326" class="mono" font-size="12" fill="#94a3b8" text-anchor="middle">r=2</text>
  <text x="48" y="402" class="mono" font-size="12" fill="#94a3b8" text-anchor="middle">r=3</text>

  <!-- 4x4 Grid (origin x=70, y=132, cell=76) -->
  <!-- Row 0 -->
  <rect x="70" y="132" width="76" height="76" class="cell-light"/>
  <rect x="146" y="132" width="76" height="76" class="cell-dark"/>
  <rect x="222" y="132" width="76" height="76" class="cell-light"/>
  <rect x="298" y="132" width="76" height="76" class="cell-dark"/>
  <!-- Row 1 -->
  <rect x="70" y="208" width="76" height="76" class="cell-dark"/>
  <rect x="146" y="208" width="76" height="76" class="cell-light"/>
  <rect x="222" y="208" width="76" height="76" class="cell-dark"/>
  <rect x="298" y="208" width="76" height="76" class="cell-light"/>
  <!-- Row 2 -->
  <rect x="70" y="284" width="76" height="76" class="cell-light"/>
  <rect x="146" y="284" width="76" height="76" class="cell-dark"/>
  <rect x="222" y="284" width="76" height="76" class="cell-light"/>
  <rect x="298" y="284" width="76" height="76" class="cell-dark"/>
  <!-- Row 3 -->
  <rect x="70" y="360" width="76" height="76" class="cell-dark"/>
  <rect x="146" y="360" width="76" height="76" class="cell-light"/>
  <rect x="222" y="360" width="76" height="76" class="cell-dark"/>
  <rect x="298" y="360" width="76" height="76" class="cell-light"/>

  <!-- Branch 1 (Dead End): Q@(0,0), Q@(1,2), Row 2 all pruned -->
  <g class="b1-q00">
    <rect x="74" y="136" width="68" height="68" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="108" y="170" class="sans q-text" fill="#7dd3fc">Q</text>
  </g>
  <g class="b1-q12">
    <rect x="226" y="212" width="68" height="68" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text x="260" y="246" class="sans q-text" fill="#7dd3fc">Q</text>
  </g>
  <g class="b1-prune">
    <rect x="74" y="288" width="68" height="68" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
    <text x="108" y="316" class="sans x-text">X</text>
    <text x="108" y="342" class="mono" font-size="10" fill="#fda4af" text-anchor="middle">col 0</text>

    <rect x="150" y="288" width="68" height="68" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
    <text x="184" y="316" class="sans x-text">X</text>
    <text x="184" y="342" class="mono" font-size="10" fill="#fda4af" text-anchor="middle">diag2=3</text>

    <rect x="226" y="288" width="68" height="68" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
    <text x="260" y="316" class="sans x-text">X</text>
    <text x="260" y="342" class="mono" font-size="10" fill="#fda4af" text-anchor="middle">col 2</text>

    <rect x="302" y="288" width="68" height="68" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="2"/>
    <text x="336" y="316" class="sans x-text">X</text>
    <text x="336" y="342" class="mono" font-size="10" fill="#fda4af" text-anchor="middle">diag1=-1</text>
  </g>

  <!-- Branch 2 (Valid Solution): (0,1), (1,3), (2,0), (3,2) -->
  <g class="sol-01">
    <rect x="150" y="136" width="68" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
    <text x="184" y="170" class="sans q-text" fill="#6ee7b7">Q</text>
  </g>
  <g class="sol-13">
    <rect x="302" y="212" width="68" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
    <text x="336" y="246" class="sans q-text" fill="#6ee7b7">Q</text>
  </g>
  <g class="sol-20">
    <rect x="74" y="288" width="68" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
    <text x="108" y="322" class="sans q-text" fill="#6ee7b7">Q</text>
  </g>
  <g class="sol-32">
    <rect x="226" y="364" width="68" height="68" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
    <text x="260" y="398" class="sans q-text" fill="#6ee7b7">Q</text>
  </g>

  <!-- Board Footer -->
  <text x="222" y="468" class="mono" font-size="12" fill="#94a3b8" text-anchor="middle">Solution: [".Q..", "...Q", "Q...", "..Q."]</text>

  <!-- Right Panel: O(1) HashSet Pruning & Trace -->
  <rect x="442" y="72" width="454" height="422" rx="12" class="panel"/>
  <text x="462" y="96" class="sans" font-size="13" font-weight="700" fill="#cbd5e1">O(1) CONSTRAINT SETS &amp; SEARCH TRACE</text>

  <!-- 3 Constraint Set Cards -->
  <g transform="translate(462, 114)">
    <rect x="0" y="0" width="132" height="72" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="22" class="mono" font-size="12" font-weight="700" fill="#7dd3fc">cols</text>
    <text x="12" y="40" class="sans" font-size="11" fill="#94a3b8">Tracks used col</text>
    <text x="12" y="58" class="mono" font-size="11" fill="#e2e8f0">{1, 3, 0, 2}</text>

    <rect x="141" y="0" width="132" height="72" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="153" y="22" class="mono" font-size="12" font-weight="700" fill="#c4b5fd">diag1</text>
    <text x="153" y="40" class="sans" font-size="11" fill="#94a3b8">row - col (\)</text>
    <text x="153" y="58" class="mono" font-size="11" fill="#e2e8f0">{-1, -2, 2, 1}</text>

    <rect x="282" y="0" width="132" height="72" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="294" y="22" class="mono" font-size="12" font-weight="700" fill="#fcd34d">diag2</text>
    <text x="294" y="40" class="sans" font-size="11" fill="#94a3b8">row + col (/)</text>
    <text x="294" y="58" class="mono" font-size="11" fill="#e2e8f0">{1, 4, 2, 5}</text>
  </g>

  <!-- Search Trace Steps -->
  <g transform="translate(462, 206)">
    <!-- Step 1: Dead End -->
    <g class="st-dead">
      <rect x="0" y="0" width="414" height="78" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="14" y="22" class="sans" font-size="12.5" font-weight="700" fill="#fda4af">1. Branch (0,0) → (1,2): Pruned at Row 2</text>
      <text x="14" y="42" class="mono" font-size="11.5" fill="#fecdd3">c=0 (col), c=1 (diag2), c=2 (col), c=3 (diag1)</text>
      <text x="14" y="61" class="sans" font-size="11.5" fill="#fda4af">0 valid columns remain → prune entire subtree early</text>
    </g>

    <!-- Step 2: Backtrack -->
    <g class="st-back" transform="translate(0, 90)">
      <rect x="0" y="0" width="414" height="66" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="14" y="22" class="sans" font-size="12.5" font-weight="700" fill="#fcd34d">2. Backtrack &amp; Undo State</text>
      <text x="14" y="42" class="mono" font-size="11.5" fill="#fde68a">board[r][c] = '.'; cols.remove(c); diag.remove(...)</text>
      <text x="14" y="58" class="sans" font-size="11" fill="#fcd34d">Unwinds to row 0 and tries next column c = 1</text>
    </g>

    <!-- Step 3: Solution -->
    <g class="st-sol" transform="translate(0, 168)">
      <rect x="0" y="0" width="414" height="96" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="14" y="22" class="sans" font-size="12.5" font-weight="700" fill="#6ee7b7">3. Valid Solution Found (row == n)</text>
      <text x="14" y="42" class="mono" font-size="11.5" fill="#a7f3d0">Q@(0,1) → Q@(1,3) → Q@(2,0) → Q@(3,2)</text>
      <text x="14" y="61" class="sans" font-size="11.5" fill="#d1fae5">All 4 queens have distinct cols, diag1, and diag2.</text>
      <text x="14" y="80" class="mono" font-size="11" fill="#6ee7b7">result.add(buildResult(board)); // O(N!) worst-case</text>
    </g>
  </g>
</svg>
