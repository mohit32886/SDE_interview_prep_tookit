<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" role="img" aria-label="Top-K Frequent Elements animation showing Frequency HashMap feeding a size-K Min-Heap that evicts the smallest frequency when size exceeds K">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .card-amber { fill: #1e293b; stroke: #d97706; stroke-width: 1.5; rx: 12; }
      .card-emerald { fill: #1e293b; stroke: #10b981; stroke-width: 1.5; rx: 12; }
      .title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #cbd5e1; }
      .mono-bold { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .badge-cyan { fill: #0c4a6e; stroke: #38bdf8; stroke-width: 1.5; }
      .badge-red { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; }
      .badge-emerald { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; }
      .badge-amber { fill: #78350f; stroke: #fbbf24; stroke-width: 1.5; }
      .edge { stroke: #475569; stroke-width: 2; fill: none; }
      .dash-arrow { stroke: #38bdf8; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }

      @keyframes dashFlow {
        to { stroke-dashoffset: -18; }
      }
      @keyframes evictDrop {
        0%, 25% { transform: translate(0px, 0px); opacity: 1; }
        45% { transform: translate(0px, 0px); opacity: 1; }
        70% { transform: translate(0px, 44px); opacity: 0; }
        100% { transform: translate(0px, 44px); opacity: 0; }
      }
      @keyframes offerSlide {
        0%, 10% { opacity: 0.35; }
        25%, 55% { opacity: 1; }
        75%, 100% { opacity: 0.35; }
      }
      @keyframes resultGlow {
        0%, 60% { stroke: #10b981; stroke-width: 1.5; }
        78%, 95% { stroke: #34d399; stroke-width: 2.8; }
        100% { stroke: #10b981; stroke-width: 1.5; }
      }

      .flow-anim { animation: dashFlow 1.2s linear infinite; }
      .evict-node { animation: evictDrop 7s infinite ease-in-out; }
      .offer-pulse { animation: offerSlide 7s infinite ease-in-out; }
      .result-card { animation: resultGlow 7s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="880" height="430" rx="14" />

  <!-- Header -->
  <text x="28" y="36" class="title">Top-K Frequent Elements (HashMap + Size-K Min-Heap)</text>
  <text x="28" y="56" class="subtitle">Count frequencies in O(n), then keep only the K largest frequencies using a Min-Heap of size K = 2</text>

  <!-- Complexity Pill -->
  <rect x="640" y="20" width="212" height="32" rx="8" class="badge-emerald" />
  <text x="746" y="40" text-anchor="middle" class="mono-bold" fill="#6ee7b7">Time: O(n log k) · Space: O(n)</text>

  <!-- Step 1: Frequency HashMap -->
  <rect x="28" y="78" width="246" height="270" rx="12" class="card" />
  <text x="46" y="106" class="label" fill="#38bdf8">1. Frequency HashMap</text>
  <text x="46" y="124" class="mono" fill="#94a3b8">nums = [1,1,1,2,2,3,4,4,4,4]</text>

  <g transform="translate(46, 144)">
    <rect x="0" y="0" width="210" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="16" y="23" class="mono-bold" fill="#38bdf8">key: 1</text>
    <text x="194" y="23" text-anchor="end" class="mono-bold" fill="#34d399">freq: 3</text>

    <rect x="0" y="48" width="210" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="16" y="71" class="mono-bold" fill="#38bdf8">key: 2</text>
    <text x="194" y="71" text-anchor="end" class="mono-bold" fill="#fbbf24">freq: 2</text>

    <rect x="0" y="96" width="210" height="36" rx="8" fill="#0f172a" stroke="#f87171" />
    <text x="16" y="119" class="mono-bold" fill="#38bdf8">key: 3</text>
    <text x="194" y="119" text-anchor="end" class="mono-bold" fill="#f87171">freq: 1</text>

    <rect x="0" y="144" width="210" height="36" rx="8" fill="#0f172a" stroke="#34d399" />
    <text x="16" y="167" class="mono-bold" fill="#38bdf8">key: 4</text>
    <text x="194" y="167" text-anchor="end" class="mono-bold" fill="#34d399">freq: 4</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 280 212 L 326 212" class="dash-arrow flow-anim" />
  <polygon points="326,212 317,207 317,217" fill="#38bdf8" />

  <!-- Step 2: Size-K Min-Heap -->
  <rect x="332" y="78" width="300" height="270" rx="12" class="card-amber" />
  <text x="350" y="106" class="label" fill="#fbbf24">2. Min-Heap (Max Size K = 2)</text>
  <text x="350" y="124" class="mono" fill="#94a3b8">Root = smallest frequency in heap</text>

  <!-- Heap Tree -->
  <line x1="482" y1="176" x2="412" y2="244" class="edge" />
  <line x1="482" y1="176" x2="552" y2="244" class="edge" />

  <!-- Root -->
  <rect x="434" y="150" width="96" height="44" rx="10" class="badge-cyan" />
  <text x="482" y="170" text-anchor="middle" class="mono-bold">val: 1</text>
  <text x="482" y="186" text-anchor="middle" class="mono" fill="#7dd3fc">freq = 3</text>

  <!-- Right Child (kept) -->
  <rect x="504" y="226" width="96" height="44" rx="10" class="badge-emerald offer-pulse" />
  <text x="552" y="246" text-anchor="middle" class="mono-bold">val: 4</text>
  <text x="552" y="262" text-anchor="middle" class="mono" fill="#6ee7b7">freq = 4</text>

  <!-- Left Child (evicted when size > K) -->
  <g class="evict-node">
    <rect x="364" y="226" width="96" height="44" rx="10" class="badge-red" />
    <text x="412" y="246" text-anchor="middle" class="mono-bold" fill="#fecaca">val: 2</text>
    <text x="412" y="262" text-anchor="middle" class="mono" fill="#fca5a5">freq = 2 (evict)</text>
  </g>

  <rect x="350" y="298" width="264" height="34" rx="8" fill="#0f172a" stroke="#475569" />
  <text x="482" y="319" text-anchor="middle" class="mono" fill="#fde68a">if (heap.size() &gt; k) heap.poll();</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 638 212 L 684 212" class="dash-arrow flow-anim" />
  <polygon points="684,212 675,207 675,217" fill="#38bdf8" />

  <!-- Step 3: Top-K Result -->
  <rect x="690" y="78" width="162" height="270" rx="12" class="card-emerald result-card" />
  <text x="708" y="106" class="label" fill="#34d399">3. Top-K Result</text>
  <text x="708" y="124" class="mono" fill="#94a3b8">Remaining in heap</text>

  <rect x="712" y="156" width="118" height="48" rx="10" class="badge-emerald" />
  <text x="771" y="178" text-anchor="middle" class="mono-bold" fill="#6ee7b7">val: 1</text>
  <text x="771" y="195" text-anchor="middle" class="mono" fill="#a7f3d0">freq = 3</text>

  <rect x="712" y="220" width="118" height="48" rx="10" class="badge-emerald" />
  <text x="771" y="242" text-anchor="middle" class="mono-bold" fill="#6ee7b7">val: 4</text>
  <text x="771" y="259" text-anchor="middle" class="mono" fill="#a7f3d0">freq = 4</text>

  <rect x="712" y="294" width="118" height="36" rx="8" fill="#0f172a" stroke="#34d399" />
  <text x="771" y="317" text-anchor="middle" class="mono-bold" fill="#34d399">[1, 4]</text>

  <!-- Footer Note -->
  <rect x="28" y="364" width="824" height="46" rx="10" class="card" />
  <text x="46" y="391" class="mono" fill="#cbd5e1">Why Min-Heap? The smallest frequency stays at the root for O(1) peek and O(log k) eviction, leaving only the K largest.</text>
</svg>
