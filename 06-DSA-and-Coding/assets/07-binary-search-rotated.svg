<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" height="100%" role="img" aria-label="Binary Search in Rotated Sorted Array Animation">
  <style>
    .bg { fill: #0f172a; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .cell-box { fill: #0f172a; stroke: #475569; stroke-width: 2; rx: 8; }
    .cell-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #f1f5f9; text-anchor: middle; }
    .cell-idx { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #64748b; text-anchor: middle; }
    .badge-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; fill: #0f172a; }
    .step-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .step-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #cbd5e1; }
    .pill-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #e2e8f0; }

    /* Cell dimming across 10s cycle:
       Step 1 (0%-30%): all 0..6 active
       Step 2 (33%-63%): 0..3 discarded (dimmed), 4..6 active
       Step 3 (66%-95%): 5..6 discarded (dimmed), 4 active and found
       Reset (95%-100%): back to step 1
    */
    @keyframes dimLeftHalf {
      0%, 31% { opacity: 1; }
      35%, 94% { opacity: 0.22; }
      98%, 100% { opacity: 1; }
    }
    @keyframes dimRightHalf {
      0%, 64% { opacity: 1; }
      68%, 94% { opacity: 0.22; }
      98%, 100% { opacity: 1; }
    }
    @keyframes foundPulse {
      0%, 65% { stroke: #475569; stroke-width: 2; fill: #0f172a; }
      70%, 93% { stroke: #10b981; stroke-width: 3.5; fill: #064e3b; }
      98%, 100% { stroke: #475569; stroke-width: 2; fill: #0f172a; }
    }
    .left-discard { animation: dimLeftHalf 10s infinite ease-in-out; }
    .right-discard { animation: dimRightHalf 10s infinite ease-in-out; }
    .target-cell { animation: foundPulse 10s infinite ease-in-out; }

    /* Pointer X translations (cell centers: 130, 235, 340, 445, 550, 655, 760)
       Delta from index 0 (x=130):
       idx 0 -> 0px
       idx 3 -> +315px
       idx 4 -> +420px
       idx 5 -> +525px
       idx 6 -> +630px
    */
    @keyframes moveLow {
      0%, 30% { transform: translateX(0px); }
      35%, 94% { transform: translateX(420px); }
      98%, 100% { transform: translateX(0px); }
    }
    @keyframes moveMid {
      0%, 30% { transform: translateX(315px); }
      35%, 63% { transform: translateX(525px); }
      68%, 94% { transform: translateX(420px); }
      98%, 100% { transform: translateX(315px); }
    }
    @keyframes moveHigh {
      0%, 63% { transform: translateX(630px); }
      68%, 94% { transform: translateX(420px); }
      98%, 100% { transform: translateX(630px); }
    }
    .ptr-low { animation: moveLow 10s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .ptr-mid { animation: moveMid 10s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .ptr-high { animation: moveHigh 10s infinite cubic-bezier(0.4, 0, 0.2, 1); }

    /* Sorted half bracket visibility */
    @keyframes showBracket1 {
      0%, 30% { opacity: 1; }
      33%, 97% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes showBracket2 {
      0%, 33% { opacity: 0; }
      36%, 63% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes showFoundBanner {
      0%, 66% { opacity: 0; }
      70%, 94% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    .bracket-1 { animation: showBracket1 10s infinite; }
    .bracket-2 { animation: showBracket2 10s infinite; }
    .found-banner { animation: showFoundBanner 10s infinite; }

    /* Trace panel highlights */
    @keyframes trace1 {
      0%, 30% { opacity: 1; }
      34%, 96% { opacity: 0.25; }
      100% { opacity: 1; }
    }
    @keyframes trace2 {
      0%, 31% { opacity: 0.25; }
      35%, 63% { opacity: 1; }
      67%, 100% { opacity: 0.25; }
    }
    @keyframes trace3 {
      0%, 64% { opacity: 0.25; }
      68%, 94% { opacity: 1; }
      98%, 100% { opacity: 0.25; }
    }
    .t-step1 { animation: trace1 10s infinite; }
    .t-step2 { animation: trace2 10s infinite; }
    .t-step3 { animation: trace3 10s infinite; }
  </style>

  <!-- Background -->
  <rect class="bg" width="900" height="470" rx="14" />

  <!-- Header -->
  <text x="32" y="40" class="title">Binary Search in Rotated Sorted Array</text>
  <text x="32" y="64" class="subtitle">Invariant: One half is ALWAYS sorted — check if target lies in the sorted half, else discard it in O(log n)</text>

  <!-- Target & Complexity Pills -->
  <rect x="615" y="24" width="118" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="674" y="42" class="pill-txt" text-anchor="middle" fill="#38bdf8">target = 0</text>
  <rect x="745" y="24" width="123" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="806" y="42" class="pill-txt" text-anchor="middle" fill="#10b981">O(log n) | O(1)</text>

  <!-- Main Array Card -->
  <rect class="card" x="28" y="84" width="844" height="206" rx="12" />

  <!-- Sorted Half Highlight Brackets -->
  <g class="bracket-1">
    <rect x="82" y="138" width="409" height="86" rx="10" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" />
    <rect x="195" y="126" width="182" height="20" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <text x="286" y="140" class="mono" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">SORTED HALF: nums[low] &lt;= nums[mid]</text>
  </g>

  <g class="bracket-2">
    <rect x="502" y="138" width="199" height="86" rx="10" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" />
    <rect x="521" y="126" width="162" height="20" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <text x="602" y="140" class="mono" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">SORTED: 0 &lt;= 1 (left half)</text>
  </g>

  <g class="found-banner">
    <rect x="492" y="124" width="116" height="22" rx="11" fill="#10b981" />
    <text x="550" y="139" class="mono" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">FOUND! idx = 4</text>
  </g>

  <!-- 7 Array Cells: centers at 130, 235, 340, 445, 550, 655, 760 (width 84, height 64, y=150) -->
  <!-- Index 0: 4 -->
  <g class="left-discard">
    <rect class="cell-box" x="88" y="150" width="84" height="64" />
    <text x="130" y="190" class="cell-val">4</text>
    <text x="130" y="232" class="cell-idx">idx 0</text>
  </g>
  <!-- Index 1: 5 -->
  <g class="left-discard">
    <rect class="cell-box" x="193" y="150" width="84" height="64" />
    <text x="235" y="190" class="cell-val">5</text>
    <text x="235" y="232" class="cell-idx">idx 1</text>
  </g>
  <!-- Index 2: 6 -->
  <g class="left-discard">
    <rect class="cell-box" x="298" y="150" width="84" height="64" />
    <text x="340" y="190" class="cell-val">6</text>
    <text x="340" y="232" class="cell-idx">idx 2</text>
  </g>
  <!-- Index 3: 7 -->
  <g class="left-discard">
    <rect class="cell-box" x="403" y="150" width="84" height="64" />
    <text x="445" y="190" class="cell-val">7</text>
    <text x="445" y="232" class="cell-idx">idx 3</text>
  </g>
  <!-- Index 4: 0 (Target) -->
  <g>
    <rect class="cell-box target-cell" x="508" y="150" width="84" height="64" />
    <text x="550" y="190" class="cell-val" fill="#34d399">0</text>
    <text x="550" y="232" class="cell-idx">idx 4</text>
  </g>
  <!-- Index 5: 1 -->
  <g class="right-discard">
    <rect class="cell-box" x="613" y="150" width="84" height="64" />
    <text x="655" y="190" class="cell-val">1</text>
    <text x="655" y="232" class="cell-idx">idx 5</text>
  </g>
  <!-- Index 6: 2 -->
  <g class="right-discard">
    <rect class="cell-box" x="718" y="150" width="84" height="64" />
    <text x="760" y="190" class="cell-val">2</text>
    <text x="760" y="232" class="cell-idx">idx 6</text>
  </g>

  <!-- Animated Pointers (anchored at x=130) -->
  <!-- LOW pointer -->
  <g class="ptr-low">
    <polygon points="130,242 123,252 137,252" fill="#38bdf8" />
    <rect x="108" y="252" width="44" height="20" rx="5" fill="#38bdf8" />
    <text x="130" y="266" class="badge-txt">LOW</text>
  </g>

  <!-- MID pointer -->
  <g class="ptr-mid">
    <polygon points="130,114 123,104 137,104" fill="#f59e0b" />
    <rect x="108" y="88" width="44" height="20" rx="5" fill="#f59e0b" />
    <text x="130" y="102" class="badge-txt">MID</text>
  </g>

  <!-- HIGH pointer -->
  <g class="ptr-high">
    <polygon points="130,242 123,252 137,252" fill="#a855f7" />
    <rect x="105" y="274" width="50" height="18" rx="5" fill="#a855f7" />
    <text x="130" y="287" class="badge-txt">HIGH</text>
  </g>

  <!-- Execution Trace Panel -->
  <rect class="card" x="28" y="306" width="844" height="142" rx="12" />
  <text x="48" y="332" class="step-title">Execution Trace (nums = [4, 5, 6, 7, 0, 1, 2], target = 0)</text>

  <!-- Step 1 -->
  <g class="t-step1">
    <circle cx="54" cy="356" r="5" fill="#38bdf8" />
    <text x="68" y="360" class="step-code">Step 1: low=0, mid=3 (7), high=6  |  nums[0]&lt;=nums[3] (left sorted)  |  0 not in [4, 7) → low = mid + 1 = 4</text>
  </g>

  <!-- Step 2 -->
  <g class="t-step2">
    <circle cx="54" cy="388" r="5" fill="#f59e0b" />
    <text x="68" y="392" class="step-code">Step 2: low=4, mid=5 (1), high=6  |  nums[4]&lt;=nums[5] (left sorted)  |  0 in [0, 1) → high = mid - 1 = 4</text>
  </g>

  <!-- Step 3 -->
  <g class="t-step3">
    <circle cx="54" cy="420" r="5" fill="#10b981" />
    <text x="68" y="424" class="step-code" fill="#34d399">Step 3: low=4, mid=4 (0), high=4  |  nums[mid] == target (0) → Return index 4!</text>
  </g>

  <!-- Cycle progress bar -->
  <rect x="48" y="438" width="804" height="3" rx="1.5" fill="#334155" />
  <rect x="48" y="438" width="0" height="3" rx="1.5" fill="#38bdf8">
    <animate attributeName="width" values="0;804;0" keyTimes="0;0.95;1" dur="10s" repeatCount="indefinite" />
  </rect>
</svg>
