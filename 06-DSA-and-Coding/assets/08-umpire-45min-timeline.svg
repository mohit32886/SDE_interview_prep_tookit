<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" role="img" aria-labelledby="title desc">
  <title id="title">45-Minute FAANG Coding Interview Timeline (UMPIRE)</title>
  <desc>Animated timeline breaking a 45-minute coding interview into five UMPIRE phases from 0 to 45 minutes.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    @keyframes pulseP1 {
      0%, 11% { opacity: 1; transform: translateY(-3px); }
      15%, 100% { opacity: 0.72; transform: translateY(0px); }
    }
    @keyframes pulseP2 {
      0%, 10% { opacity: 0.72; transform: translateY(0px); }
      12%, 33% { opacity: 1; transform: translateY(-3px); }
      37%, 100% { opacity: 0.72; transform: translateY(0px); }
    }
    @keyframes pulseP3 {
      0%, 32% { opacity: 0.72; transform: translateY(0px); }
      34%, 77% { opacity: 1; transform: translateY(-3px); }
      81%, 100% { opacity: 0.72; transform: translateY(0px); }
    }
    @keyframes pulseP4 {
      0%, 76% { opacity: 0.72; transform: translateY(0px); }
      78%, 92% { opacity: 1; transform: translateY(-3px); }
      95%, 100% { opacity: 0.72; transform: translateY(0px); }
    }
    @keyframes pulseP5 {
      0%, 91% { opacity: 0.72; transform: translateY(0px); }
      93%, 99% { opacity: 1; transform: translateY(-3px); }
      100% { opacity: 0.72; transform: translateY(0px); }
    }

    .card-p1 { animation: pulseP1 12s ease-in-out infinite; }
    .card-p2 { animation: pulseP2 12s ease-in-out infinite; }
    .card-p3 { animation: pulseP3 12s ease-in-out infinite; }
    .card-p4 { animation: pulseP4 12s ease-in-out infinite; }
    .card-p5 { animation: pulseP5 12s ease-in-out infinite; }
  </style>

  <!-- Background Card -->
  <rect x="0" y="0" width="920" height="350" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="42" class="font-sans" font-size="19" font-weight="700" fill="#f8fafc">45-Minute FAANG Coding Interview Timeline</text>
  <text x="32" y="64" class="font-sans" font-size="13" fill="#94a3b8">UMPIRE Pacing Model: Clarify early, plan before typing, reserve time to dry-run</text>

  <!-- Live Cycle Badge -->
  <rect x="748" y="26" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="766" cy="40" r="4.5" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="778" y="44" class="font-mono" font-size="11.5" font-weight="600" fill="#e2e8f0">45 MIN CYCLE</text>

  <!-- Timeline Track (x=32 to x=888, width=856; 1 min = 19.022px) -->
  <!-- 0-5m: 95px | 5-15m: 190px | 15-35m: 381px | 35-42m: 133px | 42-45m: 57px -->
  <rect x="32" y="96" width="856" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Segment 1: 0-5m (95px) -->
  <rect x="34" y="98" width="91" height="18" rx="9" fill="#38bdf8" opacity="0.9"/>
  <!-- Segment 2: 5-15m (190px) -->
  <rect x="129" y="98" width="186" height="18" rx="4" fill="#818cf8" opacity="0.9"/>
  <!-- Segment 3: 15-35m (381px) -->
  <rect x="319" y="98" width="377" height="18" rx="4" fill="#34d399" opacity="0.9"/>
  <!-- Segment 4: 35-42m (133px) -->
  <rect x="700" y="98" width="129" height="18" rx="4" fill="#fbbf24" opacity="0.9"/>
  <!-- Segment 5: 42-45m (57px) -->
  <rect x="833" y="98" width="53" height="18" rx="9" fill="#fb7185" opacity="0.9"/>

  <!-- Animated Playhead Needle -->
  <g filter="url(#glow)">
    <line x1="34" y1="88" x2="34" y2="128" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="x1" values="34;886;34" keyTimes="0;0.96;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="34;886;34" keyTimes="0;0.96;1" dur="12s" repeatCount="indefinite"/>
    </line>
    <circle cx="34" cy="88" r="4.5" fill="#f8fafc">
      <animate attributeName="cx" values="34;886;34" keyTimes="0;0.96;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Minute Markers -->
  <text x="32" y="142" class="font-mono" font-size="11" fill="#94a3b8">0m</text>
  <text x="120" y="142" class="font-mono" font-size="11" fill="#38bdf8">5m</text>
  <text x="307" y="142" class="font-mono" font-size="11" fill="#818cf8">15m</text>
  <text x="690" y="142" class="font-mono" font-size="11" fill="#34d399">35m</text>
  <text x="822" y="142" class="font-mono" font-size="11" fill="#fbbf24">42m</text>
  <text x="868" y="142" class="font-mono" font-size="11" fill="#fb7185">45m</text>

  <!-- Phase Cards -->
  <!-- Card 1: 0-5m Understand -->
  <g class="card-p1">
    <rect x="32" y="164" width="160" height="154" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="44" y="176" width="58" height="22" rx="6" fill="#0c4a6e"/>
    <text x="53" y="191" class="font-mono" font-size="11" font-weight="700" fill="#38bdf8">0-5 min</text>
    <text x="44" y="219" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">U: Understand</text>
    <text x="44" y="241" class="font-sans" font-size="11.5" fill="#cbd5e1">- Clarify I/O format</text>
    <text x="44" y="259" class="font-sans" font-size="11.5" fill="#cbd5e1">- Check constraints</text>
    <text x="44" y="277" class="font-sans" font-size="11.5" fill="#cbd5e1">- Confirm edge cases</text>
    <text x="44" y="303" class="font-mono" font-size="10.5" fill="#38bdf8">11% of time</text>
  </g>

  <!-- Card 2: 5-15m Match & Plan -->
  <g class="card-p2">
    <rect x="206" y="164" width="160" height="154" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="218" y="176" width="66" height="22" rx="6" fill="#312e81"/>
    <text x="227" y="191" class="font-mono" font-size="11" font-weight="700" fill="#a5b4fc">5-15 min</text>
    <text x="218" y="219" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">M + P: Match &amp; Plan</text>
    <text x="218" y="241" class="font-sans" font-size="11.5" fill="#cbd5e1">- Identify DSA pattern</text>
    <text x="218" y="259" class="font-sans" font-size="11.5" fill="#cbd5e1">- Compare trade-offs</text>
    <text x="218" y="277" class="font-sans" font-size="11.5" fill="#cbd5e1">- Get green light</text>
    <text x="218" y="303" class="font-mono" font-size="10.5" fill="#a5b4fc">22% of time</text>
  </g>

  <!-- Card 3: 15-35m Implement -->
  <g class="card-p3">
    <rect x="380" y="164" width="160" height="154" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect x="392" y="176" width="72" height="22" rx="6" fill="#064e3b"/>
    <text x="400" y="191" class="font-mono" font-size="11" font-weight="700" fill="#34d399">15-35 min</text>
    <text x="392" y="219" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">I: Implement</text>
    <text x="392" y="241" class="font-sans" font-size="11.5" fill="#cbd5e1">- Clean, modular code</text>
    <text x="392" y="259" class="font-sans" font-size="11.5" fill="#cbd5e1">- Null &amp; guard checks</text>
    <text x="392" y="277" class="font-sans" font-size="11.5" fill="#cbd5e1">- Think aloud steadily</text>
    <text x="392" y="303" class="font-mono" font-size="10.5" fill="#34d399">44% of time</text>
  </g>

  <!-- Card 4: 35-42m Review & Dry-Run -->
  <g class="card-p4">
    <rect x="554" y="164" width="160" height="154" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="566" y="176" width="72" height="22" rx="6" fill="#78350f"/>
    <text x="574" y="191" class="font-mono" font-size="11" font-weight="700" fill="#fbbf24">35-42 min</text>
    <text x="566" y="219" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">R: Review &amp; Run</text>
    <text x="566" y="241" class="font-sans" font-size="11.5" fill="#cbd5e1">- Line-by-line trace</text>
    <text x="566" y="259" class="font-sans" font-size="11.5" fill="#cbd5e1">- Off-by-one audit</text>
    <text x="566" y="277" class="font-sans" font-size="11.5" fill="#cbd5e1">- Empty / dup / max</text>
    <text x="566" y="303" class="font-mono" font-size="10.5" fill="#fbbf24">16% of time</text>
  </g>

  <!-- Card 5: 42-45m Evaluate -->
  <g class="card-p5">
    <rect x="728" y="164" width="160" height="154" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
    <rect x="740" y="176" width="72" height="22" rx="6" fill="#881337"/>
    <text x="748" y="191" class="font-mono" font-size="11" font-weight="700" fill="#fb7185">42-45 min</text>
    <text x="740" y="219" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">E: Evaluate</text>
    <text x="740" y="241" class="font-sans" font-size="11.5" fill="#cbd5e1">- Big-O Time &amp; Space</text>
    <text x="740" y="259" class="font-sans" font-size="11.5" fill="#cbd5e1">- Bottleneck analysis</text>
    <text x="740" y="277" class="font-sans" font-size="11.5" fill="#cbd5e1">- Scale / follow-ups</text>
    <text x="740" y="303" class="font-mono" font-size="10.5" fill="#fb7185">7% of time</text>
  </g>
</svg>
